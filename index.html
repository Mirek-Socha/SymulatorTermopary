.nav-right{

  transition:color .15s,border-color .15s,background .15s;
  cursor:pointer;background:none;white-space:nowrap;
}
.nav-right a:hover,.theme-btn:hover{color:#f59e0b;border-color:#f59e0b;}
.theme-btn.light{background:rgba(245,158,11,.12);color:#f59e0b;border-color:rgba(245,158,11,.4);}
/* na bardzo wąskich chowaj linki zewnętrzne, zostaw tylko theme */
@media(max-width:560px){.nav-right a{display:none;}}
.frames{position:relative;flex:1;min-height:0;}
iframe{
  position:absolute;inset:0;width:100%;height:100%;

}
iframe.visible{opacity:1;pointer-events:auto;}

<style>
/* ===== CSS VARIABLES ===== */
:root {
  --radius:.55rem;
  --bg:#07070a; --surf:#0f0f15; --card:#13131a;
  --border:#22222e; --border2:#2d2d3d; --text:#e8e4de; --muted:#6b6b80;
  --amber:#f59e0b; --amber-dim:rgba(245,158,11,.12);
  --red:#ef4444; --cyan:#06b6d4; --green:#22c55e;
  --signal:#c026d3; --plot-grid:rgba(34,34,46,.9);
  --tag-bg:#1a1a24;
  color-scheme: dark;
}
.theme-dark { color-scheme: dark; }
.theme-light {
  --bg:#f5f4ef; --surf:#fffef9; --card:#f0efea;
  --border:#d4d0c8; --border2:#c8c4bc; --text:#1a1917; --muted:#6b6559;
  --amber:#b45309; --amber-dim:rgba(180,83,9,.10);
  --red:#dc2626; --cyan:#0e7490; --green:#16a34a;
  --signal:#a21caf; --plot-grid:rgba(100,95,88,.35);
  --tag-bg:#e8e6df;
  color-scheme: light;
}

/* ===== BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{
  font-family:'IBM Plex Sans',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;transition:background .25s,color .25s;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
select,input{font-family:inherit;}

/* ===== MODE SYSTEM ===== */
.xo{display:none!important;}
.bo{display:none!important;}
body.expert   .xo{display:revert!important;}
body.expert   .bo{display:none!important;}
body.beginner .xo{display:none!important;}
body.beginner .bo{display:revert!important;}
body.expert   aside.xo{display:flex!important;flex-direction:column;}
body.beginner aside.bo{display:flex!important;flex-direction:column;}
body.expert   section.xo{display:block!important;}
body.expert   .res-panel.xo{display:flex!important;flex-direction:column;}
body.beginner .res-panel.bo{display:flex!important;flex-direction:column;}
body.expert   .canvas-card.xo{display:flex!important;flex-direction:column;}

/* ===== HEADER ===== */
header{
  background:var(--surf);border-bottom:1px solid var(--border);
  padding:.55rem .9rem;display:flex;align-items:center;gap:.55rem;
  flex-wrap:nowrap;overflow:hidden;min-height:0;
}
.hdr-title{flex:1;min-width:0;overflow:hidden;}
.hdr-title h1{
  font-family:'Playfair Display',serif;font-size:1rem;
  line-height:1.2;color:var(--amber);letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hdr-title p{
  font-size:.63rem;color:var(--muted);margin-top:.08rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hdr-btns{display:flex;gap:.35rem;align-items:center;flex-shrink:0;}
.btn-mode{
  background:var(--amber);color:#000;font-weight:600;
  font-size:.72rem;padding:.3rem .7rem;border-radius:var(--radius);
  transition:opacity .2s;letter-spacing:.01em;white-space:nowrap;
}
.btn-mode:hover{opacity:.85;}
/* ≤600px: chowamy tekst przycisków, zostawiamy emoji */
@media(max-width:600px){
  .btn-mode .btn-lbl{display:none;}
  .btn-sec  .btn-lbl{display:none;}
  .hdr-title p{display:none;}
}
.btn-sec{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  font-size:.71rem;padding:.3rem .65rem;border-radius:var(--radius);
  transition:border-color .2s;white-space:nowrap;cursor:pointer;flex-shrink:0;
}
.btn-sec:hover{border-color:var(--amber);}
.vtag{
  font-size:.66rem;color:var(--muted);background:var(--tag-bg);
  padding:.18rem .45rem;border-radius:3px;font-family:'IBM Plex Mono',monospace;
}

/* ===== CHAIN DIAGRAM ===== */
.chain-section{
  background:var(--surf);border-bottom:1px solid var(--border);
  padding:.55rem 1.1rem;overflow-x:auto;
}
.chain{display:flex;align-items:center;min-width:580px;}
.chain-box{
  background:var(--card);border:1px solid var(--border);
  border-left:4px solid var(--muted);border-radius:var(--radius);
  padding:.38rem .55rem;min-width:105px;flex-shrink:0;
  transition:border-left-color .35s;
}
.cb-name{font-size:.6rem;color:var(--muted);margin-bottom:.12rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.cb-val{font-size:.8rem;font-family:'IBM Plex Mono',monospace;color:var(--text);}
.cb-val .hi{color:var(--amber);font-weight:600;}
.chain-arrow{padding:0 1px;color:var(--muted);flex-shrink:0;}

/* ===== MAIN LAYOUT ===== */
.main-layout{
  display:grid;
  grid-template-columns:265px 1fr 215px;
  grid-template-areas:&quot;ctrl plots res&quot;;
  gap:.7rem;padding:.7rem;
}
.main-layout>*{min-width:0;}
@media(max-width:1099px){
  .main-layout{grid-template-columns:1fr 1fr;grid-template-areas:&quot;ctrl res&quot; &quot;plots plots&quot;;}
}
@media(max-width:699px){
  .main-layout{grid-template-columns:1fr;grid-template-areas:&quot;ctrl&quot; &quot;plots&quot; &quot;res&quot;;}
}

/* ===== CONTROL COLUMN ===== */
.ctrl-col{
  grid-area:ctrl;background:var(--surf);border:1px solid var(--border);
  border-radius:var(--radius);padding:.7rem;
  display:flex;flex-direction:column;gap:.55rem;
  overflow-y:auto;overflow-x:clip;
}
.ctrl-group{border:1px solid var(--border);border-radius:var(--radius);padding:.45rem .55rem;}
.cg-title{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.38rem;font-weight:600;}
.ctrl-row{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;
  column-gap:.35rem;row-gap:.18rem;margin-bottom:.45rem;align-items:center;}
.ctrl-row:last-child{margin-bottom:0;}
.clbl{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  grid-column:1;grid-row:1;}
.ctrl-val{display:flex;align-items:baseline;gap:.2rem;
  grid-column:2;grid-row:1;justify-content:flex-end;}
.cnum{
  width:3.4rem;background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:.72rem;padding:.13rem .25rem;text-align:right;
  border-radius:3px;font-family:'IBM Plex Mono',monospace;
}
.cnum:focus{outline:1px solid var(--amber);}
.cunit{font-size:.65rem;color:var(--muted);white-space:nowrap;}
input[type=range].ctrl-slider{
  grid-column:1/-1;grid-row:2;width:100%;margin:0;}

/* slider track */
input[type=range]{
  -webkit-appearance:none;height:3px;width:100%;
  background:linear-gradient(90deg,var(--amber) var(--pct,50%),var(--border2) var(--pct,50%));
  outline:none;cursor:pointer;border-radius:2px;
}
input[type=range].ctrl-slider{
  grid-column:1/-1;grid-row:2;width:100%;margin:0;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;
  background:var(--amber);border-radius:50%;cursor:pointer;
  box-shadow:0 0 0 2px var(--surf);
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;background:var(--amber);
  border-radius:50%;cursor:pointer;border:2px solid var(--surf);
}

/* select */
.csel{
  width:100%;background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:.78rem;padding:.28rem .38rem;
  border-radius:4px;cursor:pointer;
}

/* ===== PLOTS COLUMN ===== */
.plots-col{grid-area:plots;display:flex;flex-direction:column;gap:.6rem;min-height:0;}
.canvas-card{
  background:var(--surf);border:1px solid var(--border);
  border-radius:var(--radius);padding:.45rem;
  display:flex;flex-direction:column;min-height:0;
}
.ct-flex{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.nl-btn{margin-left:auto;background:var(--card);border:1px solid var(--border);color:var(--muted);
  font-size:.66rem;padding:.12rem .5rem;border-radius:4px;cursor:pointer;font-family:inherit;text-transform:none;letter-spacing:0;font-weight:600;}
.nl-btn:hover{border-color:var(--amber);color:var(--text);}
.nl-btn.on{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.canvas-title{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.28rem;flex-shrink:0;}
canvas{width:100%;border-radius:3px;display:block;flex:1;min-height:160px;}

/* ===== RESULTS COLUMN ===== */
.res-col{grid-area:res;}
.res-panel{
  background:var(--surf);border:1px solid var(--border);
  border-radius:var(--radius);padding:.7rem;
  display:flex;flex-direction:column;gap:.45rem;
}
.res-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.4rem .55rem;}
.rlbl{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.12rem;}
.rval{font-size:1.05rem;font-family:'IBM Plex Mono',monospace;color:var(--text);font-weight:600;}
.rval.big{font-size:1.35rem;color:var(--amber);}
.rval.sig{color:var(--signal);}
.rval.ok{color:var(--green);}
.rval.warn{color:var(--amber);}
.rval.bad{color:var(--red);}
.runit{font-size:.65rem;color:var(--muted);}

/* ===== TRAFFIC LIGHT ===== */
.tl-wrap{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.25rem;}
.tl-row{display:flex;gap:.4rem;}
.tld{font-size:1.3rem;opacity:.2;transition:opacity .3s,box-shadow .3s;}
.tld.on{opacity:1;}
.tl-g{color:var(--green);}.tl-g.on{box-shadow:0 0 9px var(--green);}
.tl-y{color:var(--amber);}.tl-y.on{box-shadow:0 0 9px var(--amber);}
.tl-r{color:var(--red);}.tl-r.on{box-shadow:0 0 9px var(--red);}
.tl-lbl{font-size:.69rem;color:var(--muted);text-align:center;}

/* ===== PRESET MENU ===== */
.pmenu{position:relative;}
.pmbtn{
  width:100%;background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:.73rem;padding:.28rem .55rem;border-radius:var(--radius);text-align:left;
}
.pmbtn:hover{border-color:var(--amber);}
.pmdrop{
  position:fixed;z-index:9999;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:0 6px 24px rgba(0,0,0,.45);display:none;
  max-height:70vh;overflow-y:auto;
}
.pmdrop.open{display:block;}
.pmsep{font-size:.62rem;color:var(--muted);padding:.28rem .55rem;text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--border);margin-top:.18rem;}
.pmsep:first-child{border-top:none;margin-top:0;}
.pmitem{
  display:block;width:100%;text-align:left;background:none;
  color:var(--text);font-size:.74rem;padding:.28rem .55rem;
}
.pmitem:hover{background:var(--amber-dim);color:var(--amber);}

/* ===== BUDGET TABLE ===== */
.btbl{width:100%;border-collapse:collapse;font-size:.72rem;margin-top:.35rem;}
.btbl th{background:var(--card);color:var(--muted);padding:.22rem .38rem;text-align:left;font-weight:600;font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;}
.btbl td{padding:.2rem .38rem;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;}
.btbl tr:last-child td{border-bottom:none;}
.btbl tr.btU td{font-weight:600;color:var(--amber);}

/* ===== TYPE BADGE ===== */
.tbadge{
  display:inline-block;padding:.08rem .38rem;border-radius:3px;
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.9rem;
  background:var(--amber-dim);color:var(--amber);
}

/* ===== DOCS OVERLAY ===== */
.docs-overlay{
  position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);
  background:var(--surf);border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .3s;
  z-index:200;display:flex;flex-direction:column;
}
.docs-overlay.open{transform:translateX(0);}
.docs-hdr{padding:.65rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;}
.docs-hdr h2{flex:1;font-size:.95rem;color:var(--amber);font-family:'Playfair Display',serif;}
.docs-close{background:var(--card);border:1px solid var(--border);color:var(--text);padding:.28rem .55rem;border-radius:var(--radius);font-size:.76rem;}
.docs-body{flex:1;overflow-y:auto;padding:.9rem;font-size:.8rem;line-height:1.65;}
.docs-body h3{color:var(--amber);font-size:.85rem;margin:1rem 0 .38rem;font-weight:600;}
.docs-body p{color:var(--text);margin-bottom:.5rem;}
.docs-body .fb{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.55rem;margin:.4rem 0;overflow-x:auto;}
.docs-body ul{padding-left:1.2rem;margin-bottom:.5rem;}
.docs-body li{margin-bottom:.2rem;}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--surf);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
/* QUIZ */
.quiz-ov{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--surf);border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .3s;z-index:260;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.25);}
.quiz-ov.open{transform:translateX(0);}
.qz-hdr{padding:.6rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.6rem;}
.qz-hdr h2{flex:1;font-size:.95rem;color:var(--amber);font-family:'Playfair Display',Georgia,serif;}
.qz-prog{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted);}
.qz-body{flex:1;overflow-y:auto;padding:1rem 1.1rem 2rem;font-size:.84rem;line-height:1.6;}
.qz-topic{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:.35rem;}
.qz-q{font-size:.92rem;margin-bottom:.8rem;font-weight:500;}
.qz-opts{display:flex;flex-direction:column;gap:.4rem;}
.qz-opt{display:flex;gap:.6rem;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:.5rem .65rem;border-radius:.45rem;cursor:pointer;font:inherit;font-size:.82rem;line-height:1.45;}
.qz-opt:hover:not([disabled]){border-color:var(--amber);}
.qz-opt[disabled]{cursor:default;}
.qz-opt.ok{border-color:var(--green);background:rgba(34,197,94,.12);}
.qz-opt.bad{border-color:var(--red);background:rgba(239,68,68,.12);}
.qz-opt.dim{opacity:.55;}
.qz-l{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--amber);flex-shrink:0;}
.qz-fb{margin-top:.8rem;padding:.55rem .7rem;border-radius:.45rem;border-left:3px solid;background:var(--card);font-size:.8rem;}
.qz-fb.ok{border-color:var(--green);} .qz-fb.bad{border-color:var(--red);}
.qz-nav{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem;}
.qz-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font:inherit;font-size:.78rem;padding:.35rem .8rem;border-radius:.4rem;cursor:pointer;}
.qz-btn:hover:not([disabled]){border-color:var(--amber);}
.qz-btn[disabled]{opacity:.4;cursor:default;}

    <div class=&quot;bo&quot;>
      <h3>Czym jest termopara?</h3>
      <p>Termopara to para przewodników z dwóch różnych metali, połączonych na jednym końcu. W miejscu połączenia — <b>złączu gorącym</b> — powstaje napięcie elektryczne proporcjonalne do temperatury. To <b>efekt Seebecka</b> (odkryty 1821).</p>
      <p>Drugi koniec — <b>złącze zimne</b> — musi mieć znane temperaturę (najczęściej temperaturę otoczenia mierzoną oddzielnie).</p>
      <h3>Skąd się bierze napięcie?</h3>
      <p>Elektrony w różnych metalach mają różną energię. Gdy dwa różne metale zetkną się w gorącym miejscu, elektrony dyfundują — tworząc napięcie. Cieplejsze złącze → większy prąd elektronów → wyższe napięcie.</p>
      <h3>Typy termopar (wg ITS-90)</h3>
      <ul>
        <li><b>K</b> (Chromel/Alumel) — najpopularniejszy, −270…1372°C, α ≈ 41 µV/°C</li>
        <li><b>J</b> (Fe/Konstantan) — −210…1200°C, α ≈ 51 µV/°C</li>
        <li><b>T</b> (Cu/Konstantan) — kriogenika, −270…400°C</li>
        <li><b>E</b> (Chromel/Konstantan) — największa czułość, ≈ 58 µV/°C</li>
        <li><b>N</b> (Nicrosil/Nisil) — stabilna alternatywa dla K</li>
        <li><b>S</b> (Pt/Pt-10%Rh) — bardzo wysokie T, mała czułość ≈ 6 µV/°C</li>
      </ul>
      <h3>Co to jest błąd kompensacji?</h3>
      <p>Jeśli temperatura złącza zimnego jest błędnie zmierzona o δT_cjc — wynik końcowy jest obarczony podobnym błędem. Sygnalizacja świetlna pokazuje jakość pomiaru!</p>
    </div>

    <div>
      <h3>Nieliniowość charakterystyki (📐)</h3>
      <p>Czułość termopary \(\alpha(T)=\mathrm{d}E/\mathrm{d}T\) zmienia się z temperaturą, więc charakterystyka \(E(T)\) nie jest prostą. Gdy przyrząd przelicza napięcie na temperaturę <b>liniowo</b> — przez dwa punkty kalibracji \((T_z,E_z)\) i \((T_h,E_h)\) — popełnia błąd nieliniowości:</p>
      <div class=&quot;fb&quot;>$$S=\frac{E_h-E_z}{T_h-T_z},\qquad T_{\mathrm{wsk}}(T)=T_z+\frac{E(T)-E_z}{S},\qquad \delta T(T)=T_{\mathrm{wsk}}(T)-T$$</div>
      <p>W punktach kalibracji błąd jest zerowy, między nimi osiąga ekstremum, a poza przedziałem (ekstrapolacja) szybko rośnie. Nieliniowość podaje się też w procentach zakresu: \(\max|E(T)-E_{\mathrm{lin}}(T)|/(E_h-E_z)\cdot100\,\%\).</p>
      <ul>
        <li>Typ <b>K</b> jest najbardziej liniowy: dla 0–1000 °C błąd ok. 6 °C.</li>
        <li>Typy <b>J, T, E</b>: ok. 10–25 °C (np. J 0–700 °C: 10 °C, T 0–400 °C: 22 °C, E 0–800 °C: 25 °C).</li>
        <li>Typ <b>S</b>: ok. 100 °C dla 0–1600 °C — mała czułość, ale silnie rosnąca z T.</li>
      </ul>
      <p>Dlatego nowoczesne przyrządy nie stosują stałej czułości, tylko <b>linearyzację</b>: wielomiany odwrotne NIST, tablice z interpolacją lub linearyzację odcinkową. Włącz przycisk <b>📐 Nieliniowość</b> nad wykresem E(T), aby zobaczyć prostą przez punkty pracy i wykres δT(T).</p>
    </div>

    <div class=&quot;xo&quot;>
      <h3>Prawo Seebecka</h3>
      <p>SEM termopary AB między temperaturami T_z i T_h:</p>
      <div class=&quot;fb&quot;>$$E_{AB}(T_h,T_z)=\int_{T_z}^{T_h}\alpha_{AB}(T)\,dT$$</div>
      <p>gdzie \(\alpha_{AB}=\alpha_A-\alpha_B\) to różnicowy współczynnik Seebecka [µV/°C] — nielinearny!</p>

      <h3>Prawo temperatur pośrednich</h3>
      <p>SEM zależy tylko od temperatur złączy (nie od rozkładu T wzdłuż drutu):</p>
      <div class=&quot;fb&quot;>$$E_{AB}(T_h,T_z)=E_{AB}(T_h,0{^\circ}\mathrm{C})-E_{AB}(T_z,0{^\circ}\mathrm{C})$$</div>

      <h3>Kompensacja złącza zimnego (CJC)</h3>
      <p>Mierzone napięcie netto (T_z ≠ 0°C):</p>
      <div class=&quot;fb&quot;>$$E_{\mathrm{netto}}=E_{AB}(T_h,0)-E_{AB}(T_z,0)$$</div>
      <p>Korekcja: mierzymy T_z osobno i dodajemy odpowiednie napięcie:</p>
      <div class=&quot;fb&quot;>$$E_{\mathrm{koryg}}=E_{\mathrm{netto}}+E_{AB}(\hat{T}_z,0)$$</div>
      <p>Błąd kompensacji δT_cjc powoduje błąd wyniku:</p>
      <div class=&quot;fb&quot;>$$\delta T_{\mathrm{wynik}}\approx\delta T_{\mathrm{cjc}}\cdot\frac{\alpha(T_z)}{\alpha(T_h)}$$</div>

      <h3>Przetwornik ADC w torze termoparowym</h3>
      <p>Termopara generuje napięcie rzędu <b>µV…mV</b> — ADC musi je skwantować do postaci cyfrowej. Typowy tor: termopara → wzmacniacz instrumentacyjny (wzmocnienie ×100–×1000) → ADC sigma-delta 16–24 bit (np. MAX31856, ADS1248, AD7124).</p>
      <p>ADC dzieli cały zakres napięciowy \(E_{\mathrm{zakr}}\) na \(2^N\) równych przedziałów. Szerokość jednego przedziału to <b>1 LSB</b> (ang. <i>Least Significant Bit</i>):</p>
      <div class=&quot;fb&quot;>$$\mathrm{LSB}=\frac{E_{\mathrm{zakr}}}{2^N}\quad[\mu\mathrm{V}]$$</div>
      <p>Maksymalny błąd kwantowania wynosi <b>±½ LSB</b> (rozkład prostokątny). Przeliczenie na temperaturę wymaga znajomości czułości Seebecka \(\alpha(T_h)\) w punkcie pracy:</p>
      <div class=&quot;fb&quot;>$$\delta T_{\mathrm{ADC}}=\frac{\mathrm{LSB}/2}{\alpha(T_h)}\quad[{^\circ}\mathrm{C}]$$</div>
      <p>Uwaga: \(\alpha(T_h)\) jest <b>nielinearna</b> — ten sam ADC daje różny błąd temperaturowy w różnych punktach zakresu.</p>

      <h3>Przykłady — typ K, \(\alpha\approx 41\,\mu\mathrm{V/°C}\), zakres 50 mV</h3>
      <div class=&quot;fb&quot; style=&quot;font-size:.71rem&quot;>
        10-bit: \(\mathrm{LSB}=\frac{50000}{1024}\approx 48{,}8\,\mu\mathrm{V}\)
        \(\Rightarrow\delta T\approx\mathbf{0{,}59\,°C}\)<br>
        16-bit: \(\mathrm{LSB}=\frac{50000}{65536}\approx 0{,}76\,\mu\mathrm{V}\)
        \(\Rightarrow\delta T\approx\mathbf{0{,}009\,°C}\)<br>
        24-bit: \(\mathrm{LSB}=\frac{50000}{16777216}\approx 0{,}003\,\mu\mathrm{V}\)
        \(\Rightarrow\delta T\approx\mathbf{0{,}000036\,°C}\)
      </div>
      <p>Dobór zakresu \(E_{\mathrm{zakr}}\): musi pomieścić <b>maksymalne \(E_{\mathrm{netto}}\)</b> przy najwyższej mierzonej temperaturze. Zbyt szeroki zakres pogarsza rozdzielczość; zbyt wąski powoduje nasycenie ADC.</p>
      <div class=&quot;fb&quot;>$$E_{\mathrm{zakr}}\geq E_{AB}(T_{h,\max},0)-E_{AB}(T_{z,\min},0)$$</div>

      <h3>Budżet niepewności — metoda GUM</h3>
      <p>Składowe toru mają różną naturę i trzeba je traktować inaczej:</p>
      <ul>
        <li><b>Błąd kompensacji ZZ</b> — przyrząd zna \(T_z\) tylko z dokładnością \(\pm\delta T_{\mathrm{cjc}}\). Przeniesiony na wynik: \(a_{\mathrm{cjc}}=|\delta T_{\mathrm{cjc}}|\cdot\alpha(T_z)/\alpha(T_h)\). Znak nieznany → <b>rozkład prostokątny</b>.</li>
        <li><b>Kwantowanie ADC</b> — błąd w granicach \(a_{\mathrm{ADC}}=\tfrac{\mathrm{LSB}/2}{\alpha(T_h)}\), <b>rozkład prostokątny</b>.</li>
        <li><b>Rezystancja przewodów</b> — dzielnik \(R_{\mathrm{in}}/(R_{\mathrm{in}}+R_{tc})\) <b>zawsze zaniża</b> wynik o znaną wartość. To <b>błąd systematyczny</b>: wyznacza się go i <b>koryguje</b> (poprawka), a nie wlicza do niepewności.</li>
      </ul>
      <p>Wartości graniczne \(\pm a\) rozkładu prostokątnego zamieniamy na niepewności standardowe, a te łączymy geometrycznie (składowe nieskorelowane):</p>
      <div class=&quot;fb&quot;>$$u=\frac{a}{\sqrt{3}},\qquad u_c=\sqrt{u_{\mathrm{cjc}}^2+u_{\mathrm{ADC}}^2},\qquad U=k\,u_c,\;k=2\;(\approx95\,\%)$$</div>
      <p>Dlaczego nie suma? Suma \(a_{\mathrm{cjc}}+a_{\mathrm{ADC}}\) to <b>błąd graniczny</b> (najgorszy przypadek) — oba błędy rzadko osiągają skrajne wartości jednocześnie. Suma geometryczna niepewności standardowych daje realistyczną ocenę, o ile źródła są niezależne.</p>
      <p>W trybie eksperta wynik \(T_{\mathrm{mierz}}\) zawiera <b>rzeczywiście zrealizowane</b> błędy: skwantowane napięcie, zadany błąd CJC i spadek na \(R_{tc}\). Pole „Błąd całkowity” pokazuje więc konkretną realizację błędu, a \(U\) — przedział, w którym wynik leży z prawdopodobieństwem ≈95 %.</p>

      <h3>Klasy tolerancji termopar (IEC 60584-1)</h3>
      <p>Rzeczywisty drut termoparowy odbiega od charakterystyki referencyjnej NIST. Norma podaje dopuszczalną odchyłkę jako większą z dwóch wartości: stałej i proporcjonalnej do temperatury, np. dla typu K:</p>
      <ul>
        <li>klasa 1: ±1,5 °C lub ±0,004·|t| (−40…1000 °C),</li>
        <li>klasa 2: ±2,5 °C lub ±0,0075·|t| (−40…1200 °C),</li>
        <li>klasa 3: ±2,5 °C lub ±0,015·|t| (−200…40 °C).</li>
      </ul>
      <p>Przy 600 °C klasa 2 typu K dopuszcza ±4,5 °C — zwykle to <b>największy</b> składnik niepewności całego toru, większy niż błędy elektroniki. Znak odchyłki konkretnej termopary jest nieznany, więc w budżecie przyjmuje się rozkład prostokątny: \(u_{\mathrm{tol}}=a/\sqrt{3}\). Zmniejszyć go można tylko indywidualnym wzorcowaniem termopary.</p>

      <h3>Przewody przedłużające i kompensacyjne</h3>
      <p>Między głowicą przyłączeniową (temperatura \(T_g\)) a przyrządem (\(T_z\)) przewód nadal leży w gradiencie temperatury, więc też generuje SEM. Zależnie od materiału:</p>
      <div class=&quot;fb&quot;>$$E=\underbrace{E(T_h)-E(T_g)}_{\text{termopara}}+\underbrace{E_{\mathrm{przew}}(T_g)-E_{\mathrm{przew}}(T_z)}_{\text{przedłużenie}}$$</div>
      <ul>
        <li><b>Przedłużający (X)</b> — ten sam stop co termopara: \(E_{\mathrm{przew}}=E\), wynik poprawny.</li>
        <li><b>Kompensacyjny (C)</b> — tańszy stop o zbliżonej czułości w wąskim zakresie (zwykle do 100–200 °C). Odchyłka czułości ε daje błąd \(\approx\varepsilon\,[E(T_g)-E(T_z)]/\alpha(T_h)\), rosnący z \(T_g-T_z\).</li>
        <li><b>Zwykła miedź</b> — oba przewody z tego samego metalu nie dają SEM, więc „złączem odniesienia” staje się głowica: przyrząd kompensuje \(T_z\), a powinien \(T_g\). Błąd ≈ \(T_g-T_z\) przeliczone przez \(\alpha(T_g)/\alpha(T_h)\) — klasyczny błąd montażowy.</li>
      </ul>

      <h3>Wpływ rezystancji przewodów — kontekst historyczny</h3>
      <p>Termopara jest <b>źródłem napięcia</b> o skończonej impedancji wewnętrznej. Pełny obwód elektryczny tworzy dzielnik napięcia:</p>
      <div class=&quot;fb&quot;>$$E_{\mathrm{mierz}}=E_{\mathrm{netto}}\cdot\frac{R_{\mathrm{in}}}{R_{\mathrm{in}}+R_{tc}}$$</div>
      <p>gdzie \(R_{tc}\) to całkowita rezystancja <b>obu drutów</b> termopary (obliczana z długości, średnicy i rezystywności materiałów):</p>
      <div class=&quot;fb&quot;>$$R_{tc}=\frac{L}{A}\cdot(\rho_A+\rho_B),\quad A=\frac{\pi d^2}{4}$$</div>
      <p>Rezystywności materiałów termoelek. w 20°C:</p>
      <div class=&quot;fb&quot; style=&quot;font-size:.72rem&quot;>
        K: Chromel \(\rho\!=\!706\), Alumel \(\rho\!=\!294\)&amp;nbsp;nΩ·m<br>
        J: Fe \(\rho\!=\!100\), Konst. \(\rho\!=\!490\)&amp;nbsp;nΩ·m<br>
        T: Cu \(\rho\!=\!17\), Konst. \(\rho\!=\!490\)&amp;nbsp;nΩ·m<br>
        S: Pt \(\rho\!=\!106\), Pt10Rh \(\rho\!=\!187\)&amp;nbsp;nΩ·m
      </div>

      <h3>Ewolucja przyrządów — dlaczego to kiedyś było kluczowe</h3>
      <p>Błąd wynikający z dzielnika napięciowego:</p>
      <div class=&quot;fb&quot;>$$\delta E_{\mathrm{rel}}=\frac{R_{tc}}{R_{\mathrm{in}}+R_{tc}}\approx\frac{R_{tc}}{R_{\mathrm{in}}}\quad(\text{gdy }R_{\mathrm{in}}\gg R_{tc})$$</div>
      <p>Typowe wartości dla K, L = 10 m, d = 1,0 mm (\(R_{tc}\approx 13\,\Omega\)), T_h = 300°C:</p>
      <div class=&quot;fb&quot; style=&quot;font-size:.71rem&quot;>
        Galwanometr 1875 &amp;nbsp;(\(R_{\mathrm{in}}\!=\!50\,\Omega\)):&amp;nbsp; \(\delta T\approx\mathbf{-51\,°C}\)<br>

// ============================================================
// THERMOCOUPLE MATERIAL PROPERTIES — resistivity ρ [nΩ·m] at 20°C
// Sources: IEC 60584, ASTM E230, material handbooks
// ============================================================
const TC_PROPS = {
  K:{ rhoA:706,  rhoB:294,  nameA:'Chromel (Ni-Cr)',   nameB:'Alumel (Ni-Mn-Al-Si)' },
  J:{ rhoA:100,  rhoB:490,  nameA:'Żelazo (Fe)',        nameB:'Konstantan (Cu-Ni)'   },
  T:{ rhoA:17,   rhoB:490,  nameA:'Miedź (Cu)',          nameB:'Konstantan (Cu-Ni)'   },
  E:{ rhoA:706,  rhoB:490,  nameA:'Chromel (Ni-Cr)',   nameB:'Konstantan (Cu-Ni)'   },
  N:{ rhoA:1060, rhoB:370,  nameA:'Nicrosil (Ni-Cr-Si)',nameB:'Nisil (Ni-Si)'        },
  S:{ rhoA:106,  rhoB:187,  nameA:'Platyna (Pt)',        nameB:'Pt-10%Rh'             },
};

// Compute R_tc [Ω] from length L [m], wire diameter d [mm], TC type
function calcRtc(type, L, d_mm){
  const p = TC_PROPS[type]; if(!p) return 0;
  const A_m2 = Math.PI * Math.pow(d_mm * 1e-3 / 2, 2); // [m²]
  const rho_total = (p.rhoA + p.rhoB) * 1e-9;           // [Ω·m]
  return L * rho_total / A_m2;                            // [Ω]
}


// Klasy tolerancji wg IEC 60584-1: [T_min, T_max, a0 [°C], k] → ±max(a0, k·|t|)
const TOL_IEC={
  K:{1:[-40,1000,1.5,0.004],2:[-40,1200,2.5,0.0075],3:[-200,40,2.5,0.015]},
  N:{1:[-40,1000,1.5,0.004],2:[-40,1200,2.5,0.0075],3:[-200,40,2.5,0.015]},
  J:{1:[-40,750,1.5,0.004], 2:[-40,750,2.5,0.0075]},
  T:{1:[-40,350,0.5,0.004], 2:[-40,350,1.0,0.0075], 3:[-200,40,1.0,0.015]},
  E:{1:[-40,800,1.5,0.004], 2:[-40,900,2.5,0.0075], 3:[-200,40,2.5,0.015]},
  S:{1:'RS1',               2:[0,1600,1.5,0.0025]},
};
function tolIEC(type,T,cls){
  if(!cls) return null;
  const c=(TOL_IEC[type]||{})[cls];
  if(!c) return {na:true};
  if(c==='RS1'){ if(T<0||T>1600) return {out:true,lo:0,hi:1600}; return {a:T<=1100?1:1+0.003*(T-1100),txt:'±1 °C (0–1100 °C), ±[1+0,003(t−1100)] °C do 1600 °C'}; }
  const [lo,hi,a0,k]=c;
  if(T<lo||T>hi) return {out:true,lo,hi};
  return {a:Math.max(a0,k*Math.abs(T)),txt:`±${String(a0).replace('.',',')} °C lub ±${String(k).replace('.',',')}·|t| (większa), ${lo}…${hi} °C`};
}

// Wybór odcinka wielomianu dla temperatury T
function tcSeg(d,T){for(const q of d.seg){if(T<=q.hi)return q;}return d.seg[d.seg.length-1];}

// E(T) [mV] wg NIST ITS-90 (T ograniczona do zakresu typu)
function emf(type,T){
  const d=TC[type]; if(!d) return 0;
  T=Math.max(d.range[0],Math.min(d.range[1],T));
  const q=tcSeg(d,T);
  let e=0; for(let i=q.c.length-1;i>=0;i--) e=e*T+q.c[i];
  if(q.a) e+=q.a[0]*Math.exp(q.a[1]*(T-q.a[2])*(T-q.a[2]));
  return e;
}

// Czułość Seebecka α(T)=dE/dT [µV/°C] — pochodna analityczna (ciągła)
function alpha(type,T){
  const d=TC[type]; if(!d) return 0;
  T=Math.max(d.range[0],Math.min(d.range[1],T));
  const q=tcSeg(d,T);
  let de=0; for(let i=q.c.length-1;i>=1;i--) de=de*T+i*q.c[i];
  if(q.a){const u=T-q.a[2]; de+=q.a[0]*Math.exp(q.a[1]*u*u)*2*q.a[1]*u;}
  return de*1000;
}

// T(E) — funkcja odwrotna: bisekcja (E(T) monotoniczna w zakresie) + Newton
function tempFromEmf(type,E){
  const d=TC[type]; if(!d) return 0;
  let lo=d.range[0], hi=d.range[1];
  if(E<=emf(type,lo)) return lo;
  if(E>=emf(type,hi)) return hi;
  for(let k=0;k<40;k++){const m=(lo+hi)/2; if(emf(type,m)<E) lo=m; else hi=m;}
  let T=(lo+hi)/2;
  for(let k=0;k<3;k++){const a=alpha(type,T)/1000; if(a>0) T-=(emf(type,T)-E)/a;}
  return T;
}

// Błąd nieliniowości: przyrząd przelicza E → T liniowo przez dwa punkty (T_z, E_z) i (T_h, E_h).
// δT(T) = T_wskazane − T,  T_wskazane = T_z + (E(T) − E_z)/S,  S = (E_h − E_z)/(T_h − T_z)
function nlData(type,T_z,T_h){
  const Ez=emf(type,T_z), Eh=emf(type,T_h);
  if(Math.abs(T_h-T_z)<1) return null;
  const S=(Eh-Ez)/(T_h-T_z);                         // mV/°C — czułość średnia (sieczna)
  const dT=T=>T_z+(emf(type,T)-Ez)/S-T;              // °C
  const dE=T=>emf(type,T)-(Ez+S*(T-T_z));            // mV — odchyłka krzywej od prostej
  const a=Math.min(T_z,T_h), b=Math.max(T_z,T_h);
  let mx={T:a,dT:0,dE:0};
  for(let i=0;i<=400;i++){const T=a+(b-a)*i/400, v=dT(T); if(Math.abs(v)>Math.abs(mx.dT)) mx={T,dT:v,dE:dE(T)};}
  const fsPct=Math.abs(mx.dE)/Math.abs(Eh-Ez)*100;  // % zakresu (FS)
  return {Ez,Eh,S,dT,dE,a,b,mx,fsPct};
}
function g(id){return document.getElementById(id);}
function tv(n){return getComputedStyle(document.body).getPropertyValue(n).trim();}

function resC(c){
  const dpr=window.devicePixelRatio||1;
  const w=c.offsetWidth||600;
  const h=c.offsetHeight||c.parentElement?.clientHeight-24||280;
  const nw=Math.round(w*dpr),nh=Math.round(Math.max(h,1)*dpr);
  if(c.width!==nw||c.height!==nh){c.width=nw;c.height=nh;c.getContext('2d').scale(dpr,dpr);}
}

function slPct(el){
  const mn=parseFloat(el.min),mx=parseFloat(el.max),vl=parseFloat(el.value);
  el.style.setProperty('--pct',((vl-mn)/(mx-mn)*100)+'%');
  const nid=el.id.replace('sl_','nu_');
  const nu=g(nid); if(nu)nu.value=vl;
}
function syncNum(slId,nuId){
  const sl=g(slId),nu=g(nuId); if(!sl||!nu)return;
  let v=parseFloat(nu.value);
  v=Math.max(parseFloat(sl.min),Math.min(parseFloat(sl.max),v));
  sl.value=v; slPct(sl);
}
function setTh(val,suf){
  const sl=g('sl_th_'+suf),nu=g('nu_th_'+suf);
  if(!sl||!nu)return;
  val=Math.max(parseFloat(sl.min),Math.min(parseFloat(sl.max),val));
  sl.value=val; nu.value=val; slPct(sl);
}
function setTz(val,suf){
  ['sl_tz_'+suf,'nu_tz_'+suf].forEach((id,i)=>{const el=g(id);if(el)el.value=val;});
  const sl=g('sl_tz_'+suf); if(sl)slPct(sl);
}
function setEx(slId,nuId,val){
  const sl=g(slId),nu=g(nuId);
  if(sl){sl.value=val;slPct(sl);} if(nu)nu.value=val;
}

function updateRange(type){
  const d=TC[type],mn=d.range[0],mx=d.range[1];
  ['sl_th_b','sl_th_x'].forEach(id=>{
    const sl=g(id); if(!sl)return;
    sl.min=mn; sl.max=mx;
    const cv=Math.max(mn,Math.min(mx,parseFloat(sl.value))); sl.value=cv; slPct(sl);
  });
  ['nu_th_b','nu_th_x'].forEach(id=>{
    const nu=g(id); if(!nu)return;
    nu.min=mn; nu.max=mx;
    const cv=Math.max(mn,Math.min(mx,parseFloat(nu.value))); nu.value=cv;
  });
}

    exp_s:        ['S',1200, 25, 0, 16, 25, 10, '2.0', '10000000'],
    hist_galv1875:['K', 300, 20, 0, 16, 50, 10, '1.0', '50'],
    hist_galv1900:['K', 300, 20, 0, 16, 50, 10, '1.0', '100'],
    hist_mv1920:  ['K', 300, 20, 0, 16, 50, 10, '1.0', '500'],
    hist_dvm1975: ['K', 300, 20, 0, 16, 50, 10, '1.0', '1000000'],
    // [..., kabel, T_g, eps%, klasa tolerancji]
    exp_cu_cable: ['K', 300, 20, 0, 16, 50, 10, '1.0', '10000000','Cu', 80, 3, '0'],
    exp_comp:     ['K', 300, 20, 0, 16, 50, 10, '1.0', '10000000','C', 120, 3, '0'],
    exp_tol2:     ['K', 600, 20, 0, 16, 50, 10, '1.0', '10000000','none', 80, 3, '2'],
  };
  const p=P[name]; if(!p)return;
  const [type,Th,Tz,cjc,adc,adcr,wl,diam,rin_val]=p;
  g('tcType_b').value=type; g('tcType_x').value=type;
  updateRange(type);
  ['b','x'].forEach(s=>{setTh(Th,s);setTz(Tz,s);});
  setEx('sl_cjc_x','nu_cjc_x',cjc);
  setEx('sl_adc_x','nu_adc_x',adc);
  setEx('sl_adcr_x','nu_adcr_x',adcr);
  setEx('sl_wl_x','nu_wl_x',wl);
  const sd=g('sel_diam_x'); if(sd)sd.value=diam;
  const sr=g('sel_rin_x'); if(sr)sr.value=rin_val;
  g('sel_cab_x').value=p[9]||'none';
  setEx('sl_tg_x','nu_tg_x',p[10]!==undefined?p[10]:80);
  setEx('sl_eps_x','nu_eps_x',p[11]!==undefined?p[11]:3);
  g('sel_tol_x').value=p[12]||'0';
  scheduleUpdate();
}

// ============================================================
// MAIN UPDATE
// ============================================================
function scheduleUpdate(){
  if(!updatePending){updatePending=true;requestAnimationFrame(update);}
}
function update(){
  updatePending=false;
  resC(c1);resC(c2);if(showNL)resC(c3);

  const suf=expertMode?'x':'b';
  const type=g('tcType_'+suf).value;
  const T_h=parseFloat(g('nu_th_'+suf).value)||0;
  const T_z=parseFloat(g('nu_tz_'+suf).value)||0;
  const dT_cjc=expertMode?(parseFloat(g('nu_cjc_x').value)||0):0;
  const adc_bits=expertMode?(parseFloat(g('nu_adc_x').value)||16):16;
  const adc_range=expertMode?(parseFloat(g('nu_adcr_x').value)||50):50;

  // Wire geometry → R_tc
  const wl  = expertMode?(parseFloat(g('nu_wl_x').value)||10):10;
  const diam= expertMode?(parseFloat(g('sel_diam_x').value)||1.0):1.0;
  const R_tc= expertMode?calcRtc(type,wl,diam):0;

  // Instrument input resistance
  const R_in= expertMode?(parseFloat(g('sel_rin_x').value)||10e6):10e6;

  // Physics
  const E_h=emf(type,T_h);
  const E_z=emf(type,T_z);
  // Przedłużenie do przyrządu (tylko tryb eksperta); T_g — temperatura głowicy przyłączeniowej
  const cable=expertMode?g('sel_cab_x').value:'none';
  const T_g=parseFloat(g('nu_tg_x').value); const T_gv=isNaN(T_g)?T_z:T_g;
  const eps=(parseFloat(g('nu_eps_x').value)||0)/100;
  const E_g=emf(type,T_gv);
  let E_net_ideal;
  if(cable==='C')       E_net_ideal=(E_h-E_g)+(1+eps)*(E_g-E_z);   // przewód o czułości ≈ termopary ·(1+ε)
  else if(cable==='Cu') E_net_ideal=E_h-E_g;                         // Cu–Cu: brak SEM na odcinku T_g→T_z
  else                  E_net_ideal=E_h-E_z;                         // brak przedłużenia lub przewód X
  const dT_cab=(cable==='C'||cable==='Cu')?tempFromEmf(type,E_net_ideal+E_z)-T_h:0;
  g('cab_rows').style.display=(cable==='C'||cable==='Cu')?'block':'none';
  g('eps_row').style.display=cable==='C'?'grid':'none';

  // Voltage divider: E_measured = E_ideal × R_in / (R_in + R_tc)
  const rl_factor = R_in / (R_in + R_tc);
  const E_net_rl  = E_net_ideal * rl_factor;

  const alph=alpha(type,T_h);
  const alph_z=alpha(type,T_z);

  // ADC: krok kwantowania LSB = E_zakr/2^N; |E| > E_zakr → nasycenie.
  // Kwantyzacja tylko w trybie eksperta (tryb podstawowy = przyrząd idealny).
  const lsb_uV=(adc_range*1000)/Math.pow(2,adc_bits);
  const adc_sat = expertMode &amp;&amp; Math.abs(E_net_rl) > adc_range;
  let E_adc = E_net_rl;
  if(expertMode){
    const lsb_mV=lsb_uV/1000;
    const mag=Math.min(Math.round(Math.abs(E_net_rl)/lsb_mV)*lsb_mV, adc_range);
    E_adc=Math.sign(E_net_rl)*mag;
  }

  // CJC: przyrząd mierzy T_z z błędem dT_cjc i dodaje E(T_z,meas)
  const T_z_meas=T_z+dT_cjc;
  const E_z_meas=emf(type,T_z_meas);
  const E_corr=E_adc+E_z_meas;

  const T_meas=tempFromEmf(type,E_corr);
  const T_err=T_meas-T_h;

  // Graniczne błędy składowe przeliczone na T_h (współczynnik α(T_z)/α(T_h) dla CJC)
  const dT_cjc_h = Math.abs(dT_cjc)*alph_z/Math.max(alph,0.01);
  const dT_adc   = (lsb_uV/2)/Math.max(alph,0.01);
  // Rezystancja przewodów: znany błąd systematyczny (zawsze zaniża) — poprawka, nie niepewność
  // dokładnie przez funkcję odwrotną (przybliżenie dE/α zawodzi przy dużych spadkach)
  const dT_rl    = tempFromEmf(type, E_net_rl + E_z) - tempFromEmf(type, E_net_ideal + E_z); // °C (≤ 0)

  // Budżet niepewności (GUM): rozkłady prostokątne ±a → u = a/√3
  const u_cjc=dT_cjc_h/Math.sqrt(3), u_adc=dT_adc/Math.sqrt(3);
  // Tolerancja termopary wg klasy IEC — nieznany znak → rozkład prostokątny
  const tolCls=expertMode?parseInt(g('sel_tol_x').value)||0:0;
  const tol=tolIEC(type,T_h,tolCls);
  const a_tol=(tol&amp;&amp;tol.a)?tol.a:0, u_tol=a_tol/Math.sqrt(3);
  const ti=g('tol_info');
  if(ti) ti.textContent=!tolCls?'Pominięta — model idealnej charakterystyki NIST.':tol.na?`Klasa ${tolCls} nie jest zdefiniowana dla typu ${type}.`:tol.out?`T_h poza zakresem klasy ${tolCls} (${tol.lo}…${tol.hi} °C).`:`${tol.txt} → przy T_h: ±${a_tol.toFixed(2)} °C`;
  const u_c=Math.sqrt(u_cjc*u_cjc+u_adc*u_adc+u_tol*u_tol);
  const U_exp=2*u_c;

  // R_in label for display
  const rinLabels={50:'Galwanometr Siemens ~1875',100:'Galwanometr precyzyjny ~1900',
    500:'Miliwooltomierz ~1920',100000:'Woltomierz tranzystorowy ~1960',
    1000000:'Woltomierz cyfrowy ~1975',10000000:'Nowoczesny przetwornik'};
  const rinLabel=rinLabels[R_in]||(R_in>=1e6?(R_in/1e6).toFixed(0)+' MΩ':R_in+' Ω');
  const rtcStr=R_tc.toFixed(2)+' Ω';

  // Update R_tc inline display in ctrl panel
  const rtcCalcEl=g('r_tc_calc'); if(rtcCalcEl)rtcCalcEl.textContent=rtcStr;

  // Update chain
  setTxt('cv_th',T_h.toFixed(1));
  setTxt('cv_emf',E_adc.toFixed(4)+(adc_sat?' ⚠':''));
  setTxt('cv_tz',T_z_meas.toFixed(1));
  setTxt('cv_ecorr',E_corr.toFixed(4));
  setTxt('cv_res',T_meas.toFixed(1));

  // Chain box colors
  clrBox('cb_hot','var(--red)');
  const dT_line=Math.abs(dT_rl)+Math.abs(dT_cab);
  clrBox('cb_emf',dT_line<0.1?'var(--green)':dT_line<1?'var(--amber)':'var(--red)');
  clrBox('cb_cjc',dT_cjc_h<0.5?'var(--green)':dT_cjc_h<2?'var(--amber)':'var(--red)');
  clrBox('cb_corr',adc_sat?'var(--red)':Math.abs(dT_adc)<0.1?'var(--green)':Math.abs(dT_adc)<1?'var(--amber)':'var(--red)');
  clrBox('cb_result',Math.abs(T_err)<1?'var(--green)':Math.abs(T_err)<5?'var(--amber)':'var(--red)');

  // Beginner results
  setTxt('r_type_b',type);
  setTxt('r_emf_b',E_adc.toFixed(4));
  setTxt('r_T_b',T_meas.toFixed(1));
  const errCls=Math.abs(T_err)<1?'ok':Math.abs(T_err)<5?'warn':'bad';
  const errStr=(T_err>=0?'+':'')+T_err.toFixed(2)+' °C';
  setClsVal('r_err_b','rval '+errCls,errStr);
  setTxt('r_alpha_b',alph.toFixed(1));

  // Traffic light
  const ok=Math.abs(T_err)<1, warn=Math.abs(T_err)<5;
  tl('tl_g',ok); tl('tl_y',!ok&amp;&amp;warn); tl('tl_r',!warn);
  setTxt('tl_lbl',ok?'Pomiar dokładny (błąd < 1°C)':warn?'Błąd w normie (< 5°C)':'Błąd zbyt duży!');

  // Expert results
  setTxt('r_mat_x',TC[type].mat);
  setTxt('r_Eh_x',E_h.toFixed(4));
  setTxt('r_Ez_x',E_z.toFixed(4));
  setTxt('r_emf_x',E_adc.toFixed(4)+(adc_sat?'  ⚠ nasycenie ADC':''));
  setTxt('r_Ecorr_x',E_corr.toFixed(4));
  setTxt('r_T_x',T_meas.toFixed(1));
  setClsVal('r_err_x','rval '+errCls,errStr);
  setTxt('r_alpha_x',alph.toFixed(2));
  setTxt('r_rtc_x',R_tc.toFixed(2));
  setTxt('r_rin_x',rinLabel);
  setTxt('r_lsb_x',lsb_uV.toFixed(2)+' µV → ±'+dT_adc.toFixed(3)+' °C');
  setTxt('bt_cjc',dT_cjc_h.toFixed(3));
  setTxt('bu_cjc',u_cjc.toFixed(3));
  setTxt('bt_adc',dT_adc.toFixed(3));
  setTxt('bu_adc',u_adc.toFixed(3));
  setTxt('bt_rss',u_c.toFixed(3));
  setTxt('bt_U','±'+U_exp.toFixed(3));
  setTxt('bt_rl',(dT_rl>=0?'+':'')+dT_rl.toFixed(3)+' °C');
  setTxt('bt_tol',tolCls&amp;&amp;a_tol?a_tol.toFixed(3):'—');
  setTxt('bu_tol',tolCls&amp;&amp;a_tol?u_tol.toFixed(3):'—');
  setTxt('bt_cab',(dT_cab>=0?'+':'')+dT_cab.toFixed(3)+' °C');

  // Charts
  drawChart1(type,T_h,T_z,E_h,E_z,E_adc,E_corr,T_meas);
  if(expertMode) drawChart2(type,T_h,alph);
  if(showNL) drawChart3(type,T_h,T_z);
}

function setTxt(id,v){const el=g(id);if(el)el.textContent=v;}
function setClsVal(id,cls,v){const el=g(id);if(el){el.className=cls;el.textContent=v;}}
function clrBox(id,col){const el=g(id);if(el)el.style.borderLeftColor=col;}
function tl(id,on){const el=g(id);if(el)el.classList.toggle('on',on);}

// ============================================================
// CHART 1 — E(T) CHARACTERISTIC
// ============================================================
function drawChart1(type,T_h,T_z,E_h,E_z,E_net,E_corr,T_meas){
  const cv=c1,ctx=x1;
  const W=cv.offsetWidth, H=cv.offsetHeight||280;
  ctx.clearRect(0,0,W,H);
  if(W<60||H<40)return;

  const pL=Math.round(Math.min(60,Math.max(42,W*0.08)));
  const pR=12,pT=16,pB=40;
  const W2=W-pL-pR, H2=H-pT-pB;
  if(W2<50||H2<10)return;

  const d=TC[type];
  const Tmin=d.range[0], Tmax=d.range[1];
  const Emax_tab=emf(type,Tmax);
  const Emin_tab=Math.min(emf(type,Tmin),0);
  const Emax=Emax_tab*1.06;
  const Emin=Emin_tab<=0?Emin_tab-Math.abs(Emax_tab)*0.02:-0.3;

  const tx=T=>pL+(T-Tmin)/(Tmax-Tmin)*W2;
  const ey=E=>pT+H2-(E-Emin)/(Emax-Emin)*H2;

  // Background
  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  ctx.fillStyle=tv('--surf'); ctx.fillRect(pL,pT,W2,H2);

  // Grid
  const fs=Math.max(9,Math.min(11,W*0.018));
  ctx.font=`${fs}px IBM Plex Mono,monospace`;
  ctx.strokeStyle=tv('--border'); ctx.lineWidth=0.5;

  const tStep=getTStep(Tmax-Tmin);
  let tg=Math.ceil(Tmin/tStep)*tStep;
  ctx.fillStyle=tv('--muted'); ctx.textAlign='center'; ctx.textBaseline='top';
  while(tg<=Tmax){
    const x=tx(tg);
    if(x>pL&amp;&amp;x<pL+W2){
      ctx.beginPath();ctx.moveTo(x,pT);ctx.lineTo(x,pT+H2);ctx.stroke();
      ctx.fillText(tg+'°',x,pT+H2+3);
    }
    tg+=tStep;
  }
  const eStep=getEStep(Emax-Emin);
  let eg=Math.ceil(Emin/eStep)*eStep;
  ctx.textAlign='right'; ctx.textBaseline='middle';
  while(eg<=Emax){
    const y=ey(eg);
    if(y>=pT&amp;&amp;y<=pT+H2){
      ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(pL+W2,y);ctx.stroke();
      ctx.fillText(eg.toFixed(1),pL-3,y);
    }
    eg+=eStep;
  }

  // Zero line
  const y0=ey(0);
  if(y0>=pT&amp;&amp;y0<=pT+H2){
    ctx.strokeStyle=tv('--muted'); ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(pL,y0);ctx.lineTo(pL+W2,y0);ctx.stroke();
  }

  // Clip
  ctx.save(); ctx.beginPath(); ctx.rect(pL,pT,W2,H2); ctx.clip();

  // Background curves — pozostałe typy termopar (porównanie czułości)
  const topLabels=[]; // krzywe tła przecinające górną krawędź
  for(const [t,td] of Object.entries(TC)){
    if(t===type) continue;
    ctx.beginPath(); ctx.globalAlpha=0.13; ctx.strokeStyle=td.color; ctx.lineWidth=1;
    // krzywa tła tylko w zakresie definicji danego typu (bez poziomych „ogonów”)
    const T1=Math.max(Tmin,td.range[0]), T2=Math.min(Tmax,td.range[1]);
    for(let i=0;i<=200;i++){
      const T=T1+(T2-T1)*i/200;
      const x=tx(T), y=ey(emf(t,T));
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.globalAlpha=1;

    // Etykieta przy prawym końcu (krzywa kończy się wewnątrz wykresu)
    const Tend=Math.min(td.range[1],Tmax)*0.98;
    const yEnd=ey(emf(t,Tend));
    if(yEnd>=pT+4&amp;&amp;yEnd<=pT+H2-4){
      ctx.font='bold 10px IBM Plex Mono,monospace';
      const tw=ctx.measureText(t).width;
      ctx.globalAlpha=0.6; ctx.fillStyle=tv('--card');
      ctx.fillRect(pL+W2-tw-7, yEnd-7, tw+6, 14);
      ctx.globalAlpha=0.8; ctx.fillStyle=td.color;
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(t, pL+W2-tw-4, yEnd);
      ctx.globalAlpha=1;
    }

    // Krzywa wychodzi przez górną krawędź (większa czułość) → punkt wyjścia T: E(T)=Emax
    if(emf(t,T2)>Emax &amp;&amp; emf(t,T1)<Emax){
      let lo=T1, hi=T2;
      for(let k=0;k<40;k++){const mid=(lo+hi)/2; if(emf(t,mid)<Emax) lo=mid; else hi=mid;}
      topLabels.push({t,color:td.color,x:tx((lo+hi)/2)});
    }
  }

  // Etykiety na górnej krawędzi — rozsunięte, by się nie nakładały.
  // Rysowane na marginesie nad ramką, więc chwilowo poza obszarem przycięcia.
  ctx.restore();
  ctx.font='bold 10px IBM Plex Mono,monospace';
  topLabels.sort((u,v)=>u.x-v.x);
  let lastR=-1e9;
  topLabels.forEach(L=>{
    const lbl='↑'+L.t, tw=ctx.measureText(lbl).width;
    let x=Math.max(L.x-tw/2, lastR+4);
    x=Math.min(x, pL+W2-tw-2); x=Math.max(x, pL+2);
    lastR=x+tw;
    ctx.globalAlpha=0.9; ctx.fillStyle=L.color; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(lbl, x, pT-2);   // na marginesie nad ramką — nie koliduje z opisami w polu wykresu
    ctx.globalAlpha=1;
  });
  ctx.save(); ctx.beginPath(); ctx.rect(pL,pT,W2,H2); ctx.clip();

  // EMF curve fill
  ctx.beginPath();
  ctx.moveTo(tx(Tmin),ey(Emin));
  for(let i=0;i<=300;i++){
    const T=Tmin+(Tmax-Tmin)*i/300;
    ctx.lineTo(tx(T),ey(emf(type,T)));
  }
  ctx.lineTo(tx(Tmax),ey(Emin));
  ctx.closePath();
  ctx.globalAlpha=0.09; ctx.fillStyle=d.color; ctx.fill(); ctx.globalAlpha=1;

  // EMF curve line
  ctx.beginPath(); ctx.strokeStyle=d.color; ctx.lineWidth=2.2;
  for(let i=0;i<=300;i++){
    const T=Tmin+(Tmax-Tmin)*i/300;
    const x=tx(T),y=ey(emf(type,T));
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();

  // Nieliniowość: delikatna prosta przez punkty pracy + zacieniowana odchyłka w [T_z, T_h]
  if(showNL){
    const nl=nlData(type,T_z,T_h);
    if(nl){
      const line=T=>nl.Ez+nl.S*(T-T_z);
      ctx.beginPath(); ctx.moveTo(tx(nl.a),ey(emf(type,nl.a)));
      for(let i=1;i<=120;i++){const T=nl.a+(nl.b-nl.a)*i/120; ctx.lineTo(tx(T),ey(emf(type,T)));}
      ctx.lineTo(tx(nl.b),ey(line(nl.b))); ctx.lineTo(tx(nl.a),ey(line(nl.a))); ctx.closePath();
      ctx.globalAlpha=0.22; ctx.fillStyle=tv('--amber'); ctx.fill(); ctx.globalAlpha=1;
      ctx.strokeStyle=tv('--text'); ctx.globalAlpha=0.55; ctx.lineWidth=1.1; ctx.setLineDash([2,3]);
      ctx.beginPath(); ctx.moveTo(tx(Tmin),ey(line(Tmin))); ctx.lineTo(tx(Tmax),ey(line(Tmax))); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
    }
  }

  // Vertical line T_z
  const xz=tx(T_z);
  ctx.strokeStyle=tv('--cyan'); ctx.lineWidth=1.5; ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(xz,pT);ctx.lineTo(xz,pT+H2);ctx.stroke();
  ctx.setLineDash([]);

  // Vertical line T_h
  const xh=tx(T_h);
  ctx.strokeStyle=tv('--red'); ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(xh,pT);ctx.lineTo(xh,pT+H2);ctx.stroke();
  ctx.setLineDash([]);

  // Horizontal dashes from Y axis to operating points
  const yh=ey(E_h), yz=ey(E_z);
  ctx.strokeStyle=tv('--red'); ctx.lineWidth=1; ctx.setLineDash([2,2]);
  ctx.beginPath();ctx.moveTo(pL,yh);ctx.lineTo(xh,yh);ctx.stroke();
  ctx.strokeStyle=tv('--cyan'); 
  ctx.beginPath();ctx.moveTo(pL,yz);ctx.lineTo(xz,yz);ctx.stroke();
  ctx.setLineDash([]);

  // E_net bracket on Y axis
  if(Math.abs(yh-yz)>8){
    ctx.strokeStyle=tv('--signal'); ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(pL-4,yz);ctx.lineTo(pL-4,yh);ctx.stroke();
    // Arrow head
    ctx.beginPath();
    ctx.moveTo(pL-8,yh+5);ctx.lineTo(pL-4,yh);ctx.lineTo(pL,yh+5);
    ctx.stroke();
  }

  // Operating point — cold junction (T_z) — draggable
  ctx.fillStyle=tv('--cyan');
  ctx.beginPath();ctx.arc(xz,yz,6,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=tv('--surf');ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(xz,yz,6,0,Math.PI*2);ctx.stroke();
  // crosshair icon
  ctx.strokeStyle=tv('--cyan');ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(xz-3,yz);ctx.lineTo(xz+3,yz);ctx.stroke();
  ctx.beginPath();ctx.moveTo(xz,yz-3);ctx.lineTo(xz,yz+3);ctx.stroke();

  // Operating point — hot junction (T_h) — draggable
  ctx.fillStyle=tv('--signal');
  ctx.beginPath();ctx.arc(xh,yh,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=tv('--surf');ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(xh,yh,7,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(xh-3.5,yh);ctx.lineTo(xh+3.5,yh);ctx.stroke();
  ctx.beginPath();ctx.moveTo(xh,yh-3.5);ctx.lineTo(xh,yh+3.5);ctx.stroke();

  // T_meas marker (if differs from T_h)
  if(Math.abs(T_meas-T_h)>0.5){
    const xm=tx(T_meas);
    const Em_on_curve=emf(type,T_meas);
    const ym=ey(Em_on_curve);
    ctx.fillStyle=tv('--amber');
    ctx.beginPath();ctx.arc(xm,ym,4,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();

  // Axis labels
  ctx.fillStyle=tv('--muted'); ctx.font=`10px IBM Plex Sans,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText('T [°C]',pL+W2/2,H-1);
  ctx.save(); ctx.translate(9,pT+H2/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('E [mV]',0,0); ctx.restore();

  // Legend
  const lx=pL+6,ly=pT+4;
  ctx.fillStyle=d.color; ctx.fillRect(lx,ly,14,2.5);
  ctx.fillStyle=tv('--text'); ctx.font='9px IBM Plex Sans,monospace';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('E(T) typ '+type,lx+17,ly+1);

  // E_net label
  if(Math.abs(E_net)>0.1){
    const ym=(yh+yz)/2;
    ctx.fillStyle=tv('--signal'); ctx.font='9px IBM Plex Mono,monospace';
    ctx.textAlign='left';
    ctx.fillText('E='+(E_net>=0?'+':'')+E_net.toFixed(3)+'mV',pL+4,ym);
  }

  // T_h label
  if(xh>pL+5&amp;&amp;xh<pL+W2-5){
    ctx.fillStyle=tv('--red'); ctx.textAlign='center'; ctx.font='9px IBM Plex Sans,monospace';
    ctx.fillText('T_h='+T_h.toFixed(0)+'°',Math.min(xh,pL+W2-22),pT+8);
  }

  // Border — always last
  ctx.strokeStyle=tv('--border'); ctx.lineWidth=1;
  ctx.strokeRect(pL,pT,W2,H2);
}

// ============================================================
// CHART 3 — BŁĄD NIELINIOWOŚCI δT(T)
// ============================================================
function drawChart3(type,T_h,T_z){
  const cv=c3,ctx=x3;
  const W=cv.offsetWidth, H=cv.offsetHeight||190;
  ctx.clearRect(0,0,W,H);
  if(W<60||H<40)return;
  const pL=Math.round(Math.min(60,Math.max(42,W*0.08)));   // jak na wykresie E(T) — wspólna oś T
  const pR=12,pT=22,pB=36, W2=W-pL-pR, H2=H-pT-pB;
  if(W2<50||H2<10)return;
  const d=TC[type], Tmin=d.range[0], Tmax=d.range[1];
  const tx=T=>pL+(T-Tmin)/(Tmax-Tmin)*W2;
  const fs=Math.max(9,Math.min(11,W*0.018));
  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  ctx.fillStyle=tv('--surf'); ctx.fillRect(pL,pT,W2,H2);
  const nl=nlData(type,T_z,T_h);
  if(!nl){
    ctx.fillStyle=tv('--muted'); ctx.font=`${fs}px IBM Plex Sans,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('T_h i T_z muszą się różnić, by poprowadzić prostą',pL+W2/2,pT+H2/2);
    ctx.strokeStyle=tv('--border'); ctx.strokeRect(pL,pT,W2,H2); return;
  }
  // skala Y z przedziału [T_z, T_h] (poza nim ekstrapolacja — przycięta)
  const yr=Math.max(0.2,Math.abs(nl.mx.dT)*1.8);
  const ty=v=>pT+H2/2-v/yr*(H2/2);
  // siatka
  ctx.font=`${fs}px IBM Plex Mono,monospace`; ctx.lineWidth=0.5;
  const raw=yr/2, p10=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p10, ys=(f<1.5?1:f<3?2:f<7?5:10)*p10;
  for(let v=-Math.floor(yr/ys)*ys; v<=yr+1e-9; v+=ys){
    ctx.strokeStyle=Math.abs(v)<1e-9?tv('--border2'):tv('--plot-grid');
    ctx.beginPath(); ctx.moveTo(pL,ty(v)); ctx.lineTo(pL+W2,ty(v)); ctx.stroke();
    ctx.fillStyle=tv('--muted'); ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText((v>0?'+':'')+(ys<1?v.toFixed(1):v.toFixed(0)),pL-4,ty(v));
  }
  const tStep=getTStep(Tmax-Tmin);
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(let T=Math.ceil(Tmin/tStep)*tStep; T<=Tmax; T+=tStep){
    ctx.strokeStyle=tv('--plot-grid'); ctx.beginPath(); ctx.moveTo(tx(T),pT); ctx.lineTo(tx(T),pT+H2); ctx.stroke();
    ctx.fillStyle=tv('--muted'); ctx.fillText(T+'°',tx(T),pT+H2+4);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(pL,pT,W2,H2); ctx.clip();
  // przedział [T_z, T_h]
  ctx.fillStyle=tv('--amber-dim'); ctx.fillRect(tx(nl.a),pT,tx(nl.b)-tx(nl.a),H2);
  // krzywa: poza przedziałem przygaszona (ekstrapolacja)
  for(const [lo,hi,alpha_] of [[Tmin,nl.a,0.35],[nl.a,nl.b,1],[nl.b,Tmax,0.35]]){
    if(hi-lo<1e-6) continue;
    ctx.globalAlpha=alpha_; ctx.strokeStyle=d.color; ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<=200;i++){const T=lo+(hi-lo)*i/200; i?ctx.lineTo(tx(T),ty(nl.dT(T))):ctx.moveTo(tx(T),ty(nl.dT(T)));}
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  // punkty kalibracji (błąd zerowy) i maksimum
  [[T_z,tv('--cyan')],[T_h,tv('--signal')]].forEach(([T,c])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(tx(T),ty(0),5,0,Math.PI*2);ctx.fill();});
  const xm=tx(nl.mx.T), ym=ty(nl.mx.dT);
  ctx.strokeStyle=tv('--amber'); ctx.setLineDash([2,2]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(xm,ty(0)); ctx.lineTo(xm,ym); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=tv('--amber'); ctx.beginPath(); ctx.arc(xm,ym,4.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // opis maksimum
  ctx.font=`600 ${fs}px IBM Plex Mono,monospace`; ctx.fillStyle=tv('--amber');
  const lab=`max δT = ${nl.mx.dT>=0?'+':''}${nl.mx.dT.toFixed(2)} °C przy ${nl.mx.T.toFixed(0)} °C`;
  ctx.textAlign=xm>pL+W2*0.6?'right':'left'; ctx.textBaseline=nl.mx.dT>=0?'bottom':'top';
  ctx.fillText(lab, xm+(xm>pL+W2*0.6?-8:8), ym+(nl.mx.dT>=0?-4:4));
  // podsumowanie nad wykresem
  ctx.font=`${fs}px IBM Plex Mono,monospace`; ctx.fillStyle=tv('--muted'); ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(`S = ${(nl.S*1000).toFixed(2)} µV/°C · max ΔE = ${(nl.mx.dE*1000).toFixed(1)} µV · nieliniowość = ${nl.fsPct.toFixed(2)} % zakresu`,pL,pT-4);
  ctx.fillStyle=tv('--muted'); ctx.font='10px IBM Plex Sans,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText('T [°C]',pL+W2/2,H-1);
  ctx.save(); ctx.translate(9,pT+H2/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('δT [°C]',0,0); ctx.restore();
  ctx.strokeStyle=tv('--border'); ctx.lineWidth=1; ctx.strokeRect(pL,pT,W2,H2);
}

// ============================================================
// CHART 2 — SENSITIVITY α(T)
// ============================================================
function drawChart2(type,T_h,alph_h){
  const cv=c2,ctx=x2;
  const W=cv.offsetWidth, H=cv.offsetHeight||190;
  ctx.clearRect(0,0,W,H);
  if(W<60||H<30)return;

  const pL=Math.round(Math.min(60,Math.max(42,W*0.08)));
  const pR=12,pT=14,pB=36;
  const W2=W-pL-pR, H2=H-pT-pB;
  if(W2<50||H2<10)return;

  const d=TC[type];
  const Tmin=d.range[0],Tmax=d.range[1];
  let aMin=Infinity,aMax=-Infinity;
  for(let i=0;i<=200;i++){
    const T=Tmin+(Tmax-Tmin)*i/200;
    const a=alpha(type,T);
    if(a<aMin)aMin=a; if(a>aMax)aMax=a;
  }
  aMin=Math.max(0,aMin-1); aMax=aMax+2;

  const tx=T=>pL+(T-Tmin)/(Tmax-Tmin)*W2;
  const ay=a=>pT+H2-(a-aMin)/(aMax-aMin)*H2;

  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  ctx.fillStyle=tv('--surf'); ctx.fillRect(pL,pT,W2,H2);

  const fs=Math.max(9,Math.min(10,W*0.016));
  ctx.font=`${fs}px IBM Plex Mono,monospace`;
  ctx.strokeStyle=tv('--border'); ctx.lineWidth=0.5;

  const tStep=getTStep(Tmax-Tmin);
  let tg=Math.ceil(Tmin/tStep)*tStep;
  ctx.fillStyle=tv('--muted'); ctx.textAlign='center'; ctx.textBaseline='top';
  while(tg<=Tmax){
    const x=tx(tg);
    if(x>pL&amp;&amp;x<pL+W2){ctx.beginPath();ctx.moveTo(x,pT);ctx.lineTo(x,pT+H2);ctx.stroke();ctx.fillText(tg+'°',x,pT+H2+3);}
    tg+=tStep;
  }
  const aRange=aMax-aMin;
  const aStep=aRange>40?10:aRange>20?5:aRange>10?2:1;
  let ag=Math.ceil(aMin/aStep)*aStep;
  ctx.textAlign='right'; ctx.textBaseline='middle';
  while(ag<=aMax){
    const y=ay(ag);
    if(y>=pT&amp;&amp;y<=pT+H2){ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(pL+W2,y);ctx.stroke();ctx.fillText(ag.toFixed(0),pL-3,y);}
    ag+=aStep;
  }

  ctx.save(); ctx.beginPath(); ctx.rect(pL,pT,W2,H2); ctx.clip();

  // Fill
  ctx.beginPath(); ctx.moveTo(tx(Tmin),ay(aMin));
  for(let i=0;i<=200;i++){
    const T=Tmin+(Tmax-Tmin)*i/200;
    ctx.lineTo(tx(T),ay(alpha(type,T)));
  }
  ctx.lineTo(tx(Tmax),ay(aMin)); ctx.closePath();
  ctx.globalAlpha=0.11; ctx.fillStyle=tv('--cyan'); ctx.fill(); ctx.globalAlpha=1;

  // Curve
  ctx.beginPath(); ctx.strokeStyle=tv('--cyan'); ctx.lineWidth=2;
  for(let i=0;i<=200;i++){
    const T=Tmin+(Tmax-Tmin)*i/200;
    const x=tx(T),y=ay(alpha(type,T));
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();

  // Operating point
  const xh=tx(T_h), yah=ay(alph_h);
  ctx.strokeStyle=tv('--signal'); ctx.lineWidth=1; ctx.setLineDash([2,2]);
  ctx.beginPath();ctx.moveTo(pL,yah);ctx.lineTo(xh,yah);ctx.stroke();
  ctx.beginPath();ctx.moveTo(xh,pT);ctx.lineTo(xh,pT+H2);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=tv('--signal');
  ctx.beginPath();ctx.arc(xh,yah,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=tv('--surf');ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(xh,yah,5,0,Math.PI*2);ctx.stroke();

  ctx.restore();

  ctx.fillStyle=tv('--muted'); ctx.font='10px IBM Plex Sans,monospace';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText('T [°C]',pL+W2/2,H-1);
  ctx.save(); ctx.translate(9,pT+H2/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('α [µV/°C]',0,0); ctx.restore();

  ctx.fillStyle=tv('--signal'); ctx.font='9px IBM Plex Sans,monospace';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('α = '+alph_h.toFixed(1)+' µV/°C @ T_h',pL+5,pT+9);

  ctx.strokeStyle=tv('--border'); ctx.lineWidth=1;
  ctx.strokeRect(pL,pT,W2,H2);
}

// ============================================================
// AXIS STEP HELPERS
// ============================================================
function getTStep(r){
  if(r>1200)return 200; if(r>600)return 100; if(r>300)return 50; if(r>150)return 20; return 10;
}
function getEStep(r){
  if(r>70)return 10; if(r>35)return 5; if(r>15)return 2; return 1;
}

// ============================================================
// CHART 1 — DRAG INTERACTION (T_h i T_z)
// ============================================================
(function(){
  let dragging=null; // 'th' | 'tz' | null

  function chartGeom(){
    const W=c1.offsetWidth, H=c1.offsetHeight||280;
    const pL=Math.round(Math.min(60,Math.max(42,W*0.08)));
    const pR=12,pT=16,pB=40;
    return{W,H,pL,pR,pT,pB,W2:W-pL-pR,H2:H-pT-pB};
  }

  function xToT(px){
    const {pL,W2}=chartGeom();
    const suf=expertMode?'x':'b';
    const type=g('tcType_'+suf).value;
    const d=TC[type];
    const T=d.range[0]+(px-pL)/W2*(d.range[1]-d.range[0]);
    return Math.max(d.range[0],Math.min(d.range[1],Math.round(T)));
  }

  function hitTest(px,py){
    const {pL,pT,W2,H2}=chartGeom();
    const suf=expertMode?'x':'b';
    const type=g('tcType_'+suf).value;
    const T_h=parseFloat(g('nu_th_'+suf).value)||0;
    const T_z=parseFloat(g('nu_tz_'+suf).value)||0;
    const d=TC[type];
    const Tmin=d.range[0],Tmax=d.range[1];
    const Emax=emf(type,Tmax)*1.06;
    const Emin=Math.min(emf(type,Tmin),0)-Math.abs(emf(type,Tmax))*0.02;
    const txF=T=>pL+(T-Tmin)/(Tmax-Tmin)*W2;
    const eyF=E=>pT+H2-(E-Emin)/(Emax-Emin)*H2;
    const xh=txF(T_h),yh=eyF(emf(type,T_h));
    const xz=txF(T_z),yz=eyF(emf(type,T_z));
    if(Math.hypot(px-xh,py-yh)<14) return 'th';
    if(Math.hypot(px-xz,py-yz)<12) return 'tz';
    return null;
  }

  function applyDrag(px){
    const T=xToT(px);
    const suf=expertMode?'x':'b';
    if(dragging==='th'){
      // T_h nie może być ≤ T_z
      const Tz=parseFloat(g('nu_tz_'+suf).value)||0;
      const Tfinal=Math.max(T, Tz+1);
      setTh(Tfinal,'b'); setTh(Tfinal,'x');
    } else {
      // T_z nie może być ≥ T_h
      const Th=parseFloat(g('nu_th_'+suf).value)||0;
      const slTz=g('sl_tz_'+suf);
      const Tfinal=Math.max(parseFloat(slTz?.min||0),Math.min(T, Th-1));
      setTz(Tfinal,'b'); setTz(Tfinal,'x');
    }
    scheduleUpdate();
  }

  function getPos(e,canvas){
    const r=canvas.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return{x:src.clientX-r.left, y:src.clientY-r.top};
  }

  c1.addEventListener('mousedown',e=>{
    const {x,y}=getPos(e,c1);
    dragging=hitTest(x,y);
    if(dragging) c1.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',e=>{
    if(!dragging) return;
    const {x}=getPos(e,c1);
    applyDrag(x);
  });
  window.addEventListener('mouseup',()=>{
    dragging=null; c1.style.cursor='';
  });
  c1.addEventListener('mousemove',e=>{
    if(dragging) return;
    const {x,y}=getPos(e,c1);
    c1.style.cursor=hitTest(x,y)?'grab':'default';
  });
  c1.addEventListener('mouseleave',()=>{
    if(!dragging) c1.style.cursor='';
  });

  // Touch
  c1.addEventListener('touchstart',e=>{
    const {x,y}=getPos(e,c1);
    dragging=hitTest(x,y);
    if(dragging) e.preventDefault();
  },{passive:false});
  window.addEventListener('touchmove',e=>{
    if(!dragging) return;
    e.preventDefault();
    const {x}=getPos(e,c1);
    applyDrag(x);
  },{passive:false});
  window.addEventListener('touchend',()=>{dragging=null;});
})();

function init(){

  ['sl_tz_b','sl_tz_x','sl_cjc_x','sl_wl_x','sl_adc_x','sl_adcr_x'].forEach(id=>{
    const s=g(id); if(s)slPct(s);
  });
  applyMode();
  window.addEventListener('resize',()=>scheduleUpdate());
  // Odbieranie globalnego przełącznika motywu z rodzica (index.html)
  window.addEventListener('message',e=>{
    if(e.data?.type==='setTheme'){
      const wantDark=e.data.dark;
      if(wantDark!==isDark){
        isDark=wantDark;
        document.body.classList.toggle('theme-dark', isDark);
        document.body.classList.toggle('theme-light', !isDark);
        scheduleUpdate();
      }
    }
  });
  scheduleUpdate();
}

  exp:'SEM zależy od obu temperatur: E<sub>AB</sub>(T<sub>h</sub>,T<sub>z</sub>) = E(T<sub>h</sub>) − E(T<sub>z</sub>), gdzie E(T) to wartości tablicowe względem 0 °C. E(280 °C) daje inny wynik, bo charakterystyka jest nieliniowa — różnica temperatur to nie to samo co różnica napięć.',

  opts:['O ok. +1,9 °C — błąd skalowany przez α(T<sub>z</sub>)/α(T<sub>h</sub>)','Dokładnie o +2,0 °C','O ok. −2 °C — kompensacja odejmuje','Nie przesunie się — CJC usuwa błąd'], a:0,

/* ── QUIZ — pytania sprawdzające (wspólny moduł) ─────────────── */
const Quiz=(()=>{
  let order=[],perm=[],i=0,score=0,answered=false,picked=-1;
  const $=id=>document.getElementById(id);
  const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;};
  function start(){order=shuffle(QUIZ_Q.map((_,k)=>k));i=0;score=0;answered=false;newPerm();}
  function newPerm(){const q=QUIZ_Q[order[i]];perm=q?shuffle(q.opts.map((_,k)=>k)):[];picked=-1;}
  function open(){if(!order.length)start();$('qzBack').style.display='none';$('quizOv').classList.add('open');render();}
  function close(){$('quizOv').classList.remove('open');}
  function render(){
    const body=$('qzBody'), n=QUIZ_Q.length;
    if(i>=n){
      const pct=Math.round(score/n*100);
      const msg=pct>=90?'Świetnie — materiał opanowany.':pct>=70?'Dobrze — przejrzyj wyjaśnienia pytań z błędami.':pct>=50?'Połowicznie — wróć do zakładki 📖 Teoria i spróbuj ponownie.':'Warto jeszcze raz przejść przez Teorię i poeksperymentować z symulatorem.';
      $('qzProg').textContent=`${n}/${n}`;
      body.innerHTML=`<div class=&quot;qz-sum&quot;><div class=&quot;qz-score&quot;>${score} / ${n}</div><div class=&quot;qz-pct&quot;>${pct} %</div><p>${msg}</p>
        <button class=&quot;qz-btn qz-pri&quot; onclick=&quot;Quiz.restart()&quot;>↻ Od nowa (nowa kolejność)</button></div>`;
      return;
    }
    const q=QUIZ_Q[order[i]];
    $('qzProg').textContent=`${i+1}/${n} · wynik ${score}`;
    const opts=perm.map((k,pos)=>{
      let cls='qz-opt';
      if(answered){ if(k===q.a) cls+=' ok'; else if(pos===picked) cls+=' bad'; else cls+=' dim'; }
      return `<button class=&quot;${cls}&quot; ${answered?'disabled':''} onclick=&quot;Quiz.answer(${pos})&quot;><span class=&quot;qz-l&quot;>${'ABCD'[pos]}</span>${q.opts[k]}</button>`;
    }).join('');
    const fb=answered?`<div class=&quot;qz-fb ${perm[picked]===q.a?'ok':'bad'}&quot;><b>${perm[picked]===q.a?'✓ Dobrze.':'✗ Niestety nie.'}</b> ${q.exp}</div>`:'';
    body.innerHTML=`<div class=&quot;qz-topic&quot;>${q.topic}</div><p class=&quot;qz-q&quot;>${q.q}</p><div class=&quot;qz-opts&quot;>${opts}</div>${fb}
      <div class=&quot;qz-nav&quot;>${q.setup?`<button class=&quot;qz-btn&quot; onclick=&quot;Quiz.tryIt()&quot; title=&quot;Ustawia scenariusz pytania w symulatorze&quot;>🔬 Sprawdź w symulatorze</button>`:''}
      <button class=&quot;qz-btn qz-pri&quot; ${answered?'':'disabled'} onclick=&quot;Quiz.next()&quot;>${i+1<n?'Dalej →':'Wynik'}</button></div>`;
  }
  function answer(pos){if(answered)return;answered=true;picked=pos;if(perm[pos]===QUIZ_Q[order[i]].a)score++;render();}
  function next(){i++;answered=false;if(i<QUIZ_Q.length)newPerm();render();}
  function tryIt(){const q=QUIZ_Q[order[i]];if(q&amp;&amp;q.setup)q.setup();close();$('qzBack').style.display='block';}
  function restart(){start();render();}
  return {open,close,answer,next,tryIt,restart};
})();

<body>
<header>
  <div class=&quot;ht&quot;>
    <h1>⚡ Efekt Seebecka — mechanizm powstawania SEM</h1>
    <p>Rozkład T(x), gęstość e⁻, napięcia kontaktowe i poziomy Fermiego · AGH Metrologia</p>
  </div>
  <div class=&quot;cbar&quot;>
    <div class=&quot;ci&quot;><label for=&quot;selPreset&quot;>Termopara:</label>
      <select id=&quot;selPreset&quot; onchange=&quot;applyPreset(this.value)&quot;>
        <option value=&quot;&quot;>— własna para —</option>
        <option value=&quot;K&quot; selected>K: Chromel / Alumel</option>
        <option value=&quot;J&quot;>J: Żelazo / Konstantan</option>
        <option value=&quot;T&quot;>T: Miedź / Konstantan</option>
        <option value=&quot;E&quot;>E: Chromel / Konstantan</option>
        <option value=&quot;N&quot;>N: Nicrosil / Nisil</option>
        <option value=&quot;R&quot;>R: Pt-13%Rh / Pt</option>
        <option value=&quot;S&quot;>S: Pt-10%Rh / Pt</option>
      </select>
    </div>
    <div class=&quot;ci&quot;><label for=&quot;selA&quot;>Metal A:</label><select id=&quot;selA&quot; onchange=&quot;setMat('A',this.value)&quot;></select></div>
    <div class=&quot;ci&quot;><label for=&quot;selB&quot;>Metal B:</label><select id=&quot;selB&quot; onchange=&quot;setMat('B',this.value)&quot;></select></div>
    <div class=&quot;ci&quot;><label for=&quot;slTx&quot;>T<sub>x</sub>:</label>
      <input type=&quot;range&quot; id=&quot;slTx&quot; min=&quot;30&quot; max=&quot;800&quot; step=&quot;5&quot; value=&quot;300&quot; oninput=&quot;setState('Tx',+this.value);slPct(this);g('vTx').textContent=this.value+' °C'&quot;>
      <span class=&quot;vb&quot; id=&quot;vTx&quot;>300 °C</span></div>
    <div class=&quot;ci&quot;><label for=&quot;slT0&quot;>T<sub>0</sub>:</label>
      <input type=&quot;range&quot; id=&quot;slT0&quot; min=&quot;-30&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;20&quot; oninput=&quot;setState('T0',+this.value);slPct(this);g('vT0').textContent=this.value+' °C'&quot;>
      <span class=&quot;vb&quot; id=&quot;vT0&quot;>20 °C</span></div>
    <div class=&quot;ci&quot;><label for=&quot;slN&quot;>N seg.:</label>
      <input type=&quot;range&quot; id=&quot;slN&quot; min=&quot;10&quot; max=&quot;60&quot; step=&quot;5&quot; value=&quot;30&quot; oninput=&quot;setState('N',+this.value);slPct(this);g('vN').textContent=this.value&quot;>
      <span class=&quot;vb&quot; id=&quot;vN&quot;>30</span></div>
    <button class=&quot;btn&quot; onclick=&quot;toggleDocs()&quot;>📖 Teoria</button>
    <button class=&quot;btn&quot; onclick=&quot;Quiz.open()&quot;>❓ Sprawdź się</button>
  </div>
</header>

<div class=&quot;src-bar&quot;>
  <span class=&quot;src-label&quot;>Źródło zewnętrzne:</span>
  <div class=&quot;src-kind&quot;>
    <button class=&quot;sk-btn active&quot; data-k=&quot;none&quot; onclick=&quot;setSrc('none')&quot;>Brak</button>
    <button class=&quot;sk-btn&quot; data-k=&quot;A+&quot; onclick=&quot;setSrc('A+')&quot;>🔥 Elektroda A</button>
    <button class=&quot;sk-btn&quot; data-k=&quot;A-&quot; onclick=&quot;setSrc('A-')&quot;>❄️ Elektroda A</button>
    <button class=&quot;sk-btn&quot; data-k=&quot;B+&quot; onclick=&quot;setSrc('B+')&quot;>🔥 Elektroda B</button>
    <button class=&quot;sk-btn&quot; data-k=&quot;B-&quot; onclick=&quot;setSrc('B-')&quot;>❄️ Elektroda B</button>
    <button class=&quot;sk-btn&quot; data-k=&quot;AB+&quot; onclick=&quot;setSrc('AB+')&quot;>🔥 Obie elektrody</button>
    <button class=&quot;sk-btn&quot; data-k=&quot;AB-&quot; onclick=&quot;setSrc('AB-')&quot;>❄️ Obie elektrody</button>
  </div>
  <div class=&quot;ci&quot; id=&quot;srcCtrls&quot; style=&quot;display:none&quot;>
    <label for=&quot;slPos&quot;>Pozycja:</label>
    <input type=&quot;range&quot; id=&quot;slPos&quot; min=&quot;5&quot; max=&quot;95&quot; step=&quot;1&quot; value=&quot;50&quot; oninput=&quot;setState('srcPos',this.value/100);slPct(this);g('vPos').textContent=this.value+' %'&quot;>
    <span class=&quot;vb&quot; id=&quot;vPos&quot;>50 %</span>
    <label for=&quot;slDT&quot;>ΔT:</label>
    <input type=&quot;range&quot; id=&quot;slDT&quot; min=&quot;10&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;200&quot; oninput=&quot;setState('srcDT',+this.value);slPct(this);g('vDT').textContent=this.value+' °C'&quot;>
    <span class=&quot;vb&quot; id=&quot;vDT&quot;>200 °C</span>
  </div>
</div>

<div class=&quot;src-bar&quot;>
  <span class=&quot;src-label&quot;>Niejednorodność:</span>
  <div class=&quot;src-kind&quot;>
    <button class=&quot;sk-btn inh-btn active&quot; data-w=&quot;none&quot; onclick=&quot;setInh('none')&quot;>Brak</button>
    <button class=&quot;sk-btn inh-btn&quot; data-w=&quot;A&quot; onclick=&quot;setInh('A')&quot;>Odcinek elektrody A</button>
    <button class=&quot;sk-btn inh-btn&quot; data-w=&quot;B&quot; onclick=&quot;setInh('B')&quot;>Odcinek elektrody B</button>
  </div>
  <div class=&quot;ci&quot; id=&quot;inhCtrls&quot; style=&quot;display:none&quot;>
    <label for=&quot;slInhPos&quot;>Pozycja:</label>
    <input type=&quot;range&quot; id=&quot;slInhPos&quot; min=&quot;10&quot; max=&quot;90&quot; step=&quot;1&quot; value=&quot;60&quot; oninput=&quot;setState('inhPos',this.value/100);slPct(this);g('vInhPos').textContent=this.value+' %'&quot;>
    <span class=&quot;vb&quot; id=&quot;vInhPos&quot;>60 %</span>
    <label for=&quot;slInhWid&quot;>Szer.:</label>
    <input type=&quot;range&quot; id=&quot;slInhWid&quot; min=&quot;4&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;12&quot; oninput=&quot;setState('inhWid',this.value/100);slPct(this);g('vInhWid').textContent=this.value+' %'&quot;>
    <span class=&quot;vb&quot; id=&quot;vInhWid&quot;>12 %</span>
    <label for=&quot;slInhDA&quot;>Δα:</label>
    <input type=&quot;range&quot; id=&quot;slInhDA&quot; min=&quot;-15&quot; max=&quot;15&quot; step=&quot;0.5&quot; value=&quot;-8&quot; oninput=&quot;setState('inhDA',+this.value);slPct(this);g('vInhDA').textContent=(this.value>0?'+':'')+this.value+' µV/°C'&quot;>
    <span class=&quot;vb&quot; id=&quot;vInhDA&quot; style=&quot;min-width:6.5rem&quot;>-8 µV/°C</span>
  </div>
  <div class=&quot;ci&quot; style=&quot;margin-left:.4rem&quot;><span class=&quot;src-label&quot;>Zaciski:</span><label for=&quot;slDT0B&quot;>T(Cu|B) − T(Cu|A):</label>
    <input type=&quot;range&quot; id=&quot;slDT0B&quot; min=&quot;-20&quot; max=&quot;20&quot; step=&quot;1&quot; value=&quot;0&quot; oninput=&quot;setState('dT0B',+this.value);slPct(this);g('vDT0B').textContent=(this.value>0?'+':'')+this.value+' °C'&quot;>
    <span class=&quot;vb&quot; id=&quot;vDT0B&quot;>0 °C</span></div>
</div>

<div class=&quot;main&quot;>
  <div class=&quot;col&quot;>
    <div class=&quot;panel&quot;>
      <div class=&quot;ptitle&quot;>Schemat obwodu termopary
        <span class=&quot;hint&quot; id=&quot;circHint&quot;>woltomierz · przewody Cu (metal C) · elektrody A i B · spoina pomiarowa</span>
      </div>
      <canvas id=&quot;cCirc&quot;></canvas>
    </div>
    <div class=&quot;panel&quot;>
      <div class=&quot;ptitle&quot;>Poziomy Fermiego przy złączach
        <span class=&quot;hint&quot;>energia względem próżni · stan przed zetknięciem · strzałka = napięcie kontaktowe</span>
      </div>
      <canvas id=&quot;cFermi&quot;></canvas>
    </div>
  </div>
  <div class=&quot;col&quot;>
    <div class=&quot;panel&quot;>

    </div>
    <div class=&quot;panel&quot;>
      <div class=&quot;ptitle&quot;>Wkłady segmentów dV = α·ΔT — teleskopowanie</div>
      <canvas id=&quot;cSegs&quot;></canvas>
    </div>
    <div class=&quot;panel&quot;>
      <div class=&quot;ptitle&quot;>Potencjał wzdłuż obwodu
        <span class=&quot;seg-tog&quot; id=&quot;vModeBtns&quot;>
          <button data-v=&quot;ec&quot; class=&quot;active&quot; onclick=&quot;setVMode('ec')&quot;>elektrochemiczny (mierzony)</button>
          <button data-v=&quot;es&quot; onclick=&quot;setVMode('es')&quot;>elektrostatyczny + kontaktowe</button>
        </span>
