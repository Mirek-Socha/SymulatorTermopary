    </div>
  </div>
</div>

<div class=&quot;rbar&quot; id=&quot;rbar&quot;></div>

<div class=&quot;docs-overlay&quot; id=&quot;docsOverlay&quot;>
  <div class=&quot;docs-hdr&quot;>
    <h2>📖 Efekt Seebecka — teoria</h2>
    <button class=&quot;btn&quot; onclick=&quot;toggleDocs()&quot;>✕ Zamknij</button>
  </div>
  <div class=&quot;docs-body&quot; id=&quot;explDiv&quot;></div>
</div>

<script>
'use strict';
const g=id=>document.getElementById(id);
const tv=v=>getComputedStyle(document.body).getPropertyValue(v).trim();
const isDark=()=>!document.body.classList.contains('light');
const clamp=(lo,hi,v)=>Math.max(lo,Math.min(hi,v));
const FONT=&quot;'IBM Plex Sans',system-ui,sans-serif&quot;, MONO=&quot;'IBM Plex Mono',ui-monospace,monospace&quot;;

/* ── BAZA MATERIAŁÓW ───────────────────────────────────────────
   alpha [µV/°C] — bezwzględny współczynnik Seebecka (≈300 K, stały w modelu).
     Dla stopów termoparowych dobrany tak, by różnice odtwarzały czułości
     NIST ITS-90 przy 0 °C: K 39,4 · J 50,4 · T 38,8 · E 58,7 · N 26,2 · R 5,3 · S 5,4 µV/°C.
   W [eV]  — praca wyjścia (polikryształ); est:true = szacunek (stop / półprzewodnik).
   ef [eV] — energia Fermiego od dna pasma (model elektronów swobodnych, poglądowo).
──────────────────────────────────────────────────────────────── */
const METALS={
  pt:     {name:'Platyna (Pt)',            sh:'Pt',        alpha:-5.0, W:5.65, ef:5.32, c:'#c4c4c4'},
  pd:     {name:'Pallad (Pd)',             sh:'Pd',        alpha:-10.7,W:5.22, ef:5.17, c:'#9d9d9d'},
  au:     {name:'Złoto (Au)',              sh:'Au',        alpha:1.9,  W:5.10, ef:5.53, c:'#eab308'},
  ag:     {name:'Srebro (Ag)',             sh:'Ag',        alpha:1.5,  W:4.26, ef:5.49, c:'#a8b3bf'},
  cu:     {name:'Miedź (Cu)',              sh:'Cu',        alpha:1.8,  W:4.65, ef:7.00, c:'#c26a2b'},
  al:     {name:'Aluminium (Al)',          sh:'Al',        alpha:-1.7, W:4.28, ef:11.7, c:'#7c8b99'},
  ni:     {name:'Nikiel (Ni)',             sh:'Ni',        alpha:-19.5,W:5.15, ef:7.37, c:'#8b8bb5'},
  fe:     {name:'Żelazo (Fe)',             sh:'Fe',        alpha:13.4, W:4.50, ef:11.1, c:'#ef4444'},
  w:      {name:'Wolfram (W)',             sh:'W',         alpha:1.1,  W:4.55, ef:9.75, c:'#64748b'},
  cr:     {name:'Chrom (Cr)',              sh:'Cr',        alpha:21.8, W:4.50, ef:7.05, c:'#94a3b8'},
  co:     {name:'Kobalt (Co)',             sh:'Co',        alpha:-30.8,W:5.00, ef:7.57, c:'#6366f1'},
  bi:     {name:'Bizmut (Bi)',             sh:'Bi',        alpha:-72.0,W:4.22, ef:4.22, c:'#c084fc'},
  sb:     {name:'Antymon (Sb)',            sh:'Sb',        alpha:47.0, W:4.55, ef:10.4, c:'#818cf8'},
  mo:     {name:'Molibden (Mo)',           sh:'Mo',        alpha:5.6,  W:4.60, ef:7.24, c:'#7a7a9a'},
  chromel:{name:'Chromel (Ni-Cr)',         sh:'Chromel',   alpha:21.7, W:5.09, ef:7.20, c:'#f59e0b', est:true},
  alumel: {name:'Alumel (Ni-Al)',          sh:'Alumel',    alpha:-17.7,W:5.12, ef:7.45, c:'#06b6d4', est:true},
  konst:  {name:'Konstantan (Cu-Ni)',      sh:'Konstantan',alpha:-37.0,W:4.88, ef:6.90, c:'#a855f7', est:true},
  nicros: {name:'Nicrosil (Ni-Cr-Si)',     sh:'Nicrosil',  alpha:13.0, W:5.06, ef:7.15, c:'#f97316', est:true},
  nisil:  {name:'Nisil (Ni-Si)',           sh:'Nisil',     alpha:-13.2,W:5.14, ef:7.30, c:'#8b5cf6', est:true},
  ptrh13: {name:'Pt-13%Rh',                sh:'PtRh13',    alpha:0.3,  W:5.56, ef:5.25, c:'#e2c08d', est:true},
  ptrh10: {name:'Pt-10%Rh',                sh:'PtRh10',    alpha:0.4,  W:5.58, ef:5.20, c:'#d6b67a', est:true},
  bi2te3: {name:'Tellurek bizmutu Bi₂Te₃ (n)',sh:'Bi₂Te₃', alpha:-200, W:5.10, ef:0.15, c:'#a29bfe', est:true},
  pbte:   {name:'Tellurek ołowiu PbTe (n)', sh:'PbTe',     alpha:-180, W:4.60, ef:0.19, c:'#f472b6', est:true},
  gete:   {name:'Tellurek germanu GeTe (p)',sh:'GeTe',     alpha:120,  W:5.20, ef:0.21, c:'#facc15', est:true},
};
const METAL_GROUPS=[
  {label:'Metale czyste',          keys:['pt','pd','au','ag','cu','al','ni','fe','w','cr','co','bi','sb','mo']},
  {label:'Stopy termoparowe',      keys:['chromel','alumel','konst','nicros','nisil','ptrh13','ptrh10']},
  {label:'Materiały termoelektryczne',keys:['bi2te3','pbte','gete']},
];
const TC_PRESETS={
  K:{A:'chromel',B:'alumel'}, J:{A:'fe',B:'konst'}, T:{A:'cu',B:'konst'}, E:{A:'chromel',B:'konst'},
  N:{A:'nicros',B:'nisil'},   R:{A:'ptrh13',B:'pt'}, S:{A:'ptrh10',B:'pt'},
};
const CU='cu'; // metal C — przewody doprowadzające do woltomierza

/* ── STAN ── */
const S={matA:'chromel',matB:'alumel',Tx:300,T0:20,N:30,srcKind:'none',srcPos:0.5,srcDT:200,vMode:'ec',
  inhW:'none',inhPos:0.6,inhWid:0.12,inhDA:-8,   // niejednorodność: elektroda, środek, szerokość (ułamek), Δα [µV/°C]
  dT0B:0};                                         // T(Cu|B) − T(Cu|A) [°C]
const getM=()=>({A:METALS[S.matA],B:METALS[S.matB],C:METALS[CU]});
let needDraw=true, active=true, docsOpen=false;

function setState(k,v){S[k]=v; needDraw=true;}
function syncPreset(){
  const code=Object.keys(TC_PRESETS).find(k=>TC_PRESETS[k].A===S.matA&amp;&amp;TC_PRESETS[k].B===S.matB)||'';
  g('selPreset').value=code;
}
function setMat(ab,key){S['mat'+ab]=key; syncPreset(); needDraw=true;}
function applyPreset(code){
  const p=TC_PRESETS[code]; if(!p) return;
  S.matA=p.A; S.matB=p.B; g('selA').value=p.A; g('selB').value=p.B; syncPreset(); needDraw=true;
}
function buildSelects(){
  [['selA',S.matA],['selB',S.matB]].forEach(([id,cur])=>{
    const sel=g(id); sel.innerHTML='';
    METAL_GROUPS.forEach(grp=>{
      const og=document.createElement('optgroup'); og.label=grp.label;
      grp.keys.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=METALS[k].name;if(k===cur)o.selected=true;og.appendChild(o);});
      sel.appendChild(og);
    });
  });
}
function setSrc(kind){
  S.srcKind=kind;
  document.querySelectorAll('.sk-btn').forEach(b=>b.classList.toggle('active',b.dataset.k===kind));
  g('srcCtrls').style.display=(kind==='none')?'none':'flex';
  g('circHint').textContent=kind==='none'
    ?'woltomierz · przewody Cu (metal C) · elektrody A i B · spoina pomiarowa'
    :'kliknij lub przeciągnij na schemacie, aby przesunąć źródło';
  needDraw=true;
}
function setInh(w){
  S.inhW=w;
  document.querySelectorAll('.inh-btn').forEach(b=>b.classList.toggle('active',b.dataset.w===w));
  g('inhCtrls').style.display=w==='none'?'none':'flex';
  needDraw=true;
}
function setVMode(mode){
  S.vMode=mode;
  document.querySelectorAll('#vModeBtns button').forEach(b=>b.classList.toggle('active',b.dataset.v===mode));
  needDraw=true;
}
function slPct(el){const mn=+el.min,mx=+el.max,v=+el.value; el.style.setProperty('--pct',((v-mn)/(mx-mn)*100)+'%');}
function toggleDocs(){docsOpen=!docsOpen; g('docsOverlay').classList.toggle('open',docsOpen); if(docsOpen) updateExpl();}

/* ── FIZYKA ─────────────────────────────────────────────────── */
const SIGMA=0.075, PIN=0.025;
// Garb temperatury od źródła; temperatury złączy (x=0, x=1) są ustalone (termostatowane),
// dlatego garb jest wygaszany w wąskiej warstwie przy końcach.
function bump(x){
  const gss=Math.exp(-((x-S.srcPos)**2)/(2*SIGMA*SIGMA));
  return gss*(1-Math.exp(-x/PIN))*(1-Math.exp(-(1-x)/PIN));
}
const affA=()=>S.srcKind.startsWith('A');
const affB=()=>S.srcKind.startsWith('B')||S.srcKind.startsWith('AB');
const T0of=w=>S.T0+(w==='B'?S.dT0B:0);           // temperatura zimnego końca elektrody (złącze z Cu)
// T(x) elektrody w ('A'|'B'); x=0 — złącze z Cu, x=1 — spoina
function Tp(x,w){
  const T0=T0of(w), lin=T0+(S.Tx-T0)*x;
  const aff=w==='A'?affA():affB();
  if(!aff||S.srcKind==='none') return lin;
  const sgn=S.srcKind.endsWith('-')?-1:1;
  return Math.max(-270, lin+sgn*S.srcDT*bump(x));
}
// α(x) — z odcinkiem niejednorodnym (np. zestarzały, utleniony lub zgnieciony fragment drutu)
const inInh=(w,x)=>S.inhW===w&amp;&amp;Math.abs(x-S.inhPos)<=S.inhWid/2;
function alphaAt(w,x){const m=getM(); return (w==='A'?m.A.alpha:m.B.alpha)+(inInh(w,x)?S.inhDA:0);}

// Konwencja: α = (V_zimny − V_gorący)/(T_gorący − T_zimny).
// Spadek potencjału wzdłuż segmentu (od T₀ ku Tₓ): dV = α·ΔT.
function computeSegs(){
  // Dokładniej niż jeden punkt na segment: każdy segment dzielony na 8 podkroków (ostre krawędzie niejednorodności)
  const m=getM(),N=S.N,K=8;
  const segs=[]; let cA=0,cB=0;
  for(let i=0;i<N;i++){
    const x1=i/N,x2=(i+1)/N; let dVA=0,dVB=0;
    for(let k=0;k<K;k++){
      const u1=x1+(x2-x1)*k/K, u2=x1+(x2-x1)*(k+1)/K, um=(u1+u2)/2;
      dVA+=alphaAt('A',um)*(Tp(u2,'A')-Tp(u1,'A'));
      dVB+=alphaAt('B',um)*(Tp(u2,'B')-Tp(u1,'B'));
    }
    cA+=dVA; cB+=dVB;
    segs.push({i,x1,x2,dVA,dVB});
  }
  // przewody Cu: od zacisku woltomierza (T₀) do złącza Cu|B (T₀+δ) — wkład −α_Cu·δ
  const cuTerm=-m.C.alpha*S.dT0B;
  return {segs,emfA:cA,emfB:cB,cuTerm,emf:cA-cB+cuTerm,emfNom:(m.A.alpha-m.B.alpha)*(S.Tx-S.T0)};
}
// Napięcie kontaktowe (Volty): E(X,Y) = ψ_X − ψ_Y = (W_Y − W_X)/e  [V]
// Dodatni → metal X (mniejsza praca wyjścia) oddaje elektrony i staje się dodatni.
function contacts(m){return {CA:m.A.W-m.C.W, CB:m.B.W-m.C.W, AB:m.B.W-m.A.W};}

/* ── POMOCNICZE RYSOWANIA ── */
function rszC(c){
  const w=c.clientWidth,h=c.clientHeight;
  if(w<20||h<20) return [null,0,0];
  const dpr=window.devicePixelRatio||1, nw=Math.round(w*dpr), nh=Math.round(h*dpr);
  if(c.width!==nw||c.height!==nh){c.width=nw;c.height=nh;}
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return [ctx,w,h];
}
function parseColor(s){
  if(s.startsWith('#')){const c=s.slice(1);return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
  const m=s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/); return m?[+m[1],+m[2],+m[3]]:[128,128,128];
}
function rgba(col,a){const [r,gg,b]=parseColor(col);return `rgba(${r},${gg},${b},${a})`;}
function blendColor(c1,c2,t){const [r1,g1,b1]=parseColor(c1),[r2,g2,b2]=parseColor(c2);
  return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;}
function tempColor(T){
  const lo=Math.min(S.T0,0), hi=Math.max(S.Tx,400);
  const t=clamp(0,1,(T-lo)/(hi-lo));
  return `rgb(${Math.round(40+200*t)},${Math.round(100*(1-t))},${Math.round(220-200*t)})`;
}
function niceStep(range,n){const raw=range/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
function fmtMV(mv){return Math.abs(mv)>=100?mv.toFixed(2):mv.toFixed(3);}
function fmtSigned(v,d){return (v>=0?'+':'−')+Math.abs(v).toFixed(d);}
function txt(ctx,s,x,y,col,font,align,base){ctx.fillStyle=col;ctx.font=font;ctx.textAlign=align||'left';ctx.textBaseline=base||'alphabetic';ctx.fillText(s,x,y);}
// tekst wyśrodkowany, ale przesunięty tak, by mieścił się w [m, W−m]
function txtFit(ctx,s,x,y,col,font,base,W,m=4){ctx.font=font;const w=ctx.measureText(s).width;txt(ctx,s,clamp(m+w/2,W-m-w/2,x),y,col,font,'center',base);}
function arrowLine(ctx,x1,y1,x2,y2,col,lw){
  const ang=Math.atan2(y2-y1,x2-x1), hl=Math.max(8,lw*3.2);
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2-Math.cos(ang)*hl*0.8,y2-Math.sin(ang)*hl*0.8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hl*Math.cos(ang)+hl*0.55*Math.sin(ang), y2-hl*Math.sin(ang)-hl*0.55*Math.cos(ang));
  ctx.lineTo(x2-hl*Math.cos(ang)-hl*0.55*Math.sin(ang), y2-hl*Math.sin(ang)+hl*0.55*Math.cos(ang));
  ctx.closePath(); ctx.fill();
}

/* Wspólna geometria pozioma schematu i diagramu Fermiego (te same x złączy) */
function geom(W){
  const pad=10, vmW=clamp(84,130,W*0.13), vmX=pad;
  const cuEnd=vmX+vmW+Math.max(42,W*0.09);      // złącza Cu|A i Cu|B (T₀)
  const hotX=W-Math.max(74,W*0.12);             // spoina pomiarowa A|B (Tₓ)
  return {pad,vmW,vmX,cuEnd,hotX,xOf:x=>cuEnd+x*(hotX-cuEnd),xInv:px=>(px-cuEnd)/(hotX-cuEnd)};
}

/* ── SCHEMAT OBWODU ─────────────────────────────────────────── */
const cCirc=g('cCirc');
function drawCircuit(t){
  const [ctx,W,H]=rszC(cCirc); if(!ctx) return false;
  const m=getM(), G=geom(W), dark=isDark();
  const K=contacts(m);
  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  const fs=clamp(10,13,Math.round(W*0.0135));
  const wH=clamp(14,24,Math.round(H*0.055));
  const yA=Math.round(H*0.30), yB=Math.round(H*0.74), yMid=(yA+yB)/2;
  const x0=G.cuEnd, x1=G.hotX, N=S.N;
  const muted=tv('--muted'), textC=tv('--text');

  // tło: gradient temperatury między złączami
  const tbg=ctx.createLinearGradient(x0,0,x1,0);
  tbg.addColorStop(0,'rgba(59,130,246,.07)'); tbg.addColorStop(1,'rgba(239,68,68,.11)');
  ctx.fillStyle=tbg; ctx.fillRect(x0,yA-wH/2-30,x1-x0,yB-yA+wH+60);

  // źródło zewnętrzne
  if(S.srcKind!=='none'){
    const sx=G.xOf(S.srcPos), hot=S.srcKind.endsWith('+'), pulse=.7+.3*Math.sin(t*3);
    ctx.save(); ctx.shadowColor=hot?'rgba(239,68,68,.6)':'rgba(59,130,246,.6)'; ctx.shadowBlur=16*pulse;
    ctx.strokeStyle=hot?'rgba(239,68,68,.75)':'rgba(59,130,246,.75)'; ctx.lineWidth=2; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(sx,yA-wH/2-40); ctx.lineTo(sx,yB+wH/2+40); ctx.stroke(); ctx.restore();
    ctx.font='18px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    if(affA()) ctx.fillText(hot?'🔥':'❄️',sx,yA-wH/2-20);
    if(affB()) ctx.fillText(hot?'🔥':'❄️',sx,yB+wH/2+20);
    txt(ctx,'ΔT = '+(hot?'+':'−')+S.srcDT+' °C',sx,yA-wH/2-42,hot?'#ef4444':'#3b82f6',`600 ${fs}px ${MONO}`,'center','bottom');
  }

  // elektrody A i B — segmenty zabarwione temperaturą lokalną
  for(const [mat,yW,aff] of [[m.A,yA,'A'],[m.B,yB,'B']]){
    for(let i=0;i<N;i++){
      const xa=G.xOf(i/N), xb=G.xOf((i+1)/N);
      ctx.fillStyle=blendColor(mat.c,tempColor(Tp((i+.5)/N,aff)),.35);
      ctx.fillRect(xa,yW-wH/2,xb-xa+0.6,wH);
    }
    const hl=ctx.createLinearGradient(0,yW-wH/2,0,yW);
    hl.addColorStop(0,'rgba(255,255,255,.16)'); hl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hl; ctx.fillRect(x0,yW-wH/2,x1-x0,wH/2);
    ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=.6;
    for(let i=1;i<N;i++){const x=G.xOf(i/N);ctx.beginPath();ctx.moveTo(x,yW-wH/2);ctx.lineTo(x,yW+wH/2);ctx.stroke();}
  }
  // odcinek niejednorodny — kreskowanie i opis Δα
  if(S.inhW!=='none'){
    const yW=S.inhW==='A'?yA:yB, xa=G.xOf(Math.max(0,S.inhPos-S.inhWid/2)), xb=G.xOf(Math.min(1,S.inhPos+S.inhWid/2));
    ctx.save(); ctx.beginPath(); ctx.rect(xa,yW-wH/2,xb-xa,wH); ctx.clip();
    ctx.strokeStyle=dark?'rgba(255,255,255,.55)':'rgba(0,0,0,.45)'; ctx.lineWidth=1.2;
    for(let k=-wH;k<xb-xa+wH;k+=6){ctx.beginPath();ctx.moveTo(xa+k,yW+wH/2);ctx.lineTo(xa+k+wH,yW-wH/2);ctx.stroke();}
    ctx.restore();
    ctx.strokeStyle=tv('--amber'); ctx.lineWidth=1.6; ctx.setLineDash([3,2]); ctx.strokeRect(xa,yW-wH/2-2,xb-xa,wH+4); ctx.setLineDash([]);
    const up=S.inhW==='A';
    txt(ctx,`Δα = ${S.inhDA>0?'+':''}${S.inhDA} µV/°C`,(xa+xb)/2,up?yW+wH/2+4:yW-wH/2-4,tv('--amber'),`600 ${fs-1}px ${MONO}`,'center',up?'top':'bottom');
  }
  // spoina pomiarowa: pionowe odcinki A (góra) i B (dół) stykające się w yMid — ta sama grubość
  const legL=x1-wH/2;
  ctx.fillStyle=blendColor(m.A.c,tempColor(S.Tx),.35); ctx.fillRect(legL,yA-wH/2,wH,yMid-(yA-wH/2));
  ctx.fillStyle=blendColor(m.B.c,tempColor(S.Tx),.35); ctx.fillRect(legL,yMid,wH,(yB+wH/2)-yMid);
  ctx.strokeStyle=dark?'rgba(255,255,255,.9)':'rgba(0,0,0,.75)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(legL-3,yMid); ctx.lineTo(legL+wH+3,yMid); ctx.stroke();
  ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(x1,yMid,3.2,0,Math.PI*2); ctx.fill();

  // elektrony — rozkład gęstości z lokalnej T(x); drgania cieplne ∝ √T
  drawElectrons(ctx,G,m,yA,yB,wH,t,dark);

  // przewody Cu (metal C) od woltomierza do złączy — ta sama grubość
  const cuX=G.vmX+G.vmW;
  for(const yW of [yA,yB]){
    ctx.fillStyle=m.C.c; ctx.fillRect(cuX,yW-wH/2,x0-cuX,wH);
    const hc=ctx.createLinearGradient(0,yW-wH/2,0,yW);
    hc.addColorStop(0,'rgba(255,255,255,.22)'); hc.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hc; ctx.fillRect(cuX,yW-wH/2,x0-cuX,wH/2);
  }
  // granice złączy zimnych Cu|A, Cu|B
  ctx.strokeStyle=dark?'rgba(255,255,255,.85)':'rgba(0,0,0,.7)'; ctx.lineWidth=2;
  for(const yW of [yA,yB]){ctx.beginPath();ctx.moveTo(x0,yW-wH/2-3);ctx.lineTo(x0,yW+wH/2+3);ctx.stroke();}

  // strzałki napięć kontaktowych — grot w stronę metalu o wyższym potencjale (polska konwencja)
  const scale=110, minLen=16, maxLen=Math.min(72,(yB-yA)*0.4);
  const alen=u=>clamp(minLen,maxLen,Math.abs(u)*scale);
  const lab=(name,u)=>`${name} = ${fmtSigned(u,2)} V`;
  // E(Cu,A): poziomo pod przewodem A; dodatni → Cu (+) → grot w lewo
  { const y=yA+wH/2+13, L=alen(K.CA), dir=K.CA>=0?-1:1, col=tv('--kCA');
    if(Math.abs(K.CA)>0.004) arrowLine(ctx,x0-dir*L/2,y,x0+dir*L/2,y,col,3);
    txt(ctx,lab('E(Cu,A)',K.CA),x0+Math.max(L/2,10)+8,y,col,`600 ${fs}px ${MONO}`,'left','middle'); }
  // E(Cu,B): poziomo nad przewodem B
  { const y=yB-wH/2-13, L=alen(K.CB), dir=K.CB>=0?-1:1, col=tv('--kCB');
    if(Math.abs(K.CB)>0.004) arrowLine(ctx,x0-dir*L/2,y,x0+dir*L/2,y,col,3);
    txt(ctx,lab('E(Cu,B)',K.CB),x0+Math.max(L/2,10)+8,y,col,`600 ${fs}px ${MONO}`,'left','middle'); }
  // E(A,B): pionowo przy spoinie, wewnątrz pętli; dodatni → A (+, góra) → grot w górę
  { const x=legL-16, L=alen(K.AB), dir=K.AB>=0?-1:1, col=tv('--kAB');
    if(Math.abs(K.AB)>0.004) arrowLine(ctx,x,yMid-dir*L/2,x,yMid+dir*L/2,col,3.5);
    else txt(ctx,'≈0',x,yMid,col,`600 ${fs}px ${MONO}`,'center','middle');
    txt(ctx,lab('E(A,B)',K.AB),x-10,yMid,col,`600 ${fs}px ${MONO}`,'right','middle'); }

  // woltomierz cyfrowy
  drawMeter(ctx,G,yA,yB,wH,fs);

  // etykiety
  if(S.dT0B===0) txt(ctx,'T₀ = '+S.T0+' °C',x0,yA-wH/2-20,'#3b82f6',`600 ${fs+1}px ${MONO}`,'center','bottom');
  else {
    txt(ctx,'Cu|A: '+S.T0+' °C',x0,yA-wH/2-20,'#3b82f6',`600 ${fs+1}px ${MONO}`,'center','bottom');
    txt(ctx,'Cu|B: '+T0of('B')+' °C',x0+6,yB+wH/2+5+fs+4,'#f97316',`600 ${fs+1}px ${MONO}`,'left','top');
  }
  txtFit(ctx,'Tₓ = '+S.Tx+' °C',x1,yA-wH/2-20,'#ef4444',`600 ${fs+1}px ${MONO}`,'bottom',W);
  if(W-(x1+wH/2)>48) txt(ctx,'spoina',x1+wH/2+6,yMid,muted,`${fs-1}px ${FONT}`,'left','middle');
  const xc=(x0+legL)/2, sgn=a=>(a>=0?'+':'−')+Math.abs(a);
  txt(ctx,`A: ${m.A.name} · α = ${sgn(m.A.alpha)} µV/°C`,xc,yA-wH/2-5,m.A.c,`600 ${fs}px ${FONT}`,'center','bottom');
  txt(ctx,`B: ${m.B.name} · α = ${sgn(m.B.alpha)} µV/°C`,xc,yB+wH/2+5,m.B.c,`600 ${fs}px ${FONT}`,'center','top');
  txt(ctx,'C: Cu',(cuX+x0)/2,yA-wH/2-5,m.C.c,`600 ${fs}px ${FONT}`,'center','bottom');
  txt(ctx,'C: Cu',(cuX+x0)/2,yB+wH/2+5,m.C.c,`600 ${fs}px ${FONT}`,'center','top');
  // biegunowość termoelektryczna końców elektrod (α>0 → zimny koniec dodatni)
  const ps=(x,y,a,col)=>txt(ctx,a>=0?'+':'−',x,y,col,`700 ${fs+3}px ${MONO}`,'center','middle');
  ps(x0+14,yA,m.A.alpha,dark?'#fff':'#000'); ps(legL-14,yA,-m.A.alpha,dark?'#fff':'#000');
  ps(x0+14,yB,m.B.alpha,dark?'#fff':'#000'); ps(legL-14,yB,-m.B.alpha,dark?'#fff':'#000');
  txt(ctx,'● e⁻: nadmiar przy ujemnym końcu przewodu (α<0 → przy T₀, α>0 → przy Tₓ); drgania ∝ √T',
      x0,H-8,muted,`${fs-1}px ${FONT}`,'left','bottom');
  return true;
}

function eDensityFns(m){
  // wspólna normalizacja temperatury dla obu przewodów (z uwzględnieniem źródła)
  let lo=Math.min(S.T0,S.Tx), hi=Math.max(S.T0,S.Tx);
  for(let i=0;i<=60;i++){const x=i/60;for(const a of ['A','B']){const T=Tp(x,a);lo=Math.min(lo,T);hi=Math.max(hi,T);}}
  return (x,_a,w)=>{
    const alpha=alphaAt(w,x);
    const Tn=(Tp(x,w)-lo)/Math.max(1,hi-lo);              // 0 = najzimniej, 1 = najgoręcej
    const k=Math.min(1,Math.abs(alpha)/25);                    // mały |α| → słaba nierównowaga
    const sgn=alpha>=0?1:-1;                                   // α>0 → nadmiar e⁻ przy gorącym
    return Math.max(0.08,1+sgn*k*(Tn-0.5)*1.7);
  };
}
function drawElectrons(ctx,G,m,yA,yB,wH,t,dark){
  const dens=eDensityFns(m), STEPS=80, NDOT=90;
  for(const [key,mat,yW,aff] of [['A',m.A,yA,'A'],['B',m.B,yB,'B']]){
    const d=[]; let sum=0;
    for(let i=0;i<=STEPS;i++){const v=dens(i/STEPS,mat.alpha,aff); d.push(v); sum+=v;}
    const cdf=[0]; for(let i=0;i<d.length;i++) cdf.push(cdf[i]+d[i]/sum);
    const inv=u=>{let lo=0,hi=STEPS;while(lo<hi){const mid=(lo+hi)>>1;if(cdf[mid+1]<u)lo=mid+1;else hi=mid;}
      return clamp(0,1,(lo+(u-cdf[lo])/((cdf[lo+1]-cdf[lo])||1))/STEPS);};
    const core=dark?'rgba(235,240,255,.95)':'rgba(255,255,255,.98)';
    for(let k=0;k<NDOT;k++){
      const s=inv((k+0.5)/NDOT);
      const seed=(k*73+key.charCodeAt(0)*11)%997;
      const TK=Math.max(1,Tp(s,aff)+273.15), amp=2.6*Math.sqrt(TK/600);
      const ph=seed*0.37, om=3+((seed*13)%7);
      const px=clamp(G.cuEnd+3,G.hotX-wH/2-3,G.xOf(s)+amp*Math.sin(t*om+ph));
      const py=yW-wH/2+3+((seed%100)/100)*(wH-6)+0.6*amp*Math.cos(t*om*1.3+ph);
      const dv=dens(s,mat.alpha,aff), r=1.2+Math.min(1.4,dv*0.9);
      ctx.globalAlpha=0.35; ctx.fillStyle=mat.c; ctx.beginPath(); ctx.arc(px,py,r*1.9,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=0.9; ctx.fillStyle=core; ctx.beginPath(); ctx.arc(px,py,r*0.6,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}
function drawMeter(ctx,G,yA,yB,wH,fs){
  const x=G.vmX, w=G.vmW, y=yA-wH/2-16, h=(yB+wH/2+16)-y, dark=isDark();
  ctx.fillStyle='#1b1d24'; ctx.strokeStyle='#4a5060'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,7); ctx.fill(); ctx.stroke();
  txt(ctx,'V  DC',x+8,y+7,'#9aa3b2',`600 ${clamp(9,12,w*0.1)}px ${MONO}`,'left','top');
  // wyświetlacz
  const lx=x+7, lw=w-14, lh=Math.min(h*0.42,64), ly=y+h/2-lh/2;
  ctx.fillStyle=dark?'#0c1a10':'#b9c9a6'; ctx.beginPath(); ctx.roundRect(lx,ly,lw,lh,4); ctx.fill();
  ctx.strokeStyle=dark?'#1f3a25':'#8fa57a'; ctx.lineWidth=1; ctx.stroke();
  const {emf}=computeSegs(), mv=emf/1000, s=fmtMV(mv);
  const fsz=Math.min(lh*0.5,lw/(Math.max(5,s.length)*0.64));
  txt(ctx,s,lx+lw-6,ly+lh*0.56,dark?'#4ade80':'#14240f',`600 ${fsz}px ${MONO}`,'right','middle');
  txt(ctx,'mV',lx+lw-6,ly+lh-3,dark?'#2f8f4e':'#2c4220',`600 ${clamp(9,12,fsz*0.45)}px ${MONO}`,'right','bottom');
  // zaciski
  ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(x+w-2,yA,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3b82f6'; ctx.beginPath(); ctx.arc(x+w-2,yB,5,0,Math.PI*2); ctx.fill();
  txt(ctx,'+',x+w-14,yA,'#ef4444',`700 ${fs+2}px ${MONO}`,'center','middle');
  txt(ctx,'−',x+w-14,yB,'#60a5fa',`700 ${fs+2}px ${MONO}`,'center','middle');
}

/* ── POZIOMY FERMIEGO ───────────────────────────────────────── */
const cFermi=g('cFermi');
function drawFermi(){
  const [ctx,W,H]=rszC(cFermi); if(!ctx) return false;
  const m=getM(), G=geom(W), dark=isDark(), K=contacts(m);
  const kB=8.617333e-5, T0K=S.T0+273.15, TxK=S.Tx+273.15;
  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  const muted=tv('--muted'), textC=tv('--text'), fs=clamp(10,12,Math.round(W*0.0125));
  const pT=30, pB=40, ch=H-pT-pB;
  const Ws=[m.A.W,m.B.W,m.C.W];
  const Emax=-Math.min(...Ws)+0.45, Emin=-Math.max(...Ws)-0.55;
  const yE=E=>pT+(Emax-E)/(Emax-Emin)*ch;
  const cw=clamp(44,88,W*0.085), gp=clamp(30,52,W*0.058);
  const coldW=3*cw+2*gp, hotW=2*cw+gp;
  const coldL=clamp(40,W-8-coldW,G.cuEnd-coldW/2);
  const hotL=clamp(coldL+coldW+14,W-8-hotW,G.hotX-hotW/2);

  // oś energii
  ctx.strokeStyle=tv('--border2'); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(34,pT); ctx.lineTo(34,pT+ch); ctx.stroke();
  const st=niceStep(Emax-Emin,4);
  for(let E=Math.ceil(Emin/st)*st;E<=Emax;E+=st){
    const y=yE(E); ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(34,y); ctx.stroke();
    txt(ctx,E.toFixed(1),28,y,muted,`${fs-1}px ${MONO}`,'right','middle');
  }
  ctx.save(); ctx.translate(9,pT+ch/2); ctx.rotate(-Math.PI/2);
  txt(ctx,'E − E_próżni [eV]',0,0,muted,`${fs-1}px ${FONT}`,'center','middle'); ctx.restore();

  const fd=(E,EF,TK)=>{const x=(E-EF)/(kB*TK);return x>40?0:x<-40?1:1/(1+Math.exp(x));};
  function column(x,mat,TK){
    const EF=-mat.W;
    ctx.fillStyle=rgba(mat.c,0.05); ctx.fillRect(x,pT,cw,ch);
    for(let y=pT;y<pT+ch;y++){
      const E=Emax-(y-pT)/ch*(Emax-Emin), f=fd(E,EF,TK);
      if(f>0.004){ctx.fillStyle=rgba(mat.c,0.1+0.62*f); ctx.fillRect(x,y,cw,1.15);}
    }
    // profil obsadzenia f(E) (Fermi–Dirac)
    ctx.strokeStyle=dark?'rgba(255,255,255,.85)':'rgba(0,0,0,.7)'; ctx.lineWidth=1.4; ctx.beginPath();
    for(let y=pT;y<=pT+ch;y++){const E=Emax-(y-pT)/ch*(Emax-Emin), xx=x+cw*fd(E,EF,TK); y===pT?ctx.moveTo(xx,y):ctx.lineTo(xx,y);}
    ctx.stroke();
    ctx.strokeStyle=mat.c; ctx.lineWidth=1; ctx.strokeRect(x+.5,pT+.5,cw-1,ch-1);
    // poziom Fermiego
    ctx.save(); ctx.setLineDash([5,3]); ctx.strokeStyle=dark?'#fbbf24':'#b45309'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(x-3,yE(EF)); ctx.lineTo(x+cw+3,yE(EF)); ctx.stroke(); ctx.restore();
    txt(ctx,mat.sh,x+cw/2,pT+ch+4,mat.c,`600 ${fs}px ${FONT}`,'center','top');
    txt(ctx,`W=${mat.W.toFixed(2)}${mat.est?'≈':''}`,x+cw/2,pT+ch+5+fs+1,muted,`${fs-1}px ${MONO}`,'center','top');
  }
  // strzałka między poziomami Fermiego sąsiednich metali: od niższego do wyższego E_F,
  // czyli w stronę metalu, który po zetknięciu staje się dodatni; długość = |E(X,Y)|·e
  function levelArrow(xL,matL,xR,matR,U,col,name){
    const yl=yE(-matL.W), yr=yE(-matR.W), xa=xL+cw+gp/2;
    ctx.save(); ctx.setLineDash([2,3]); ctx.strokeStyle=col; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(xL+cw+3,yl); ctx.lineTo(xa,yl); ctx.moveTo(xa,yr); ctx.lineTo(xR-3,yr); ctx.stroke(); ctx.restore();
    const yLow=Math.max(yl,yr), yHigh=Math.min(yl,yr);
    if(yLow-yHigh>6) arrowLine(ctx,xa,yLow,xa,yHigh,col,2.8);
    else {ctx.fillStyle=col; ctx.fillRect(xa-5,(yl+yr)/2-1,10,2);}
    const ty=Math.max(pT+2,yHigh-6);
    txt(ctx,name,xa,ty-fs-1,col,`600 ${fs-1}px ${MONO}`,'center','bottom');
    txt(ctx,fmtSigned(U,2)+' V',xa,ty,col,`600 ${fs-1}px ${MONO}`,'center','bottom');
  }

  // złącza zimne: A | Cu | B (miedź w środku)
  const xa=coldL, xc=coldL+cw+gp, xb=coldL+2*(cw+gp);
  ctx.fillStyle=rgba('#3b82f6',dark?0.06:0.08); ctx.fillRect(coldL-6,pT-4,coldW+12,ch+8);
  column(xa,m.A,T0K); column(xc,m.C,T0K); column(xb,m.B,T0of('B')+273.15);
  levelArrow(xa,m.A,xc,m.C,K.CA,tv('--kCA'),'E(Cu,A)');
  levelArrow(xc,m.C,xb,m.B,K.CB,tv('--kCB'),'E(Cu,B)');
  txtFit(ctx,W<640?`❄ Cu|A, Cu|B · T₀=${S.T0} °C`:`❄ złącza Cu|A, Cu|B · T₀ = ${S.T0} °C · kT = ${(kB*T0K*1000).toFixed(0)} meV`,
      coldL+coldW/2,pT-8,dark?'#60a5fa':'#1d4ed8',`600 ${fs}px ${FONT}`,'bottom',W);

  // złącze pomiarowe: A | B
  const xha=hotL, xhb=hotL+cw+gp;
  ctx.fillStyle=rgba('#ef4444',dark?0.07:0.08); ctx.fillRect(hotL-6,pT-4,hotW+12,ch+8);
  column(xha,m.A,TxK); column(xhb,m.B,TxK);
  levelArrow(xha,m.A,xhb,m.B,K.AB,tv('--kAB'),'E(A,B)');
  txtFit(ctx,W<640?`🔥 A|B · Tₓ=${S.Tx} °C`:`🔥 spoina A|B · Tₓ = ${S.Tx} °C · kT = ${(kB*TxK*1000).toFixed(0)} meV`,
      hotL+hotW/2,pT-8,dark?'#f87171':'#dc2626',`600 ${fs}px ${FONT}`,'bottom',W);
  return true;
}

/* ── ROZKŁAD TEMPERATURY ────────────────────────────────────── */
const cTemp=g('cTemp');
function drawTemp(){
  const [ctx,W,H]=rszC(cTemp); if(!ctx) return false;
  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  const m=getM(), aA='A', aB='B', muted=tv('--muted'), fs=clamp(10,12,Math.round(W*0.016));
  const pL=50,pR=W-12,pT=24,pB=22, cw=pR-pL, ch=H-pT-pB;
  ctx.fillStyle=tv('--surf'); ctx.fillRect(pL,pT,cw,ch);
  let Tmin=Math.min(S.T0,S.Tx), Tmax=Math.max(S.T0,S.Tx);
  for(let i=0;i<=100;i++){const x=i/100;for(const a of [aA,aB]){const T=Tp(x,a);Tmin=Math.min(Tmin,T);Tmax=Math.max(Tmax,T);}}
  const pad=(Tmax-Tmin)*0.08||10; Tmin-=pad; Tmax+=pad;
  const xp=x=>pL+x*cw, tp=T=>pT+ch-(T-Tmin)/(Tmax-Tmin)*ch;
  const st=niceStep(Tmax-Tmin,4);
  ctx.lineWidth=.6;
  for(let T=Math.ceil(Tmin/st)*st;T<=Tmax;T+=st){
    ctx.strokeStyle=tv('--border'); ctx.beginPath(); ctx.moveTo(pL,tp(T)); ctx.lineTo(pR,tp(T)); ctx.stroke();
    txt(ctx,Math.round(T)+'°',pL-4,tp(T),muted,`${fs-1}px ${MONO}`,'right','middle');
  }
  if(S.srcKind!=='none'){ctx.strokeStyle='rgba(239,68,68,.45)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(xp(S.srcPos),pT);ctx.lineTo(xp(S.srcPos),pT+ch);ctx.stroke();ctx.setLineDash([]);}
  ctx.save(); ctx.beginPath(); ctx.rect(pL,pT,cw,ch); ctx.clip();
  // B najpierw, A na wierzchu (przy braku źródła krzywe się pokrywają)
  for(const [mat,aff,lw] of [[m.B,aB,3.2],[m.A,aA,1.8]]){
    ctx.beginPath(); ctx.moveTo(xp(0),pT+ch);
    for(let i=0;i<=120;i++) ctx.lineTo(xp(i/120),tp(Tp(i/120,aff)));
    ctx.lineTo(xp(1),pT+ch); ctx.closePath(); ctx.fillStyle=rgba(mat.c,0.07); ctx.fill();
    ctx.strokeStyle=mat.c; ctx.lineWidth=lw; ctx.beginPath();
    for(let i=0;i<=120;i++){const x=i/120;i?ctx.lineTo(xp(x),tp(Tp(x,aff))):ctx.moveTo(xp(x),tp(Tp(x,aff)));}
    ctx.stroke();
    for(let i=0;i<S.N;i++){const x=(i+.5)/S.N;ctx.fillStyle=mat.c;ctx.beginPath();ctx.arc(xp(x),tp(Tp(x,aff)),2.2,0,Math.PI*2);ctx.fill();}
  }
  ctx.restore();
  ctx.strokeStyle=tv('--border2'); ctx.lineWidth=1; ctx.strokeRect(pL,pT,cw,ch);
  txt(ctx,'T₀ (złącza Cu)',pL,pT+ch+4,'#3b82f6',`600 ${fs}px ${FONT}`,'left','top');
  txt(ctx,'Tₓ (spoina)',pR,pT+ch+4,'#ef4444',`600 ${fs}px ${FONT}`,'right','top');
  ctx.font=`600 ${fs}px ${FONT}`;
  const la='● A: '+m.A.sh, lb='● B: '+m.B.sh;
  txt(ctx,la,pL+2,pT-6,m.A.c,`600 ${fs}px ${FONT}`,'left','bottom');
  txt(ctx,lb,pL+2+ctx.measureText(la).width+14,pT-6,m.B.c,`600 ${fs}px ${FONT}`,'left','bottom');
  ctx.save(); ctx.translate(11,pT+ch/2); ctx.rotate(-Math.PI/2);
  txt(ctx,'T [°C]',0,0,muted,`${fs}px ${FONT}`,'center','middle'); ctx.restore();
  return true;
}

/* ── SEGMENTY dV ────────────────────────────────────────────── */
const cSegs=g('cSegs');
function drawSegs(){
  const [ctx,W,H]=rszC(cSegs); if(!ctx) return false;
  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  const {segs,emfA,emfB,emf,cuTerm}=computeSegs(), m=getM(), N=S.N, muted=tv('--muted');
  const fs=clamp(10,12,Math.round(W*0.016));
  const pL=50,pR=W-12,pT=6,pB=18, cw=pR-pL, ch=H-pT-pB, gap=6, hh=(ch-gap)/2, strip=fs+5;
  let maxDV=1; segs.forEach(s=>{maxDV=Math.max(maxDV,Math.abs(s.dVA),Math.abs(s.dVB));});
  const barW=Math.max(1,(cw/N)*0.66);
  for(const [k,mat,top,sum] of [['A',m.A,pT,emfA],['B',m.B,pT+hh+gap,emfB]]){
    ctx.fillStyle=tv('--surf'); ctx.fillRect(pL,top,cw,hh);
    const z=top+strip+(hh-strip)/2, sc=(hh-strip)/2*0.9;
    ctx.strokeStyle=tv('--border2'); ctx.lineWidth=.8; ctx.beginPath(); ctx.moveTo(pL,z); ctx.lineTo(pR,z); ctx.stroke();
    if(S.inhW===k){const xa=pL+Math.max(0,S.inhPos-S.inhWid/2)*cw, xb=pL+Math.min(1,S.inhPos+S.inhWid/2)*cw;
      ctx.fillStyle=rgba('#f59e0b',0.16); ctx.fillRect(xa,top+strip,xb-xa,hh-strip);}
    ctx.save(); ctx.beginPath(); ctx.rect(pL,top+strip,cw,hh-strip); ctx.clip();
    segs.forEach(s=>{
      const dv=k==='A'?s.dVA:s.dVB, h=dv/maxDV*sc;
      if(Math.abs(h)<0.4) return;
      ctx.fillStyle=dv>=0?mat.c:'rgba(239,68,68,.85)';
      const x=pL+(s.i+.5)*cw/N-barW/2;
      ctx.fillRect(x,h>=0?z-h:z,barW,Math.abs(h));
    });
    ctx.restore();
    txt(ctx,`${k} (${mat.sh}): Σ dV = ${fmtSigned(sum/1000,3)} mV`,pL+4,top+2,mat.c,`600 ${fs-1}px ${MONO}`,'left','top');
    ctx.strokeStyle=tv('--border2'); ctx.lineWidth=.8; ctx.strokeRect(pL,top,cw,hh);
    ctx.save(); ctx.translate(11,top+hh/2); ctx.rotate(-Math.PI/2);
    txt(ctx,`dV${k} [µV]`,0,0,mat.c,`${fs-1}px ${FONT}`,'center','middle'); ctx.restore();
  }
  txt(ctx,`SEM = ΣdV_A − ΣdV_B${cuTerm?' + Cu':''} = ${fmtMV(emf/1000)} mV`,pR-4,pT+2,tv('--green'),`600 ${fs-1}px ${MONO}`,'right','top');
  if(S.srcKind!=='none'){const sx=pL+S.srcPos*cw;ctx.strokeStyle='rgba(239,68,68,.5)';ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(sx,pT);ctx.lineTo(sx,pT+ch);ctx.stroke();ctx.setLineDash([]);}
  txt(ctx,'słupek = α·ΔT segmentu · czerwone = ujemne (T maleje w kierunku Tₓ lub α<0)',pL+cw/2,H-3,muted,`${fs-2}px ${FONT}`,'center','bottom');
  return true;
}

/* ── POTENCJAŁ WZDŁUŻ OBWODU ────────────────────────────────── */
const cVolt=g('cVolt');
function drawVolt(){
  const [ctx,W,H]=rszC(cVolt); if(!ctx) return false;
  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  const {segs,emf,cuTerm}=computeSegs(), m=getM(), K=contacts(m), muted=tv('--muted');
  const fs=clamp(10,12,Math.round(W*0.016)), es=S.vMode==='es';
  const pL=58,pR=W-14,pT=22,pB=22, cw=pR-pL, ch=H-pT-pB;
  ctx.fillStyle=tv('--surf'); ctx.fillRect(pL,pT,cw,ch);
  const XL=-0.1, xp=x=>pL+(x-XL)/(1-XL)*cw;
  // potencjał elektrochemiczny [mV]: Cu(−) = 0, Cu(+) = SEM; ciągły na złączach
  const vA=[[0,emf/1000]], vB=[[0,cuTerm/1000]]; let rA=emf/1000, rB=cuTerm/1000;
  segs.forEach(s=>{rA-=s.dVA/1000; rB-=s.dVB/1000; vA.push([s.x2,rA]); vB.push([s.x2,rB]);});
  // potencjał elektrostatyczny: ψ_X = V_ec − (W_X − W_Cu)/e
  const offA=es?-1000*K.CA:0, offB=es?-1000*K.CB:0;
  const potA=vA.map(([x,v])=>[x,v+offA]), potB=vB.map(([x,v])=>[x,v+offB]);
  const cuP=emf/1000, cuM=0;
  const all=[...potA,...potB].map(p=>p[1]).concat([cuP,cuM,cuTerm/1000]);
  let lo=Math.min(...all), hi=Math.max(...all); const pad=(hi-lo)*0.12||1; lo-=pad; hi+=pad;
  const vp=v=>pT+ch-(v-lo)/(hi-lo)*ch;
  const st=niceStep(hi-lo,4); ctx.lineWidth=.6;
  for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st){
    ctx.strokeStyle=tv('--border'); ctx.beginPath(); ctx.moveTo(pL,vp(v)); ctx.lineTo(pR,vp(v)); ctx.stroke();
    txt(ctx,(Math.abs(v)<1e-9?0:v).toFixed(st<1?1:0),pL-4,vp(v),muted,`${fs-1}px ${MONO}`,'right','middle');
  }
  // granice: przewody Cu | elektrody | spoina
  ctx.strokeStyle=tv('--border2'); ctx.setLineDash([2,3]);
  [0,1].forEach(x=>{ctx.beginPath();ctx.moveTo(xp(x),pT);ctx.lineTo(xp(x),pT+ch);ctx.stroke();}); ctx.setLineDash([]);
  ctx.save(); ctx.beginPath(); ctx.rect(pL,pT,cw,ch); ctx.clip();
  // odcinki Cu (izotermiczne przy T₀)
  ctx.strokeStyle=m.C.c; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(xp(XL),vp(cuP)); ctx.lineTo(xp(0),vp(cuP)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xp(XL),vp(cuM)); ctx.lineTo(xp(0),vp(cuTerm/1000)); ctx.stroke();   // Cu(−): gradient, gdy T(Cu|B)≠T₀
  // skoki kontaktowe (tylko w trybie elektrostatycznym)
  if(es){
    ctx.setLineDash([4,3]); ctx.lineWidth=2;
    ctx.strokeStyle=tv('--kCA'); ctx.beginPath(); ctx.moveTo(xp(0),vp(cuP)); ctx.lineTo(xp(0),vp(potA[0][1])); ctx.stroke();
    ctx.strokeStyle=tv('--kCB'); ctx.beginPath(); ctx.moveTo(xp(0)+3,vp(cuTerm/1000)); ctx.lineTo(xp(0)+3,vp(potB[0][1])); ctx.stroke();
    ctx.strokeStyle=tv('--kAB'); ctx.beginPath(); ctx.moveTo(xp(1),vp(potA[potA.length-1][1])); ctx.lineTo(xp(1),vp(potB[potB.length-1][1])); ctx.stroke();
    ctx.setLineDash([]);
  }
  for(const [pts,col] of [[potB,m.B.c],[potA,m.A.c]]){
    ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.beginPath();
    pts.forEach(([x,v],i)=>i?ctx.lineTo(xp(x),vp(v)):ctx.moveTo(xp(x),vp(v))); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle=tv('--border2'); ctx.lineWidth=1; ctx.strokeRect(pL,pT,cw,ch);
  // SEM między zaciskami Cu
  const xs=xp(XL)+8;
  if(Math.abs(vp(cuP)-vp(cuM))>10) arrowLine(ctx,xs,vp(cuM),xs,vp(cuP),tv('--green'),1.8);
  txt(ctx,`SEM ${fmtMV(emf/1000)} mV`,xs+6,(vp(cuP)+vp(cuM))/2,tv('--green'),`600 ${fs-1}px ${MONO}`,'left','middle');
  txt(ctx,'Cu(+)',xp(XL)+2,vp(cuP)-3,m.C.c,`600 ${fs-1}px ${FONT}`,'left','bottom');
  txt(ctx,'Cu(−)',xp(XL)+2,vp(cuM)+3,m.C.c,`600 ${fs-1}px ${FONT}`,'left','top');
  txt(ctx,'A: '+m.A.sh,xp(0.5),vp(potA[Math.floor(potA.length/2)][1])-5,m.A.c,`600 ${fs}px ${FONT}`,'center','bottom');
  txt(ctx,'B: '+m.B.sh,xp(0.5),vp(potB[Math.floor(potB.length/2)][1])+5,m.B.c,`600 ${fs}px ${FONT}`,'center','top');
  txt(ctx,'T₀',xp(0),pT+ch+4,'#3b82f6',`600 ${fs}px ${FONT}`,'center','top');
  txt(ctx,'Tₓ',xp(1),pT+ch+4,'#ef4444',`600 ${fs}px ${FONT}`,'center','top');
  txt(ctx,es?'ψ: skoki na złączach = napięcia kontaktowe; ich suma w pętli = 0'
            :'μ̄/(−e): ciągły na złączach — to mierzy woltomierz',pR,pT-5,muted,`${fs-1}px ${FONT}`,'right','bottom');
  ctx.save(); ctx.translate(11,pT+ch/2); ctx.rotate(-Math.PI/2);
  txt(ctx,'V [mV]',0,0,muted,`${fs}px ${FONT}`,'center','middle'); ctx.restore();
  return true;
}

/* ── PASEK WYNIKÓW ── */
function updateRbar(){
  const m=getM(), {emf,emfNom}=computeSegs(), K=contacts(m);
  const loop=-K.CA-K.AB+K.CB;
  const srcTxt=S.srcKind==='none'?'brak':(S.srcKind.endsWith('+')?'🔥 ':'❄️ ')+(S.srcKind.startsWith('AB')?'A i B':S.srcKind[0])+` · x=${Math.round(S.srcPos*100)} % · ΔT=${S.srcDT} °C`;
  const eq=Math.abs(emf-emfNom)<0.5;
  const dmv=(emf-emfNom)/1000, dC=(emf-emfNom)/((m.A.alpha-m.B.alpha)||1);
  const why=[S.inhW!=='none'?'niejednorodność w gradiencie T':'',S.dT0B!==0?'różne T zacisków Cu':''].filter(Boolean).join(' + ');
  g('rbar').innerHTML=`
    <div class=&quot;rc&quot;>Para: <span class=&quot;rv&quot;>${m.A.sh} / ${m.B.sh}</span></div>
    <div class=&quot;rc&quot;>Źródło: <span class=&quot;rv&quot;>${srcTxt}</span></div>
    <div class=&quot;rc&quot;>(α<sub>A</sub>−α<sub>B</sub>)(T<sub>x</sub>−T<sub>0</sub>) = <span class=&quot;rv&quot;>${fmtMV(emfNom/1000)} mV</span></div>
    <div class=&quot;rc&quot;>SEM obwodu = <span class=&quot;rv&quot;>${fmtMV(emf/1000)} mV</span></div>
    <div class=&quot;rc&quot;>Σ napięć kontaktowych w pętli = <span class=&quot;rv&quot;>${Math.abs(loop)<5e-4?'0,000':loop.toFixed(3)} V</span></div>
    ${eq?`<div class=&quot;aha&quot;>✓ SEM zależy tylko od T₀ i Tₓ — prawo temperatur pośrednich</div>`
        :`<div class=&quot;rc&quot; style=&quot;border-color:var(--red)&quot;>⚠ Δ = ${fmtSigned(dmv,3)} mV ≈ ${fmtSigned(dC,1)} °C — ${why||'zaburzenie'}</div>`}
    <span class=&quot;aff&quot;>AGH KMiE 2026 Socha</span>`;
}

/* ── TEORIA ── */
function updateExpl(){
  const m=getM(), K=contacts(m), dT=S.Tx-S.T0;
  const row=k=>{const x=METALS[k];return `<tr><td>${x.name}</td><td>${(x.alpha>=0?'+':'−')+Math.abs(x.alpha)}</td><td>${x.W.toFixed(2)}${x.est?' ≈':''}</td></tr>`;};
  g('explDiv').innerHTML=`
  <h3>1. Skąd bierze się SEM termoelektryczna</h3>
  <p>W przewodniku z gradientem temperatury nośniki z gorącego końca mają większą energię i dyfundują ku zimnemu. Ustala się równowaga, w której pole elektryczne równoważy tę dyfuzję. Współczynnik Seebecka definiujemy jako:</p>
  <div class=&quot;formula&quot;>α = (V_zimny − V_gorący) / (T_gorący − T_zimny)</div>
  <ul>
    <li><b>α &amp;lt; 0</b> (Alumel, Konstantan, Ni, metale „elektronowe”, półprzewodnik typu n): zimny koniec jest <b>ujemny</b> — tam gromadzi się nadmiar elektronów.</li>
    <li><b>α &amp;gt; 0</b> (Chromel, Fe, Cu, półprzewodnik typu p): zimny koniec jest <b>dodatni</b> — nadmiar elektronów jest przy końcu gorącym.</li>
  </ul>
  <p>Dlatego w termoparze K chromel (α&amp;gt;0) jest przewodem <span class=&quot;hi&quot;>dodatnim</span>, a alumel <span class=&quot;hi&quot;>ujemnym</span>. Animacja pokazuje ten rozkład: kropki zagęszczają się przy ujemnym końcu przewodu, a ich drgania rosną z √T. Rzeczywista nierównowaga ładunku jest znikoma (ładunek powierzchniowy) — rysunek ją przesadnie uwidacznia.</p>

  <h3>2. Prawo temperatur pośrednich i teleskopowanie</h3>
  <p>Każdy odcinek przewodu daje wkład dV = α·ΔT. Suma po odcinkach się teleskopuje:</p>
  <div class=&quot;formula&quot;>SEM = Σα_A·ΔT_i − Σα_B·ΔT_i = (α_A − α_B)·(Tₓ − T₀)
  = (${m.A.alpha} − (${m.B.alpha}))·${dT} µV = ${fmtMV((m.A.alpha-m.B.alpha)*dT/1000)} mV</div>
  <p>Źródło ciepła lub zimna między złączami zmienia kształt T(x) i daje pary słupków +/− na wykresie segmentów, ale <span class=&quot;hi&quot;>nie zmienia SEM</span> — dopóki temperatury złączy T₀ i Tₓ są ustalone (w symulatorze są termostatowane). To powód, dla którego przewody termopary mogą przechodzić przez strefy o dowolnej temperaturze.</p>

  <h3>3. Napięcie kontaktowe (Volty)</h3>
  <p>Gdy zetkniemy dwa metale, elektrony przechodzą z metalu o mniejszej pracy wyjścia W do metalu o większej, aż <b>poziomy Fermiego się wyrównają</b>. Na styku powstaje skok potencjału elektrostatycznego:</p>
  <div class=&quot;formula&quot;>E(X,Y) = ψ_X − ψ_Y = (W_Y − W_X)/e</div>
  <p>Dla bieżącej pary: E(Cu,A) = ${fmtSigned(K.CA,3)} V, E(Cu,B) = ${fmtSigned(K.CB,3)} V, E(A,B) = ${fmtSigned(K.AB,3)} V. Strzałki na schemacie mają grot skierowany do metalu o wyższym potencjale (tracącego elektrony). Napięcia te są rzędu dziesiątych części wolta — sto razy większe niż SEM termopary.</p>

  <h3>4. Dlaczego woltomierz ich nie widzi</h3>
  <p>Woltomierz mierzy różnicę <b>potencjału elektrochemicznego</b> (poziomu Fermiego) między swoimi zaciskami, a ten jest ciągły na każdym złączu w równowadze. Skoki potencjału elektrostatycznego w zamkniętej pętli sumują się do zera:</p>
  <div class=&quot;formula&quot;>−E(Cu,A) − E(A,B) + E(Cu,B) = (W_Cu−W_A) + (W_A−W_B) + (W_B−W_Cu) = 0</div>
  <p>To <span class=&quot;hi&quot;>prawo metalu pośredniego</span>: przewody miedziane (metal C) nie zmieniają odczytu, jeśli oba złącza Cu|A i Cu|B mają tę samą temperaturę T₀. Na wykresie potencjału przełącz tryb „elektrostatyczny”: zobaczysz duże skoki na złączach, a mimo to różnica między zaciskami Cu(+) i Cu(−) to dokładnie SEM.</p>

  <h3>5. Jak czytać diagram poziomów Fermiego</h3>
  <ul>
    <li>Oś pionowa: energia elektronu względem poziomu próżni. Poziom Fermiego metalu leży na −W.</li>
    <li>Wypełnienie i biała krzywa: obsadzenie stanów f(E) wg rozkładu Fermiego–Diraca. Szerokość rozmycia ≈ 4kT — przy Tₓ wyraźnie większa niż przy T₀ (skala bez przesadzania).</li>
    <li>Diagram pokazuje stan <b>przed zetknięciem</b>. Strzałka biegnie od niższego do wyższego poziomu Fermiego, czyli w stronę metalu, który po zetknięciu stanie się dodatni; jej długość to |E(X,Y)|·e.</li>
    <li>Miedź (C) stoi między A i B, bo w obwodzie łączy się z obydwoma elektrodami przy T₀.</li>
  </ul>

  <h3>6. Uwaga o modelu „podręcznikowym”</h3>
  <p>W starszych podręcznikach SEM tłumaczy się jako różnicę napięć kontaktowych złącza gorącego i zimnego: E = U_AB(Tₓ) − U_AB(T₀), z członem (kT/e)·ln(n_A/n_B). To uproszczenie historyczne. Współcześnie SEM lokalizuje się w objętości przewodów (∫α dT), a na złączach wydziela się ciepło Peltiera Π = α·T. Dla stałych α oba opisy dają ten sam wynik — symulator pokazuje obraz objętościowy, a napięcia kontaktowe jako osobny, równowagowy efekt.</p>

  <h3>7. Niejednorodność przewodu — granica prawa temperatur pośrednich</h3>
  <p>Teleskopowanie działa tylko wtedy, gdy α jest takie samo na całej długości przewodu. Rzeczywisty drut starzeje się nierównomiernie: utlenianie, dyfuzja domieszek, zmiany struktury po zgięciu lub zgnieceniu zmieniają lokalnie α. Wtedy:</p>
  <div class=&quot;formula&quot;>SEM = ∫ α(x)·(dT/dx) dx  ≠  (α_A − α_B)(Tₓ − T₀)</div>
  <ul>
    <li>Odcinek o zmienionym α wnosi <b>Δα·[T(koniec) − T(początek)]</b> — liczy się tylko różnica temperatur na jego krawędziach. Działa jak pasożytnicza termopara z dwoma złączami na granicach odcinka.</li>
    <li>W strefie izotermicznej, albo gdy obie krawędzie są nagrzane jednakowo, niejednorodność jest niewidoczna.</li>
    <li>Źródło ciepła przy <b>jednej krawędzi</b> odcinka zmienia SEM, mimo że temperatury złączy są stałe — dlatego wskazania zestarzałej termopary zależą od głębokości zanurzenia i od rozkładu temperatury w piecu.</li>
  </ul>
  <p>Włącz „Niejednorodność” i przesuwaj świeczkę wzdłuż zaznaczonego odcinka: na środku Δ się nie zmienia, przy krawędziach rośnie (z przeciwnymi znakami dla lewej i prawej krawędzi).</p>

  <h3>8. Różne temperatury zacisków</h3>
  <p>Prawo metalu pośredniego wymaga, by oba złącza z miedzią miały tę samą temperaturę. Jeśli złącze Cu|B jest o δ cieplejsze od Cu|A, w obwodzie pojawia się dodatkowa SEM:</p>
  <div class=&quot;formula&quot;>ΔSEM = (α_B − α_Cu)·δ = (${m.B.alpha} − ${m.C.alpha})·δ = ${(m.B.alpha-m.C.alpha).toFixed(1)} µV/°C · δ</div>
  <p>Dla termopary K każdy stopień różnicy między zaciskami to błąd ok. 0,5 °C. Dlatego zaciski przyrządów termoparowych umieszcza się na wspólnym bloku izotermicznym, a czujnik kompensacji montuje tuż przy nich.</p>

  <h3>9. Dane i ograniczenia</h3>
  <table class=&quot;wt&quot;><tr><th>Materiał</th><th>α [µV/°C]</th><th>W [eV]</th></tr>
    ${row(S.matA)}${S.matB!==S.matA?row(S.matB):''}${row(CU)}</table>
  <ul class=&quot;note&quot;>
    <li>α — wartości bezwzględne w pobliżu temperatury pokojowej, w modelu stałe (brak efektu Thomsona). Dla stopów termoparowych dobrane tak, by różnice odtwarzały czułości NIST ITS-90 przy 0 °C.</li>
    <li>W — prace wyjścia polikryształów; „≈” oznacza szacunek dla stopów i półprzewodników (zależy od składu i powierzchni).</li>
    <li>Pełne charakterystyki E(T) z nieliniowością — zakładka „Symulator pomiaru”.</li>
  </ul>`;
}

const T_START=performance.now();
function frame(now){
  if(active &amp;&amp; !document.hidden){

      needDraw=false;
      const ok=[drawCircuit(t),drawFermi(),drawTemp(),drawSegs(),drawVolt()];

  }

}

/* ── QUIZ — pytania sprawdzające (wspólny moduł) ─────────────── */
const Quiz=(()=>{
  let order=[],perm=[],i=0,score=0,answered=false,picked=-1;
  const $=id=>document.getElementById(id);
  const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;};
  function start(){order=shuffle(QUIZ_Q.map((_,k)=>k));i=0;score=0;answered=false;newPerm();}
  function newPerm(){const q=QUIZ_Q[order[i]];perm=q?shuffle(q.opts.map((_,k)=>k)):[];picked=-1;}
  function open(){if(!order.length)start();$('qzBack').style.display='none';$('quizOv').classList.add('open');render();}
  function close(){$('quizOv').classList.remove('open');}
  function render(){
    const body=$('qzBody'), n=QUIZ_Q.length;
    if(i>=n){
      const pct=Math.round(score/n*100);
      const msg=pct>=90?'Świetnie — materiał opanowany.':pct>=70?'Dobrze — przejrzyj wyjaśnienia pytań z błędami.':pct>=50?'Połowicznie — wróć do zakładki 📖 Teoria i spróbuj ponownie.':'Warto jeszcze raz przejść przez Teorię i poeksperymentować z symulatorem.';
      $('qzProg').textContent=`${n}/${n}`;
      body.innerHTML=`<div class=&quot;qz-sum&quot;><div class=&quot;qz-score&quot;>${score} / ${n}</div><div class=&quot;qz-pct&quot;>${pct} %</div><p>${msg}</p>
        <button class=&quot;qz-btn qz-pri&quot; onclick=&quot;Quiz.restart()&quot;>↻ Od nowa (nowa kolejność)</button></div>`;
      return;
    }
    const q=QUIZ_Q[order[i]];
    $('qzProg').textContent=`${i+1}/${n} · wynik ${score}`;
    const opts=perm.map((k,pos)=>{
      let cls='qz-opt';
      if(answered){ if(k===q.a) cls+=' ok'; else if(pos===picked) cls+=' bad'; else cls+=' dim'; }
      return `<button class=&quot;${cls}&quot; ${answered?'disabled':''} onclick=&quot;Quiz.answer(${pos})&quot;><span class=&quot;qz-l&quot;>${'ABCD'[pos]}</span>${q.opts[k]}</button>`;
    }).join('');
    const fb=answered?`<div class=&quot;qz-fb ${perm[picked]===q.a?'ok':'bad'}&quot;><b>${perm[picked]===q.a?'✓ Dobrze.':'✗ Niestety nie.'}</b> ${q.exp}</div>`:'';
    body.innerHTML=`<div class=&quot;qz-topic&quot;>${q.topic}</div><p class=&quot;qz-q&quot;>${q.q}</p><div class=&quot;qz-opts&quot;>${opts}</div>${fb}

// Wybór odcinka wielomianu dla temperatury T
function tcSeg(d,T){for(const q of d.seg){if(T<=q.hi)return q;}return d.seg[d.seg.length-1];}

// E(T) [mV] wg NIST ITS-90 (T ograniczona do zakresu typu)
function emf(type,T){
  const d=TC[type]; if(!d) return 0;
  T=Math.max(d.range[0],Math.min(d.range[1],T));
  const q=tcSeg(d,T);
  let e=0; for(let i=q.c.length-1;i>=0;i--) e=e*T+q.c[i];
  if(q.a) e+=q.a[0]*Math.exp(q.a[1]*(T-q.a[2])*(T-q.a[2]));
  return e;
}

// Czułość Seebecka α(T)=dE/dT [µV/°C] — pochodna analityczna (ciągła)
function alpha(type,T){
  const d=TC[type]; if(!d) return 0;
  T=Math.max(d.range[0],Math.min(d.range[1],T));
  const q=tcSeg(d,T);
  let de=0; for(let i=q.c.length-1;i>=1;i--) de=de*T+i*q.c[i];
  if(q.a){const u=T-q.a[2]; de+=q.a[0]*Math.exp(q.a[1]*u*u)*2*q.a[1]*u;}
  return de*1000;
}

// T(E) — funkcja odwrotna: bisekcja (E(T) monotoniczna w zakresie) + Newton
function tempFromEmf(type,E){
  const d=TC[type]; if(!d) return 0;
  let lo=d.range[0], hi=d.range[1];
  if(E<=emf(type,lo)) return lo;
  if(E>=emf(type,hi)) return hi;
  for(let k=0;k<40;k++){const m=(lo+hi)/2; if(emf(type,m)<E) lo=m; else hi=m;}
  let T=(lo+hi)/2;
  for(let k=0;k<3;k++){const a=alpha(type,T)/1000; if(a>0) T-=(emf(type,T)-E)/a;}
  return T;
}


/* ── PRZEWODY: składy i rezystywności (20 °C, stałe w modelu) ──────────────
   ρ [nΩ·m]: Omega Engineering, Thermocouple Technical Reference, s. Z-49
   (Ω·cmil/ft × 1,6624); Nicrosil, Nisil: karty materiałowe Kanthal.
   Kolory jak w zakładce „Efekt Seebecka”; A = przewód dodatni wg NIST.            */
const LEGS={
  K:{A:{name:'Chromel',  rho:706, c:'#f59e0b'}, B:{name:'Alumel',     rho:294, c:'#06b6d4'}},
  J:{A:{name:'Żelazo',   rho:100, c:'#ef4444'}, B:{name:'Konstantan', rho:489, c:'#a855f7'}},
  T:{A:{name:'Miedź',    rho:15.4,c:'#c26a2b'}, B:{name:'Konstantan', rho:489, c:'#a855f7'}},
  E:{A:{name:'Chromel',  rho:706, c:'#f59e0b'}, B:{name:'Konstantan', rho:489, c:'#a855f7'}},
  N:{A:{name:'Nicrosil', rho:1000,c:'#f97316'}, B:{name:'Nisil',      rho:365, c:'#8b5cf6'}},
  S:{A:{name:'Pt-10%Rh', rho:185, c:'#d6b67a'}, B:{name:'Platyna',    rho:98.3,c:'#c4c4c4'}},
};

/* ── STAN ── */
const S={level:'beginner',type:'K',Tx:300,T0:20,rlPos:44,L:10,d:1};
let needDraw=true, active=true, docsOpen=false;
const RL=()=>Math.pow(10,-1+5*S.rlPos/100);                 // 0,1 Ω … 10 kΩ (skala log)
function setState(k,v){S[k]=v; syncUI(); needDraw=true;}
function setType(t){
  S.type=t; const r=TC[t].range;
  const sl=g('slTx'); sl.max=Math.min(1000,r[1]); sl.min=Math.max(30,S.T0+10);
  if(S.Tx>+sl.max) S.Tx=+sl.max;
  syncUI(); needDraw=true;
}
function setLevel(l){S.level=l; document.querySelectorAll('#lvlBtns button').forEach(b=>b.classList.toggle('active',b.dataset.l===l)); needDraw=true;}
function slPct(el){const mn=+el.min,mx=+el.max,v=+el.value; el.style.setProperty('--pct',((v-mn)/(mx-mn)*100)+'%');}
function fmtR(r){return r>=1000?(r/1000).toFixed(r>=1e4?0:2)+' kΩ':r>=10?r.toFixed(r>=100?0:1)+' Ω':r.toFixed(2)+' Ω';}
function syncUI(){
  g('slTx').value=S.Tx; g('vTx').textContent=S.Tx+' °C';
  g('slT0').value=S.T0; g('vT0').textContent=S.T0+' °C';
  g('slRL').value=S.rlPos; g('vRL').textContent=fmtR(RL());
  g('slL').value=S.L; g('vL').textContent=S.L+' m';
  ['slTx','slT0','slRL','slL'].forEach(id=>slPct(g(id)));
}
function toggleDocs(){docsOpen=!docsOpen; g('docsOverlay').classList.toggle('open',docsOpen); if(docsOpen) updateExpl();}

/* ── FIZYKA ─────────────────────────────────────────────────────
   Kelvin: Π_AB(T) = α_AB(T)·T  [T w K]
   Generator: I = E/(R_tc + R_L). Ciepło pobrane w spoinie Q_h = Π(Tₓ)·I,
   oddane w złączach zimnych Q_c = Π(T₀)·I (łącznie Cu|A i Cu|B — prawo metalu pośredniego).
   Bilans: E·I = Q_h − Q_c + Q_Th, stąd Thomson netto Q_Th = I·(E − ΔΠ) (= −I∫(μ_A−μ_B)dT).
   E·I = I²R_tc + I²R_L. Jednostki: mV, Ω, mA → µW.                                   */
function model(){
  const L=LEGS[S.type], A=Math.PI*Math.pow(S.d*1e-3/2,2);   // m²
  const Rtc=S.L*(L.A.rho+L.B.rho)*1e-9/A;                  // Ω
  const Rl=RL(), E=emf(S.type,S.Tx)-emf(S.type,S.T0);      // mV
  const I=E/(Rtc+Rl);                                       // mA
  const PiX=alpha(S.type,S.Tx)*(S.Tx+273.15)/1000;          // mV
  const Pi0=alpha(S.type,S.T0)*(S.T0+273.15)/1000;          // mV
  const Qh=PiX*I, Qc=Pi0*I, Pel=E*I, Ptc=I*I*Rtc, Pl=I*I*Rl; // µW
  const Qth=Pel-(Qh-Qc);
  const Pmax=E*E/(4*Rtc);
  return {L,A,Rtc,Rl,E,I,PiX,Pi0,Qh,Qc,Qth,Pel,Ptc,Pl,Pmax,U:I*Rl};
}

/* ── POMOCNICZE ── */
function rszC(c){const w=c.clientWidth,h=c.clientHeight; if(w<20||h<20) return [null,0,0];
  const dpr=window.devicePixelRatio||1, nw=Math.round(w*dpr), nh=Math.round(h*dpr);
  if(c.width!==nw||c.height!==nh){c.width=nw;c.height=nh;}
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return [ctx,w,h];}
function parseColor(s){if(s.startsWith('#')){const c=s.slice(1);return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
  const m=s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/); return m?[+m[1],+m[2],+m[3]]:[128,128,128];}
function rgba(col,a){const [r,gg,b]=parseColor(col);return `rgba(${r},${gg},${b},${a})`;}
function txt(ctx,s,x,y,col,font,align,base){ctx.fillStyle=col;ctx.font=font;ctx.textAlign=align||'left';ctx.textBaseline=base||'alphabetic';ctx.fillText(s,x,y);}
function niceStep(range,n){const raw=range/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
function fmtP(uw){const a=Math.abs(uw);return a>=1000?(uw/1000).toFixed(a>=1e4?1:2)+' mW':a>=1?uw.toFixed(a>=100?0:a>=10?1:2)+' µW':(uw*1000).toFixed(a*1000>=10?1:2)+' nW';}
function fmtI(ma){const a=Math.abs(ma);return a>=1?ma.toFixed(a>=100?0:a>=10?1:3)+' mA':(ma*1000).toFixed(a*1000>=100?0:a*1000>=10?1:2)+' µA';}
function arrowLine(ctx,x1,y1,x2,y2,col,lw){
  const ang=Math.atan2(y2-y1,x2-x1), hl=Math.max(8,lw*3);
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2-Math.cos(ang)*hl*0.8,y2-Math.sin(ang)*hl*0.8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hl*Math.cos(ang)+hl*0.55*Math.sin(ang), y2-hl*Math.sin(ang)-hl*0.55*Math.cos(ang));
  ctx.lineTo(x2-hl*Math.cos(ang)-hl*0.55*Math.sin(ang), y2-hl*Math.sin(ang)+hl*0.55*Math.cos(ang));
  ctx.closePath(); ctx.fill();
}
// grubość strzałki ciepła rośnie z mocą (skala logarytmiczna, czytelna od nW do mW)
const heatW=uw=>clamp(1.5,9,2+1.6*Math.log10(Math.max(1e-3,Math.abs(uw))+1)*1.6);

/* ── SCHEMAT OBWODU ─────────────────────────────────────────── */
const cCirc=g('cCirc');
function drawCircuit(t){
  const [ctx,W,H]=rszC(cCirc); if(!ctx) return false;
  const M=model(), L=M.L, dark=isDark(), muted=tv('--muted'), ink=tv('--text');
  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  const fs=clamp(10,13,Math.round(W*0.0135)), wH=clamp(12,20,Math.round(H*0.048));
  const yA=Math.round(H*0.30), yB=Math.round(H*0.72), yMid=(yA+yB)/2;
  const rlX=Math.max(64,W*0.11);                 // oś rezystora obciążenia
  const x0=rlX+Math.max(70,W*0.14);              // złącza zimne Cu|A, Cu|B
  const x1=W-Math.max(110,W*0.17);               // spoina pomiarowa (oś odcinków pionowych)
  // tło: zimno → gorąco
  const tbg=ctx.createLinearGradient(x0,0,x1,0); tbg.addColorStop(0,'rgba(59,130,246,.07)'); tbg.addColorStop(1,'rgba(239,68,68,.12)');
  ctx.fillStyle=tbg; ctx.fillRect(x0,yA-wH/2-26,x1-x0+wH/2,yB-yA+wH+52);
  // elektrody A, B
  ctx.fillStyle=L.A.c; ctx.fillRect(x0,yA-wH/2,x1-x0,wH);
  ctx.fillStyle=L.B.c; ctx.fillRect(x0,yB-wH/2,x1-x0,wH);
  ctx.fillStyle=L.A.c; ctx.fillRect(x1-wH/2,yA-wH/2,wH,yMid-(yA-wH/2));
  ctx.fillStyle=L.B.c; ctx.fillRect(x1-wH/2,yMid,wH,(yB+wH/2)-yMid);
  const hl=ctx.createLinearGradient(0,0,0,wH/2); hl.addColorStop(0,'rgba(255,255,255,.18)'); hl.addColorStop(1,'rgba(255,255,255,0)');
  // przewody Cu do obciążenia
  const cu='#c26a2b';
  ctx.fillStyle=cu; ctx.fillRect(rlX,yA-wH/2,x0-rlX,wH); ctx.fillRect(rlX,yB-wH/2,x0-rlX,wH);
  ctx.fillRect(rlX-wH/2,yA-wH/2,wH,(yMid-34)-(yA-wH/2)); ctx.fillRect(rlX-wH/2,yMid+34,wH,(yB+wH/2)-(yMid+34));
  // rezystor obciążenia R_L (prostokąt wg PN-EN 60617)
  ctx.fillStyle=tv('--surf'); ctx.strokeStyle=ink; ctx.lineWidth=2;
  ctx.fillRect(rlX-13,yMid-34,26,68); ctx.strokeRect(rlX-13,yMid-34,26,68);
  txt(ctx,'R',rlX,yMid-2,ink,`600 ${fs+1}px ${MONO}`,'center','middle');
  txt(ctx,'L',rlX+6,yMid+8,ink,`600 ${fs-2}px ${MONO}`,'left','middle');
  txt(ctx,fmtR(M.Rl),rlX-18,yMid,ink,`600 ${fs}px ${MONO}`,'right','middle');
  // granice złączy
  ctx.strokeStyle=dark?'rgba(255,255,255,.85)':'rgba(0,0,0,.7)'; ctx.lineWidth=2;
  [yA,yB].forEach(y=>{ctx.beginPath();ctx.moveTo(x0,y-wH/2-3);ctx.lineTo(x0,y+wH/2+3);ctx.stroke();});
  ctx.beginPath(); ctx.moveTo(x1-wH/2-3,yMid); ctx.lineTo(x1+wH/2+3,yMid); ctx.stroke();

  // ścieżka prądu umownego (generator, E>0): B → spoina → A → Cu górny → R_L → Cu dolny → B
  const path=[[x0,yA],[rlX,yA],[rlX,yB],[x0,yB],[x1,yB],[x1,yA],[x0,yA]];
  const segL=[]; let tot=0; for(let i=1;i<path.length;i++){const d=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]); segL.push(d); tot+=d;}
  const at=s=>{s=((s%tot)+tot)%tot; for(let i=0;i<segL.length;i++){if(s<=segL[i]){const f=s/segL[i];return [path[i][0]+(path[i+1][0]-path[i][0])*f,path[i][1]+(path[i+1][1]-path[i][1])*f];} s-=segL[i];} return path[0];};
  // elektrony płyną przeciwnie do prądu umownego; prędkość rośnie z |I| (skala log, czytelna)
  const sp=M.I===0?0:Math.sign(M.I)*clamp(6,90,22*Math.log10(1+Math.abs(M.I)*1000));
  const nE=Math.round(tot/18);
  for(let k=0;k<nE;k++){
    const [px,py]=at(k*tot/nE - sp*t);
    ctx.globalAlpha=0.9; ctx.fillStyle=dark?'#eef2ff':'#ffffff'; ctx.beginPath(); ctx.arc(px,py,2.1,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.45; ctx.strokeStyle=dark?'#000':'#334'; ctx.lineWidth=0.6; ctx.stroke();
  }
  ctx.globalAlpha=1;
  // strzałki prądu umownego I
  const dirI=M.I>=0?1:-1, ic=tv('--green');
  if(Math.abs(M.I)>1e-9){
    const ax=(x0+x1)/2;
    // I>0: w A od spoiny ku T₀ (w lewo), w B od T₀ ku spoinie (w prawo)
    arrowLine(ctx,ax+dirI*22,yA-wH/2-12,ax-dirI*22,yA-wH/2-12,ic,2);
    arrowLine(ctx,ax-dirI*22,yB+wH/2+12,ax+dirI*22,yB+wH/2+12,ic,2);
    arrowLine(ctx,rlX+20,yMid-dirI*14,rlX+20,yMid+dirI*14,ic,2);   // przez R_L z góry w dół
  }
  txt(ctx,'I',(x0+x1)/2+30,yA-wH/2-12,ic,`600 ${fs}px ${MONO}`,'left','middle');

  // ciepło Peltiera: spoina pobiera (Q_h>0), złącza zimne oddają (Q_c>0) — przy I<0 odwrotnie
  const cin=tv('--heatIn'), cout=tv('--heatOut');
  { const w=heatW(M.Qh), into=M.Qh>=0, xs=x1+wH/2+8, len=42, col=into?cin:cout;
    if(into) arrowLine(ctx,xs+len,yMid,xs,yMid,col,w); else arrowLine(ctx,xs,yMid,xs+len,yMid,col,w);
    txt(ctx,(into?'pobiera ':'oddaje ')+fmtP(Math.abs(M.Qh)),xs+4,yMid-w-6,col,`600 ${fs-1}px ${MONO}`,'left','bottom');
    txt(ctx,'Q = Π(Tₓ)·I',xs+4,yMid+w+6,col,`${fs-1}px ${MONO}`,'left','top'); }
  for(const yJ of [yA,yB]){
    const w=heatW(M.Qc/2), out=M.Qc>=0, col=out?cout:cin, ys=yJ===yA?yJ-wH/2-6:yJ+wH/2+6, dy=yJ===yA?-30:30;
    if(out) arrowLine(ctx,x0,ys,x0,ys+dy,col,w); else arrowLine(ctx,x0,ys+dy,x0,ys,col,w);
  }
  txt(ctx,(M.Qc>=0?'oddają ':'pobierają ')+fmtP(Math.abs(M.Qc)),x0+8,yA-wH/2-30,cout,`600 ${fs-1}px ${MONO}`,'left','bottom');
  txt(ctx,W<600?'Q = Π(T₀)·I':'Q = Π(T₀)·I (Cu|A + Cu|B)',x0+8,yB+wH/2+30,cout,`${fs-1}px ${MONO}`,'left','top');

  // amperomierz / woltomierz na obciążeniu — odczyt cyfrowy
  const mx=6, my=Math.max(8,yA-wH/2-70), mw=Math.min(rlX+60,150), mh=46;
  ctx.fillStyle='#1b1d24'; ctx.strokeStyle='#4a5060'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.roundRect(mx,my,mw,mh,6); ctx.fill(); ctx.stroke();
  txt(ctx,'I = '+fmtI(M.I),mx+8,my+16,'#4ade80',`600 ${fs}px ${MONO}`,'left','middle');
  txt(ctx,'U = '+M.U.toFixed(3)+' mV',mx+8,my+34,'#4ade80',`600 ${fs}px ${MONO}`,'left','middle');

  // etykiety
  txt(ctx,`A: ${L.A.name} (+)`,(x0+x1)/2,yA+wH/2+5,ink,`600 ${fs}px ${FONT}`,'center','top');
  txt(ctx,`B: ${L.B.name} (−)`,(x0+x1)/2,yB-wH/2-5,ink,`600 ${fs}px ${FONT}`,'center','bottom');
  txt(ctx,'T₀ = '+S.T0+' °C',x0,yB+wH/2+52,'#3b82f6',`600 ${fs}px ${MONO}`,'center','top');
  txt(ctx,'Tₓ = '+S.Tx+' °C',x1,yA-wH/2-30,'#ef4444',`600 ${fs}px ${MONO}`,'center','bottom');
  txt(ctx,'Cu',(rlX+x0)/2,yA+wH/2+4,'#c26a2b',`600 ${fs-1}px ${FONT}`,'center','top');
  txt(ctx,'Cu',(rlX+x0)/2,yB-wH/2-4,'#c26a2b',`600 ${fs-1}px ${FONT}`,'center','bottom');
  txt(ctx,W<700?'● e⁻ płyną przeciwnie do strzałek I':'● e⁻ płyną przeciwnie do strzałek I · spoina chłodzi się, złącza zimne grzeją — prąd dąży do wyrównania temperatur',
      8,H-8,muted,`${fs-1}px ${FONT}`,'left','bottom');
  return true;
}

/* ── BILANS MOCY (wykres wodospadowy) ───────────────────────── */
const cBal=g('cBal');
function drawBal(){
  const [ctx,W,H]=rszC(cBal); if(!ctx) return false;
  const M=model(), muted=tv('--muted'), ink=tv('--text'), fs=clamp(10,12,Math.round(W*0.016));
  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  const pL=58,pR=W-12,pT=26,pB=46, cw=pR-pL, ch=H-pT-pB;
  const items=[
    {k:'Peltier Tₓ',sub:'pobrane',v:M.Qh,c:tv('--heatIn')},
    {k:'Peltier T₀',sub:'oddane',v:-M.Qc,c:tv('--heatOut')},
    {k:'Thomson',sub:'netto',v:M.Qth,c:tv('--thom')},
    {k:'E·I',sub:'moc el.',total:M.Pel,c:tv('--green')},
    {k:'I²R_tc',sub:'przewody',v:M.Ptc,split:true,c:tv('--red')},
    {k:'I²R_L',sub:'obciążenie',v:M.Pl,split:true,c:tv('--amber')},
  ];
  // wartości skumulowane
  let run=0; const bars=[];
  items.forEach(it=>{
    if(it.total!==undefined){bars.push({...it,y0:0,y1:it.total}); run=0; return;}
    if(it.split){bars.push({...it,y0:run,y1:run+it.v}); run+=it.v; return;}
    bars.push({...it,y0:run,y1:run+it.v}); run+=it.v;
  });
  const all=bars.flatMap(b=>[b.y0,b.y1]).concat([0]);
  let lo=Math.min(...all), hi=Math.max(...all); const pad=(hi-lo)*0.1||1; lo-=pad*0.4; hi+=pad;
  const vy=v=>pT+ch-(v-lo)/(hi-lo)*ch;
  const st=niceStep(hi-lo,4);
  ctx.lineWidth=.6;
  for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st){ctx.strokeStyle=Math.abs(v)<1e-12?tv('--border2'):tv('--border');ctx.beginPath();ctx.moveTo(pL,vy(v));ctx.lineTo(pR,vy(v));ctx.stroke();
    txt(ctx,fmtP(v).replace(' ',' '),pL-4,vy(v),muted,`${fs-2}px ${MONO}`,'right','middle');}
  const n=bars.length, bw=cw/n*0.58;
  bars.forEach((b,i)=>{
    const xc=pL+(i+.5)*cw/n, ya=vy(b.y0), yb=vy(b.y1);
    ctx.fillStyle=rgba(b.c,0.75); ctx.fillRect(xc-bw/2,Math.min(ya,yb),bw,Math.max(1,Math.abs(yb-ya)));
    ctx.strokeStyle=b.c; ctx.lineWidth=1.2; ctx.strokeRect(xc-bw/2,Math.min(ya,yb),bw,Math.max(1,Math.abs(yb-ya)));
    if(i<n-1&amp;&amp;!bars[i+1].total&amp;&amp;!(b.total&amp;&amp;bars[i+1].split)){ /* łącznik do następnego słupka */
      ctx.strokeStyle=muted; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(xc+bw/2,yb); ctx.lineTo(xc+cw/n-bw/2,yb); ctx.stroke(); ctx.setLineDash([]); }
    const val=b.total!==undefined?b.total:b.v;
    txt(ctx,(val>=0&amp;&amp;b.total===undefined?'+':'')+fmtP(val),xc,Math.min(ya,yb)-4,ink,`600 ${fs-1}px ${MONO}`,'center','bottom');
    txt(ctx,b.k,xc,pT+ch+6,b.c,`600 ${fs-1}px ${FONT}`,'center','top');
    txt(ctx,b.sub,xc,pT+ch+8+fs,muted,`${fs-2}px ${FONT}`,'center','top');
  });
  // klamra rozdziału E·I
  const i3=3, xs=pL+(i3+.5)*cw/n+bw/2;
  ctx.strokeStyle=muted; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(xs,vy(0)); ctx.lineTo(pL+(4+.5)*cw/n-bw/2,vy(0)); ctx.moveTo(xs,vy(M.Pel)); ctx.lineTo(pL+(5+.5)*cw/n+bw/2,vy(M.Pel)); ctx.stroke(); ctx.setLineDash([]);
  txt(ctx,'Q_Π(Tₓ) − Q_Π(T₀) + Q_Th = E·I = I²R_tc + I²R_L',pL,pT-8,muted,`${fs-1}px ${MONO}`,'left','bottom');
  ctx.strokeStyle=tv('--border2'); ctx.lineWidth=1; ctx.strokeRect(pL,pT,cw,ch);
  return true;
}

/* ── DOPASOWANIE OBCIĄŻENIA ─────────────────────────────────── */
const cLoad=g('cLoad');
function drawLoad(){
  const [ctx,W,H]=rszC(cLoad); if(!ctx) return false;
  const M=model(), muted=tv('--muted'), ink=tv('--text'), fs=clamp(10,12,Math.round(W*0.016));
  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  const pL=58,pR=W-58,pT=26,pB=34, cw=pR-pL, ch=H-pT-pB;
  ctx.fillStyle=tv('--surf'); ctx.fillRect(pL,pT,cw,ch);
  const lx=r=>pL+(Math.log10(r)+1)/5*cw;                    // 0,1 Ω … 10 kΩ
  const P=r=>M.E*M.E*r/Math.pow(M.Rtc+r,2), Ir=r=>M.E/(M.Rtc+r);
  const Pm=Math.max(M.Pmax,1e-9)*1.12, Im=Math.max(Math.abs(Ir(0.1)),1e-9)*1.08;
  const py=v=>pT+ch-v/Pm*ch, iy=v=>pT+ch-Math.abs(v)/Im*ch;
  ctx.lineWidth=.6;
  for(let e=-1;e<=4;e++){const x=lx(Math.pow(10,e)); ctx.strokeStyle=tv('--border'); ctx.beginPath(); ctx.moveTo(x,pT); ctx.lineTo(x,pT+ch); ctx.stroke();
    txt(ctx,fmtR(Math.pow(10,e)),x,pT+ch+4,muted,`${fs-2}px ${MONO}`,'center','top');}
  const st=niceStep(Pm,4); for(let v=0;v<=Pm;v+=st){ctx.strokeStyle=tv('--border'); ctx.beginPath(); ctx.moveTo(pL,py(v)); ctx.lineTo(pR,py(v)); ctx.stroke();
    txt(ctx,fmtP(v),pL-4,py(v),tv('--amber'),`${fs-2}px ${MONO}`,'right','middle');}
  const sti=niceStep(Im,4); for(let v=0;v<=Im;v+=sti) txt(ctx,fmtI(v),pR+4,iy(v),tv('--green'),`${fs-2}px ${MONO}`,'left','middle');
  // dopasowanie R_L = R_tc
  if(M.Rtc>=0.1&amp;&amp;M.Rtc<=1e4){const x=lx(M.Rtc); ctx.strokeStyle=tv('--blue'); ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(x,pT); ctx.lineTo(x,pT+ch); ctx.stroke(); ctx.setLineDash([]);
    txt(ctx,`R_L = R_tc = ${fmtR(M.Rtc)} → P_max = ${fmtP(M.Pmax)}`,x+(x>pL+cw*0.6?-6:6),pT+4,tv('--blue'),`600 ${fs-1}px ${MONO}`,x>pL+cw*0.6?'right':'left','top');}
  ctx.save(); ctx.beginPath(); ctx.rect(pL,pT,cw,ch); ctx.clip();
  ctx.strokeStyle=tv('--green'); ctx.lineWidth=1.6; ctx.setLineDash([5,3]); ctx.beginPath();
  for(let i=0;i<=200;i++){const r=Math.pow(10,-1+5*i/200), x=lx(r), y=iy(Ir(r)); i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle=tv('--amber'); ctx.lineWidth=2.4; ctx.beginPath();
  for(let i=0;i<=200;i++){const r=Math.pow(10,-1+5*i/200), x=lx(r), y=py(P(r)); i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke();
  ctx.restore();
  const xr=lx(M.Rl);
  ctx.fillStyle=tv('--amber'); ctx.beginPath(); ctx.arc(xr,py(M.Pl),5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=tv('--green'); ctx.beginPath(); ctx.arc(xr,iy(M.I),4,0,Math.PI*2); ctx.fill();
  txt(ctx,'P_L [moc w obciążeniu]',pL+4,pT-6,tv('--amber'),`600 ${fs-1}px ${FONT}`,'left','bottom');
  txt(ctx,'I [prąd] - - -',pR,pT-6,tv('--green'),`600 ${fs-1}px ${FONT}`,'right','bottom');
  ctx.strokeStyle=tv('--border2'); ctx.lineWidth=1; ctx.strokeRect(pL,pT,cw,ch);
  return true;
}

/* ── WSPÓŁCZYNNIK PELTIERA Π(T) ─────────────────────────────── */
const cPi=g('cPi');
function drawPi(){
  const [ctx,W,H]=rszC(cPi); if(!ctx) return false;
  const M=model(), muted=tv('--muted'), ink=tv('--text'), fs=clamp(10,12,Math.round(W*0.016));
  ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  const pL=58,pR=W-14,pT=26,pB=34, cw=pR-pL, ch=H-pT-pB;
  ctx.fillStyle=tv('--surf'); ctx.fillRect(pL,pT,cw,ch);
  const r=TC[S.type].range, Tlo=Math.max(r[0],-200), Thi=r[1];
  const Pi=T=>alpha(S.type,T)*(T+273.15)/1000;
  let pmax=0; for(let i=0;i<=200;i++) pmax=Math.max(pmax,Pi(Tlo+(Thi-Tlo)*i/200)); pmax*=1.1;
  const tx=T=>pL+(T-Tlo)/(Thi-Tlo)*cw, py=v=>pT+ch-v/pmax*ch;
  ctx.lineWidth=.6;
  const ts=niceStep(Thi-Tlo,6); for(let T=Math.ceil(Tlo/ts)*ts;T<=Thi;T+=ts){ctx.strokeStyle=tv('--border');ctx.beginPath();ctx.moveTo(tx(T),pT);ctx.lineTo(tx(T),pT+ch);ctx.stroke();txt(ctx,T+'°',tx(T),pT+ch+4,muted,`${fs-2}px ${MONO}`,'center','top');}
  const ps=niceStep(pmax,4); for(let v=0;v<=pmax;v+=ps){ctx.strokeStyle=tv('--border');ctx.beginPath();ctx.moveTo(pL,py(v));ctx.lineTo(pR,py(v));ctx.stroke();txt(ctx,v.toFixed(ps<1?1:0),pL-4,py(v),muted,`${fs-2}px ${MONO}`,'right','middle');}
  ctx.save(); ctx.beginPath(); ctx.rect(pL,pT,cw,ch); ctx.clip();
  ctx.fillStyle=rgba('#f59e0b',0.10); ctx.fillRect(tx(S.T0),py(M.PiX),tx(S.Tx)-tx(S.T0),py(M.Pi0)-py(M.PiX));
  ctx.strokeStyle=TC[S.type].color; ctx.lineWidth=2.4; ctx.beginPath();
  for(let i=0;i<=240;i++){const T=Tlo+(Thi-Tlo)*i/240; i?ctx.lineTo(tx(T),py(Pi(T))):ctx.moveTo(tx(T),py(Pi(T)));} ctx.stroke();
  ctx.restore();
  for(const [T,v,c,l] of [[S.T0,M.Pi0,'#3b82f6','Π(T₀)'],[S.Tx,M.PiX,'#ef4444','Π(Tₓ)']]){
    ctx.fillStyle=c; ctx.beginPath(); ctx.arc(tx(T),py(v),5,0,Math.PI*2); ctx.fill();
    txt(ctx,`${l} = ${v.toFixed(2)} mV`,tx(T)+8,py(v)-6,c,`600 ${fs-1}px ${MONO}`,'left','bottom');
  }
  txt(ctx,`ΔΠ = ${(M.PiX-M.Pi0).toFixed(2)} mV  vs  E = ${M.E.toFixed(3)} mV  →  Thomson: E − ΔΠ = ${(M.E-(M.PiX-M.Pi0)).toFixed(3)} mV`,pL,pT-8,muted,`${fs-1}px ${MONO}`,'left','bottom');
  ctx.save(); ctx.translate(12,pT+ch/2); ctx.rotate(-Math.PI/2); txt(ctx,'Π [mV]',0,0,muted,`${fs}px ${FONT}`,'center','middle'); ctx.restore();
  ctx.strokeStyle=tv('--border2'); ctx.lineWidth=1; ctx.strokeRect(pL,pT,cw,ch);
  return true;
}

/* ── TEORIA ── */
function updateExpl(){
  const M=model(), L=M.L;
  g('explDiv').innerHTML=`
  <h3>1. Od obwodu otwartego do zamkniętego</h3>
  <p>W zakładkach „Symulator pomiaru” i „Efekt Seebecka” woltomierz ma bardzo dużą rezystancję wejściową — prąd praktycznie nie płynie i widzimy samą SEM. Po zamknięciu obwodu rezystancją obciążenia R<sub>L</sub> termopara staje się <b>źródłem</b>: płynie prąd</p>
  <div class=&quot;formula&quot;>I = E / (R_tc + R_L),  R_tc = L·(ρ_A + ρ_B)/A</div>
  <p>Dla ${S.type} (${L.A.name}/${L.B.name}), L = ${S.L} m, Ø ${String(S.d).replace('.',',')} mm: R<sub>tc</sub> = ${fmtR(M.Rtc)}, I = ${fmtI(M.I)}.</p>

  <h3>2. Efekt Peltiera <span class=&quot;ref&quot;>[2]</span></h3>
  <p>Przepływ prądu przez złącze dwóch różnych przewodników wydziela lub pochłania ciepło proporcjonalne do prądu:</p>
  <div class=&quot;formula&quot;>Q̇ = Π_AB · I,     Π_AB(T) = α_AB(T) · T     (I relacja Kelvina) [3][4]</div>
  <ul>
    <li><b>Odwracalność:</b> zmiana kierunku prądu zamienia pobór ciepła na jego oddawanie — w przeciwieństwie do ciepła Joule'a I²R, które zawsze grzeje.</li>
    <li><b>W generatorze</b> prąd płynie tak, że spoina gorąca <b>pobiera</b> ciepło (chłodzi się), a złącza zimne je <b>oddają</b> — przepływ prądu przeciwdziała różnicy temperatur, która go wywołała (reguła przekory).</li>
    <li>Π liczymy z charakterystyk NIST <span class=&quot;ref&quot;>[1]</span>: α<sub>AB</sub>(T) = dE/dT, T w kelwinach. Teraz: Π(Tₓ) = ${M.PiX.toFixed(2)} mV, Π(T₀) = ${M.Pi0.toFixed(2)} mV.</li>
    <li>Ciepło Peltiera to <b>nie</b> napięcie kontaktowe × prąd. Napięcia kontaktowe (Volty) są rzędu 0,1–0,5 V i nie zależą od prądu; Π jest rzędu miliwoltów.</li>
    <li>Na złączach zimnych Cu|A i Cu|B ciepła się sumują: Π<sub>Cu,A</sub> + Π<sub>B,Cu</sub> = −Π<sub>AB</sub> przy tej samej T₀ — prawo metalu pośredniego obowiązuje także dla efektu Peltiera.</li>
  </ul>

  <h3>3. Bilans mocy i efekt Thomsona <span class=&quot;ref&quot;>[3][5]</span></h3>
  <p>Energia jest zachowana: ciepło pobrane w spoinie minus oddane w złączach zimnych, plus ciepło Thomsona w przewodach, daje moc elektryczną:</p>
  <div class=&quot;formula&quot;>Π(Tₓ)·I − Π(T₀)·I + Q_Th = E·I = I²R_tc + I²R_L
Q_Th = −I·∫(μ_A − μ_B) dT,   μ_A − μ_B = T·dα_AB/dT   (II relacja Kelvina)</div>
  <p>Gdyby α nie zależało od temperatury, Q<sub>Th</sub> = 0, a SEM byłaby po prostu różnicą współczynników Peltiera podzieloną przez T. Rzeczywiste α<sub>AB</sub>(T) się zmienia, więc Q<sub>Th</sub> ≠ 0 — teraz ${fmtP(M.Qth)}. W poziomie Beginner wyznaczamy Q<sub>Th</sub> z bilansu; rozkład ciepła Thomsona wzdłuż przewodu pokaże poziom Expert.</p>

  <h3>4. Dopasowanie obciążenia</h3>
  <p>Moc w obciążeniu P<sub>L</sub> = E²·R<sub>L</sub>/(R<sub>tc</sub>+R<sub>L</sub>)² jest największa dla R<sub>L</sub> = R<sub>tc</sub> (twierdzenie o dopasowaniu źródła): P<sub>max</sub> = E²/(4R<sub>tc</sub>) = ${fmtP(M.Pmax)}. Przy zwarciu prąd jest największy, a cała moc wydziela się w przewodach termopary; przy dużym R<sub>L</sub> prąd i efekty cieplne zanikają — to warunek dokładnego pomiaru SEM.</p>

  <h3>5. Dlaczego termopara nie jest dobrym generatorem</h3>
  <p>Moce są rzędu mikrowatów. Rzeczywistą sprawność dodatkowo obniża przewodzenie ciepła przez przewody od spoiny do złączy zimnych — w tym modelu pominięte (temperatury złączy są termostatowane). Materiały o dużej dobroci ZT i moduły Peltiera pokaże poziom Pro.</p>

  <h3>6. Założenia modelu</h3>
  <ul class=&quot;note&quot;>
    <li>Temperatury T₀ i Tₓ ustalone (termostaty); brak przewodzenia ciepła i ogrzewania przewodów prądem.</li>
    <li>E(T) i α(T) z funkcji referencyjnych NIST ITS-90 <span class=&quot;ref&quot;>[1]</span> — te same co w zakładce „Symulator pomiaru”.</li>
    <li>Rezystywności przy 20 °C, niezależne od temperatury <span class=&quot;ref&quot;>[6][7][8]</span>; rezystancja przewodów Cu i miernika pominięta.</li>
  </ul>

  <h3>Źródła</h3>
  <ol class=&quot;note&quot;>
    <li>G. W. Burns, M. G. Scroger, G. F. Strouse, M. C. Croarkin, W. F. Guthrie, <i>Temperature-electromotive force reference functions and tables for the letter-designated thermocouple types based on the ITS-90</i>, NIST Monograph 175, NIST, Gaithersburg 1993. <a href=&quot;https://doi.org/10.6028/NIST.MONO.175&quot; target=&quot;_blank&quot;>doi:10.6028/NIST.MONO.175</a></li>
    <li>J. C. A. Peltier, „Nouvelles expériences sur la caloricité des courants électriques”, <i>Annales de Chimie et de Physique</i> 56 (1834) 371–386.</li>
    <li>W. Thomson, „On a mechanical theory of thermo-electric currents”, <i>Proceedings of the Royal Society of Edinburgh</i> 3 (1851, wyd. 1857) 91–98. <a href=&quot;https://doi.org/10.1017/S0370164600027310&quot; target=&quot;_blank&quot;>doi:10.1017/S0370164600027310</a></li>
    <li>M. Wagner, <i>Simulation of Thermoelectric Devices</i>, rozprawa doktorska, TU Wien — rozdz. o relacjach Kelvina. <a href=&quot;https://iue.tuwien.ac.at/phd/mwagner/node17.html&quot; target=&quot;_blank&quot;>iue.tuwien.ac.at</a></li>
    <li>H. B. Callen, <i>Thermodynamics and an Introduction to Thermostatistics</i>, wyd. 2, Wiley, New York 1985 — termodynamika procesów nieodwracalnych, efekty termoelektryczne.</li>
    <li>Omega Engineering, <i>Thermocouple Technical Reference</i>, s. Z-49 (rezystywność stopów termoparowych). <a href=&quot;https://it.omega.com/temperature/Z/pdf/z049-050.pdf&quot; target=&quot;_blank&quot;>omega.com</a></li>
    <li>Kanthal, karta materiałowa <i>Nicrosil</i> (drut termoparowy). <a href=&quot;https://www.kanthal.com/en/products/material-datasheets/wire/thermocouple-wire/nicrosil/&quot; target=&quot;_blank&quot;>kanthal.com</a></li>
    <li>Kanthal, karta materiałowa <i>Nisil</i> (drut termoparowy). <a href=&quot;https://www.kanthal.com/products/datasheets/material-datasheets/wire/thermocouple-wire/nisil/&quot; target=&quot;_blank&quot;>kanthal.com</a></li>
  </ol>`;
}

  exp:'Q̇ = Π·I jest liniowe w prądzie — zjawisko odwracalne. I²R jest zawsze dodatnie. Dlatego zasilając termoparę z zewnątrz w przeciwną stronę, spoinę gorącą można dodatkowo podgrzewać — na tym polega praca modułu Peltiera (poziom Pro).'},
 {topic:'Bilans energii',
  q:'Dlaczego Π(T<sub>x</sub>)·I − Π(T<sub>0</sub>)·I nie jest dokładnie równe mocy elektrycznej E·I?',
  opts:['Część ciepła wymieniają przewody — efekt Thomsona, bo α zależy od temperatury','Symulator zaokrągla wyniki','Brakuje ciepła Joule’a w przewodach Cu','Bo napięcia kontaktowe się nie sumują do zera'], a:0,
  exp:'Pełny bilans: Π(T<sub>x</sub>)I − Π(T<sub>0</sub>)I + Q<sub>Th</sub> = E·I. Gdyby α było stałe, Q<sub>Th</sub> = 0. Dla rzeczywistych termopar α(T) się zmienia (II relacja Kelvina: μ<sub>A</sub> − μ<sub>B</sub> = T·dα/dT), więc Q<sub>Th</sub> ≠ 0 — porównaj słupek „Thomson” dla K i S.',
  setup:()=>quizSet({type:'S',Tx:900,T0:20})},
 {topic:'Pomiar a efekty cieplne',
  q:'Dlaczego woltomierz do pomiaru SEM termopary powinien mieć bardzo dużą rezystancję wejściową?',

/* ── QUIZ — pytania sprawdzające (wspólny moduł) ─────────────── */
const Quiz=(()=>{
  let order=[],perm=[],i=0,score=0,answered=false,picked=-1;
  const $=id=>document.getElementById(id);
  const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;};
  function start(){order=shuffle(QUIZ_Q.map((_,k)=>k));i=0;score=0;answered=false;newPerm();}
  function newPerm(){const q=QUIZ_Q[order[i]];perm=q?shuffle(q.opts.map((_,k)=>k)):[];picked=-1;}
  function open(){if(!order.length)start();$('qzBack').style.display='none';$('quizOv').classList.add('open');render();}
  function close(){$('quizOv').classList.remove('open');}
  function render(){
    const body=$('qzBody'), n=QUIZ_Q.length;
    if(i>=n){
      const pct=Math.round(score/n*100);
      const msg=pct>=90?'Świetnie — materiał opanowany.':pct>=70?'Dobrze — przejrzyj wyjaśnienia pytań z błędami.':pct>=50?'Połowicznie — wróć do zakładki 📖 Teoria i spróbuj ponownie.':'Warto jeszcze raz przejść przez Teorię i poeksperymentować z symulatorem.';
      $('qzProg').textContent=`${n}/${n}`;
      body.innerHTML=`<div class=&quot;qz-sum&quot;><div class=&quot;qz-score&quot;>${score} / ${n}</div><div class=&quot;qz-pct&quot;>${pct} %</div><p>${msg}</p>
        <button class=&quot;qz-btn qz-pri&quot; onclick=&quot;Quiz.restart()&quot;>↻ Od nowa (nowa kolejność)</button></div>`;
      return;
    }
    const q=QUIZ_Q[order[i]];
    $('qzProg').textContent=`${i+1}/${n} · wynik ${score}`;
    const opts=perm.map((k,pos)=>{
      let cls='qz-opt';
      if(answered){ if(k===q.a) cls+=' ok'; else if(pos===picked) cls+=' bad'; else cls+=' dim'; }
      return `<button class=&quot;${cls}&quot; ${answered?'disabled':''} onclick=&quot;Quiz.answer(${pos})&quot;><span class=&quot;qz-l&quot;>${'ABCD'[pos]}</span>${q.opts[k]}</button>`;
    }).join('');
    const fb=answered?`<div class=&quot;qz-fb ${perm[picked]===q.a?'ok':'bad'}&quot;><b>${perm[picked]===q.a?'✓ Dobrze.':'✗ Niestety nie.'}</b> ${q.exp}</div>`:'';
    body.innerHTML=`<div class=&quot;qz-topic&quot;>${q.topic}</div><p class=&quot;qz-q&quot;>${q.q}</p><div class=&quot;qz-opts&quot;>${opts}</div>${fb}
      <div class=&quot;qz-nav&quot;>${q.setup?`<button class=&quot;qz-btn&quot; onclick=&quot;Quiz.tryIt()&quot; title=&quot;Ustawia scenariusz pytania w symulatorze&quot;>🔬 Sprawdź w symulatorze</button>`:''}
      <button class=&quot;qz-btn qz-pri&quot; ${answered?'':'disabled'} onclick=&quot;Quiz.next()&quot;>${i+1<n?'Dalej →':'Wynik'}</button></div>`;
  }
  function answer(pos){if(answered)return;answered=true;picked=pos;if(perm[pos]===QUIZ_Q[order[i]].a)score++;render();}
  function next(){i++;answered=false;if(i<QUIZ_Q.length)newPerm();render();}
  function tryIt(){const q=QUIZ_Q[order[i]];if(q&amp;&amp;q.setup)q.setup();close();$('qzBack').style.display='block';}
  function restart(){start();render();}
  return {open,close,answer,next,tryIt,restart};
})();

</script>

<script>
let cur=0, isDark=true;

function sw(i){
  if(i===cur)return; cur=i;
  [0,1,2].forEach(j=>{
    document.getElementById('tab'+j).classList.toggle('active',j===i);
    document.getElementById('f'+j).classList.toggle('visible',j===i);
  });
  syncFrames();
}

// Aktywność zakładek (ukryta wstrzymuje animację) i motyw — do obu ramek
function syncFrames(){
  [0,1,2].forEach(j=>{
    const w=document.getElementById('f'+j).contentWindow; if(!w) return;
    w.postMessage({type:'setActive',active:j===cur},'*');
    w.postMessage({type:'setTheme',dark:isDark},'*');
  });
}
['f0','f1','f2'].forEach(id=>document.getElementById(id).addEventListener('load',syncFrames));
window.addEventListener('load',syncFrames);

function toggleTheme(){
  isDark=!isDark;
  const btn=document.getElementById('themeBtn');
  btn.textContent=isDark?'☀️ Jasny':'🌙 Ciemny';
  btn.classList.toggle('light',!isDark);
  // Wyślij do wszystkich iframes
  const msg={type:'setTheme',dark:isDark};
  ['f0','f1','f2'].forEach(id=>document.getElementById(id).contentWindow.postMessage(msg,'*'));
}
</script>
