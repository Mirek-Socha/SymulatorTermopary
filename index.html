const MAT={
  K:{A:{name:'Chromel',alpha:22, c:'#f59e0b'},B:{name:'Alumel', alpha:-18,c:'#06b6d4'}},
  J:{A:{name:'Żelazo', alpha:18, c:'#ef4444'},B:{name:'Konst.', alpha:-38,c:'#a855f7'}},
  T:{A:{name:'Miedź',  alpha:1.8,c:'#22c55e'},B:{name:'Konst.', alpha:-38,c:'#a855f7'}},
  E:{A:{name:'Chromel',alpha:22, c:'#f59e0b'},B:{name:'Konst.', alpha:-38,c:'#a855f7'}},
};

/* ── STATE ── */
const S={type:'K',Tx:300,T0:20,N:30,srcKind:'none',srcPos:0.5,srcDT:200};

function setState(k,v){S[k]=v; needDraw=true;}
function setSrc(kind){
  S.srcKind=kind;
  document.querySelectorAll('.sk-btn').forEach(b=>b.classList.toggle('active',b.dataset.k===kind));
  g('srcCtrls').style.display=(kind==='none')?'none':'flex';
  needDraw=true;
}
function slPct(el){
  const mn=+el.min,mx=+el.max,v=+el.value;
  el.style.setProperty('--pct',((v-mn)/(mx-mn)*100)+'%');
}

/* ── PHYSICS ── */
const SIGMA=0.075;
function Tp(x,affected){
  const lin=S.T0+(S.Tx-S.T0)*x;
  if(!affected||S.srcKind==='none') return lin;
  const sign=S.srcKind.endsWith('-')?-1:1;
  return lin + sign*S.srcDT*Math.exp(-Math.pow(x-S.srcPos,2)/(2*SIGMA*SIGMA));
}
const affA=()=>S.srcKind.startsWith('A')||S.srcKind.startsWith('AB');
const affB=()=>S.srcKind.startsWith('B')||S.srcKind.startsWith('AB');

function computeSegs(){
  const m=MAT[S.type],N=S.N;
  const aA=affA(),aB=affB();
  const segs=[]; let cA=0,cB=0;
  for(let i=0;i<N;i++){
    const x1=i/N,x2=(i+1)/N,xm=(x1+x2)/2;
    const dTA=Tp(x2,aA)-Tp(x1,aA);
    const dTB=Tp(x2,aB)-Tp(x1,aB);
    const TAm=Tp(xm,aA), TBm=Tp(xm,aB);
    const dVA=m.A.alpha*dTA, dVB=m.B.alpha*dTB;
    cA+=dVA; cB+=dVB;
    segs.push({i,xm,x1,x2,TAm,TBm,dTA,dTB,dVA,dVB,cA,cB});
  }
  const emf=cA-cB;
  const emfNom=(m.A.alpha-m.B.alpha)*(S.Tx-S.T0);
  return {segs,emfA:cA,emfB:cB,emf,emfNom};
}

/* ── CANVAS HELPERS ── */
function rszC(c){
  const dpr=DPR;
  // Zbierz wysokość ze wszystkich dostępnych źródeł
  let w=c.offsetWidth||c.clientWidth||0;
  let h=c.offsetHeight||c.clientHeight||0;
  // Fallback: computed min-height z CSS
  if(h<8){
    const cs=getComputedStyle(c);
    const mh=parseFloat(cs.minHeight)||0;
    const ph=c.parentElement?(c.parentElement.clientHeight-24):0;
    h=Math.max(mh,ph,80);
  }
  if(w<8) w=c.parentElement?.clientWidth||400;
  // Zawsze ustaw canvas na prawidłowy rozmiar
  const nw=Math.round(w*dpr), nh=Math.round(h*dpr);
  if(c.width!==nw||c.height!==nh){
    c.width=nw; c.height=nh;
    c.getContext('2d').scale(dpr,dpr);
  }
  return[c.getContext('2d'),w,h];
}
function tempColor(T){
  const lo=Math.min(S.T0,0), hi=Math.max(S.Tx,400);
  const t=Math.max(0,Math.min(1,(T-lo)/(hi-lo)));
  const r=Math.round(40+200*t), gr=Math.round(100*(1-t)), b=Math.round(220-200*t);
  return `rgb(${r},${gr},${b})`;
}
function gridLines(ctx,pL,pT,W2,H2,col,dash){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=.5;if(dash)ctx.setLineDash([2,4]);
  ctx.beginPath();ctx.rect(pL,pT,W2,H2);ctx.clip();
  ctx.restore();ctx.setLineDash([]);
}

/* ── DRAW CIRCUIT ── */
// ── CANVAS ELEMENTY ──────────────────────────────────────────
const cCirc=g('cCirc'); // cTemp/cSegs/cVolt deklarowane przy swoich funkcjach draw

// ── POMOCNICZE: arc-length i CDF (poza drawCircuit — strict mode wymaga) ──
const wirePts=(y,n)=>{
  const pts=[];
  for(let i=0;i<=n;i++) pts.push({x:0,y}); // x uzupełniany w drawCircuit
  return pts;
};
const arcLenFn=pts=>{
  const al=[0];
  for(let i=1;i<pts.length;i++){
    const dx=pts[i].x-pts[i-1].x, dy=pts[i].y-pts[i-1].y;
    al.push(al[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  return al;
};
const ptAtS=(pts,al,s)=>{
  s=Math.max(0,Math.min(1,s));
  const total=al[al.length-1];
  if(total===0) return pts[0];
  const target=s*total;
  let idx=0;
  while(idx<al.length-2&amp;&amp;al[idx+1]<target) idx++;
  if(idx>=pts.length-1) return pts[pts.length-1];
  const f=al[idx+1]>al[idx]?(target-al[idx])/(al[idx+1]-al[idx]):0;
  return{x:pts[idx].x+f*(pts[idx+1].x-pts[idx].x),
         y:pts[idx].y+f*(pts[idx+1].y-pts[idx].y)};
};

function drawCircuit(animT){
  const [ctx,W,H]=rszC(cCirc);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=tv('--bg');ctx.fillRect(0,0,W,H);
  const m=MAT[S.type];
  const N=S.N;

  /*
   * Poprawiona topologia — zgodna z wykresami T(x) i V(x):
   *
   *   T₀ = LEWA (zimny koniec, woltomierz)
   *   Tₓ = PRAWA (gorący koniec, spoina gorąca)
   *
   *  [V] ──── A (Chromel) ──────────────● T₂
   *                                      | spoina gorąca
   *  [V] ──── B (Alumel)  ──────────────● T₁
   */

  const vX  = Math.round(W*.13);   // woltomierz (LEWA = T₀)
  const sX  = Math.round(W*.87);   // spoina gorąca (PRAWA = Tₓ)
  const yA  = Math.round(H*.28);
  const yB  = Math.round(H*.72);
  const wH  = Math.max(18, Math.round(H*.055));
  const vmR = Math.round(Math.min(W,H)*.1);
  const vmCY= (yA+yB)/2;
  const fs  = Math.max(10, Math.round(W*.011)); // skalowana czcionka canvas

  // ── TŁO gradient temp: zimno (lewa) → gorąco (prawa) ──
  const tbg=ctx.createLinearGradient(vX,0,sX,0);
  tbg.addColorStop(0,'rgba(59,130,246,.06)');
  tbg.addColorStop(1,'rgba(239,68,68,.10)');
  ctx.fillStyle=tbg; ctx.fillRect(vX,H*.08,sX-vX,H*.84);

  // ── ŹRÓDŁO ZEWNĘTRZNE ──
  if(S.srcKind!=='none'){
    const sx=vX+(sX-vX)*S.srcPos;
    const isHot=S.srcKind.endsWith('+');
    const glowCol=isHot?'rgba(239,68,68,.55)':'rgba(59,130,246,.55)';
    const pulse=.7+.3*Math.sin(animT*3);
    ctx.save();
    ctx.shadowColor=glowCol; ctx.shadowBlur=18*pulse;
    ctx.strokeStyle=isHot?'rgba(239,68,68,.6)':'rgba(59,130,246,.6)';
    ctx.lineWidth=2; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(sx,H*.06); ctx.lineTo(sx,H*.94); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    ctx.font='20px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const ey=S.srcKind.startsWith('B')&amp;&amp;!S.srcKind.startsWith('AB')?yB+34:yA-32;
    ctx.fillText(isHot?'🔥':'❄️',sx,ey);
    if(S.srcKind.startsWith('AB'))ctx.fillText(isHot?'🔥':'❄️',sx,yB+34);
    ctx.fillStyle=isHot?'#ef4444':'#3b82f6';
    ctx.font=`bold ${fs}px IBM Plex Mono,monospace`;
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText((isHot?'+':'-')+S.srcDT+'°C',sx,H*.04);
  }

  // ── KRESKA podziałów segmentów ──
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=.5;
  for(let i=1;i<N;i++){
    const x=vX+(sX-vX)*i/N;
    ctx.beginPath(); ctx.moveTo(x,yA-wH/2); ctx.lineTo(x,yA+wH/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,yB-wH/2); ctx.lineTo(x,yB+wH/2); ctx.stroke();
  }

  // ── ELEKTRODA A — segmenty ──
  for(let i=0;i<N;i++){
    const x1=vX+(sX-vX)*i/N, x2=vX+(sX-vX)*(i+1)/N;
    const T=Tp((i+.5)/N,affA());
    ctx.fillStyle=blendColor(m.A.c,tempColor(T),.3);
    const r=i===0?[4,0,0,4]:i===N-1?[0,4,4,0]:0;
    ctx.beginPath(); ctx.roundRect(x1,yA-wH/2,x2-x1+.5,wH,r); ctx.fill();
  }
  const hlA=ctx.createLinearGradient(vX,yA-wH/2,vX,yA);
  hlA.addColorStop(0,'rgba(255,255,255,.13)'); hlA.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hlA; ctx.beginPath(); ctx.roundRect(vX,yA-wH/2,sX-vX,wH/2,[4,4,0,0]); ctx.fill();

  // ── ELEKTRODA B — segmenty ──
  for(let i=0;i<N;i++){
    const x1=vX+(sX-vX)*i/N, x2=vX+(sX-vX)*(i+1)/N;
    const T=Tp((i+.5)/N,affB());
    ctx.fillStyle=blendColor(m.B.c,tempColor(T),.3);
    const r=i===0?[4,0,0,4]:i===N-1?[0,4,4,0]:0;
    ctx.beginPath(); ctx.roundRect(x1,yB-wH/2,x2-x1+.5,wH,r); ctx.fill();
  }
  const hlB=ctx.createLinearGradient(vX,yB-wH/2,vX,yB);
  hlB.addColorStop(0,'rgba(255,255,255,.10)'); hlB.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hlB; ctx.beginPath(); ctx.roundRect(vX,yB-wH/2,sX-vX,wH/2,[4,4,0,0]); ctx.fill();

  // ── ELEKTRONY — gęstość wzdłuż przewodnika ──
  // x=0 → woltomierz (T₀, zimny lewa), x=1 → spoina (Tₓ, gorący prawa)
  // α>0 (Chromel): n wysokie przy x=0 (T₀, lewa)
  // α<0 (Alumel):  n wysokie przy x=1 (Tₓ, prawa)
  const nDotsTot=110, STEPS=80;

  const localDensity=(xNorm,alphaMat,affFn)=>{
    const Tlocal=Tp(xNorm,affFn);
    const Tmin_=Math.min(S.T0,S.Tx);
    const Tmax_=Math.max(S.T0,S.Tx,Tlocal);
    const Tnorm=(Tlocal-Tmin_)/Math.max(1,Tmax_-Tmin_);
    // α>0: gęstość wysoka przy zimnym (Tnorm=0) → base=1-Tnorm
    const base=alphaMat>=0?(1-Tnorm):Tnorm;
    return Math.max(0.05,0.12+base*0.88);
  };

  for(const [wire,alphaMat,yW,affFn,col] of [
      ['A',m.A.alpha,yA,affA(),m.A.c],
      ['B',m.B.alpha,yB,affB(),m.B.c]
  ]){
    // CDF: i/STEPS ∈ [0,1] odpowiada x w Tp (0=T₀/lewa, 1=Tₓ/prawa)
    const densArr=[]; let densSum=0;
    for(let i=0;i<=STEPS;i++){
      const d=localDensity(i/STEPS,alphaMat,affFn); // bez 1-x !
      densArr.push(d); densSum+=d;
    }
    const cdf=[0];
    for(let i=0;i<densArr.length;i++) cdf.push(cdf[i]+densArr[i]/densSum);

    const invCDF=u=>{
      let lo=0,hi=STEPS;
      while(lo<hi){const mid=(lo+hi)>>1; if(cdf[mid+1]<u)lo=mid+1; else hi=mid;}
      const t=(u-cdf[lo])/(cdf[lo+1]-cdf[lo]||1);
      return Math.max(0,Math.min(1,(lo+t)/STEPS));
    };

    const pts=[];
    for(let i=0;i<=STEPS;i++) pts.push({x:vX+(sX-vX)*i/STEPS, y:yW});
    const al=arcLenFn(pts);

    for(let k=0;k<nDotsTot;k++){
      const u=(k+0.5)/nDotsTot;
      const s=invCDF(u);
      const pt=ptAtS(pts,al,s);
      const seed=(k*73+wire.charCodeAt(0)*11)&amp;0x3ff;
      const fy=(seed%100)/100;
      const px=pt.x, py=yW-wH/2+3+fy*(wH-6);
      const dens=localDensity(s,alphaMat,affFn); // też bez 1-s
      const rr=1.2+dens*2.0, opacity=0.45+dens*0.5;
      let pulse=1;
      if(S.srcKind!=='none'){
        const sx=vX+(sX-vX)*S.srcPos;
        const sig=(sX-vX)*0.07;
        if(Math.abs(px-sx)<sig*3){
          pulse=0.6+0.7*Math.abs(Math.sin(animT*(S.srcKind.endsWith('+')?4.5:2.5)+k*0.4));
        }
      }
      const grd=ctx.createRadialGradient(px,py,0,px,py,rr*1.7);
      const isDark=!document.body.classList.contains('light');
      grd.addColorStop(0,isDark?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.98)');
      grd.addColorStop(0.35,hexToRgba(col,0.9));
      grd.addColorStop(1,hexToRgba(col,0));
      ctx.globalAlpha=opacity*pulse;
      ctx.beginPath(); ctx.arc(px,py,rr*1.7,0,Math.PI*2);
      ctx.fillStyle=grd; ctx.fill();
      ctx.globalAlpha=(0.7+dens*0.3)*pulse;
      ctx.beginPath(); ctx.arc(px,py,rr*0.45,0,Math.PI*2);
      ctx.fillStyle=isDark?'rgba(220,230,255,0.95)':'rgba(255,255,255,0.98)'; ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // ── SPOINA GORĄCA (prawa = Tₓ) ──
  ctx.strokeStyle='#ef4444'; ctx.lineWidth=3.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(sX,yA); ctx.lineTo(sX,yB); ctx.stroke();
  ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(sX,yA,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=tv('--bg'); ctx.beginPath(); ctx.arc(sX,yA,2.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(sX,yB,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=tv('--bg'); ctx.beginPath(); ctx.arc(sX,yB,2.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ef4444'; ctx.font=`bold ${fs+2}px IBM Plex Mono,monospace`;
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('T₂',sX+10,yA); ctx.fillText('T₁',sX+10,yB);
  ctx.fillStyle=tv('--muted'); ctx.font=`${fs}px IBM Plex Mono`;
  ctx.fillText('Tₓ='+S.Tx+'°C',sX+10,vmCY);

  // ── WOLTOMIERZ (lewa = T₀) ──
  ctx.strokeStyle='#a16207'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(vX,yA); ctx.lineTo(vX,vmCY-vmR); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(vX,yB); ctx.lineTo(vX,vmCY+vmR); ctx.stroke();
  ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(vX,yA,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#06b6d4'; ctx.beginPath(); ctx.arc(vX,yB,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=tv('--card'); ctx.strokeStyle=tv('--muted'); ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(vX,vmCY,vmR,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=tv('--text'); ctx.font=`bold ${Math.round(vmR*.9)}px IBM Plex Mono,monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('V',vX,vmCY-vmR*.12);
  ctx.fillStyle='#ef4444'; ctx.font=`bold ${fs+2}px IBM Plex Mono`;
  ctx.textAlign='right'; ctx.textBaseline='middle';
  ctx.fillText('+',vX-vmR-5,vmCY-vmR*.5);
  ctx.fillStyle='#3b82f6';
  ctx.fillText('−',vX-vmR-5,vmCY+vmR*.5);
  const {emf}=computeSegs();
  ctx.fillStyle='#f59e0b'; ctx.font=`bold ${Math.round(vmR*.45)}px IBM Plex Mono,monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText((emf/1000).toFixed(3)+' mV',vX,vmCY+vmR*.38);

  // ── ETYKIETY materiałów i znaków ──
  const aA_alpha=m.A.alpha, aB_alpha=m.B.alpha;
  // Polaryzacja: T₀(lewa)=zimny; α>0 → + przy zimnym (lewa vX)
  drawSign(ctx,vX+16,yA,aA_alpha>=0?'+':'−',m.A.c);
  drawSign(ctx,sX-16,yA,aA_alpha>=0?'−':'+',m.A.c);
  drawSign(ctx,vX+16,yB,aB_alpha>=0?'+':'−',m.B.c);
  drawSign(ctx,sX-16,yB,aB_alpha>=0?'−':'+',m.B.c);

  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillStyle=m.A.c; ctx.font=`bold ${fs}px IBM Plex Sans,sans-serif`;
  ctx.fillText('A: '+m.A.name+'  αA='+m.A.alpha+' µV/°C',(vX+sX)/2,yA-wH/2-4);
  ctx.textBaseline='top'; ctx.fillStyle=m.B.c;
  ctx.fillText('B: '+m.B.name+'  αB='+m.B.alpha+' µV/°C',(vX+sX)/2,yB+wH/2+4);

  // ── LEGENDA + T₀ label ──
  ctx.fillStyle='#3b82f6'; ctx.font=`bold ${fs+1}px IBM Plex Mono,monospace`;
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('T₀='+S.T0+'°C',vX,yA-wH/2-18);
  ctx.fillStyle=tv('--muted'); ctx.font=`${fs-1}px IBM Plex Sans,sans-serif`;
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('● gęstość e⁻: α>0 → więcej przy T₀  |  α<0 → więcej przy Tₓ',vX+4,H*.91);
}

function drawSign(ctx,x,y,s,c){
  ctx.fillStyle=c; ctx.font='bold 15px IBM Plex Mono,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(s,x,y);
}

/* ── DRAW TEMPERATURE PROFILE ── */
const cTemp=g('cTemp');
function drawTemp(){
  const [ctx,W,H]=rszC(cTemp);
  ctx.clearRect(0,0,W,H); ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  const pL=55,pR=W-15,pT=14,pB=28;
  const cw=pR-pL,ch=H-pT-pB;
  ctx.fillStyle=tv('--surf'); ctx.fillRect(pL,pT,cw,ch);

  const m=MAT[S.type];
  const aA=affA(),aB=affB();
  const pts=80;

  // Determine T range
  let Tmin=S.T0-20, Tmax=S.Tx+20;
  for(let i=0;i<=pts;i++){const x=i/pts;Tmax=Math.max(Tmax,Tp(x,aA),Tp(x,aB));Tmin=Math.min(Tmin,Tp(x,aA),Tp(x,aB));}
  const Tpad=(Tmax-Tmin)*.08;
  Tmin-=Tpad; Tmax+=Tpad;

  const xp=x=>pL+x*cw;
  const tp=T=>pT+ch-(T-Tmin)/(Tmax-Tmin)*ch;

  // Grid
  ctx.strokeStyle=tv('--border'); ctx.lineWidth=.5;
  [S.T0,S.Tx].forEach(T=>{
    ctx.setLineDash([2,4]); ctx.strokeStyle='#2d2d3d';
    ctx.beginPath(); ctx.moveTo(pL,tp(T)); ctx.lineTo(pR,tp(T)); ctx.stroke();
    ctx.setLineDash([]);
  });

  // Source position line
  if(S.srcKind!=='none'){
    ctx.strokeStyle='rgba(239,68,68,.35)'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(xp(S.srcPos),pT); ctx.lineTo(xp(S.srcPos),pT+ch); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Segment markers
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=.4;
  for(let i=1;i<S.N;i++){
    ctx.beginPath(); ctx.moveTo(xp(i/S.N),pT); ctx.lineTo(xp(i/S.N),pT+ch); ctx.stroke();
  }

  // Clip to plot area
  ctx.save(); ctx.beginPath(); ctx.rect(pL,pT,cw,ch); ctx.clip();

  // Draw wire temperature profiles
  for(const [wire,aff,col] of [['A',aA,m.A.c],['B',aB,m.B.c]]){
    // Fill under curve
    ctx.beginPath();
    ctx.moveTo(xp(0),tp(Tmin));
    for(let i=0;i<=pts;i++) ctx.lineTo(xp(i/pts),tp(Tp(i/pts,aff)));
    ctx.lineTo(xp(1),tp(Tmin)); ctx.closePath();
    ctx.fillStyle=col.replace('#','')==='f59e0b'?'rgba(245,158,11,.07)':col==='#06b6d4'?'rgba(6,182,212,.07)':col==='#a855f7'?'rgba(168,85,247,.07)':'rgba(34,197,94,.07)';
    ctx.fill();
    // Line
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath();
    for(let i=0;i<=pts;i++){const xv=i/pts; i===0?ctx.moveTo(xp(xv),tp(Tp(xv,aff))):ctx.lineTo(xp(xv),tp(Tp(xv,aff)));}
    ctx.stroke();
  }

  // Dots at segment midpoints
  for(let i=0;i<S.N;i++){
    const xm=(i+.5)/S.N;
    [['A',aA,m.A.c],['B',aB,m.B.c]].forEach(([,aff,col])=>{
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(xp(xm),tp(Tp(xm,aff)),2.5,0,Math.PI*2); ctx.fill();
    });
  }
  ctx.restore(); // end clip

  // Labels
  ctx.fillStyle=tv('--muted'); ctx.font='8.5px IBM Plex Mono,monospace';
  ctx.textAlign='right'; ctx.textBaseline='middle';
  ctx.fillText(S.T0+'°C',pL-2,tp(S.T0));
  ctx.fillText(S.Tx+'°C',pL-2,tp(S.Tx));

  ctx.fillStyle='#3b82f6'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.font='12px IBM Plex Mono,monospace';
  ctx.fillText('T₀',xp(0),pT+ch+3);
  ctx.fillStyle='#ef4444'; ctx.fillText('Tₓ',xp(1),pT+ch+3);

  // Legend
  const m2=MAT[S.type];
  [[m2.A.c,'A: '+m2.A.name],[m2.B.c,'B: '+m2.B.name]].forEach(([col,lbl],i)=>{
    ctx.fillStyle=col; ctx.font='11px IBM Plex Sans,sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('●'+lbl,pL+4+i*100,pT+2);
  });

  // Y axis title
  ctx.save(); ctx.translate(9,pT+ch/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle=tv('--muted'); ctx.font='12px IBM Plex Sans,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('T [°C]',0,0); ctx.restore();

  ctx.strokeStyle=tv('--border'); ctx.lineWidth=1; ctx.strokeRect(pL,pT,cw,ch);
}

/* ── DRAW SEGMENT BARS ── */
const cSegs=g('cSegs');
function drawSegs(){
  const [ctx,W,H]=rszC(cSegs);
  ctx.clearRect(0,0,W,H); ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);

  const {segs,emfA,emfB,emf,emfNom}=computeSegs();
  const m=MAT[S.type];
  const N=S.N;

  const pL=58,pR=W-12,pT=14,pB=20;
  const cw=pR-pL,ch=H-pT-pB;
  // Two halves: A on top, B on bottom
  const halfH=ch/2-4;
  const yA_mid=pT+halfH/2, yB_mid=pT+halfH+8+halfH/2;
  const yA_zero=pT+halfH, yB_zero=pT+halfH+8+halfH;

  ctx.fillStyle=tv('--surf'); ctx.fillRect(pL,pT,cw,halfH);
  ctx.fillStyle=tv('--card'); ctx.fillRect(pL,pT+halfH+8,cw,halfH);

  // Środek każdej połówki = linia zerowa
  const yA0 = pT + halfH/2;          // zero A (środek górnej połówki)
  const yB0 = pT + halfH + 8 + halfH/2; // zero B (środek dolnej połówki)
  const barScale = halfH/2 * 0.88;   // max wysokość słupka [px]

  // Find max |dV| for scale
  let maxDV=1;
  segs.forEach(s=>{maxDV=Math.max(maxDV,Math.abs(s.dVA),Math.abs(s.dVB));});

  const barW=(cw/N)*0.65;
  const xSeg=i=>pL+(i+.5)*cw/N;

  // Clip dokładnie do obszarów słupków
  ctx.save();
  ctx.beginPath();
  ctx.rect(pL, pT, cw, halfH);          // górna połówka A
  ctx.rect(pL, pT+halfH+8, cw, halfH);  // dolna połówka B
  ctx.clip();

  // Zero lines (środek każdej połówki)
  ctx.strokeStyle=tv('--border2')||'#2d2d3d'; ctx.lineWidth=.8;
  ctx.beginPath(); ctx.moveTo(pL,yA0); ctx.lineTo(pR,yA0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pL,yB0); ctx.lineTo(pR,yB0); ctx.stroke();

  // Bars
  segs.forEach(s=>{
    const xi=xSeg(s.i)-barW/2;

    // Wire A: słupek od środka (yA0) w górę (dodatni) lub dół (ujemny)
    const hA = Math.min((s.dVA/maxDV)*barScale, barScale);
    const absHA = Math.abs(hA);
    if(absHA > 0.5){
      ctx.fillStyle = hA >= 0 ? m.A.c : 'rgba(239,68,68,.8)';
      const yTop = hA >= 0 ? yA0 - absHA : yA0;
      ctx.beginPath(); ctx.roundRect(xi, yTop, barW, absHA, 1.5); ctx.fill();
    }

    // Wire B: słupek od środka (yB0)
    const hB = Math.min((s.dVB/maxDV)*barScale, barScale);
    const absHB = Math.abs(hB);
    if(absHB > 0.5){
      ctx.fillStyle = hB >= 0 ? m.B.c : 'rgba(239,68,68,.8)';
      const yTop = hB >= 0 ? yB0 - absHB : yB0;
      ctx.beginPath(); ctx.roundRect(xi, yTop, barW, absHB, 1.5); ctx.fill();
    }
  });

  ctx.restore(); // end clip

  // Source position indicator
  if(S.srcKind!=='none'){
    const sx=pL+S.srcPos*cw;
    ctx.strokeStyle='rgba(239,68,68,.5)'; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(sx,pT); ctx.lineTo(sx,pT+ch+8); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Σ labels
  ctx.font='bold 8px IBM Plex Mono,monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle=m.A.c; ctx.fillText('A: Σ='+emfA.toFixed(1)+'µV',pL+3,pT+2);
  ctx.fillStyle=m.B.c; ctx.fillText('B: Σ='+emfB.toFixed(1)+'µV',pL+3,pT+halfH+10);

  // EMF annotations
  const emfStr=(emf/1000).toFixed(3)+' mV';
  const nomStr=(emfNom/1000).toFixed(3)+' mV';
  const eq=Math.abs(emf-emfNom)<0.5;
  ctx.fillStyle=eq?'#22c55e':'#f59e0b';
  ctx.font='bold 9px IBM Plex Mono,monospace'; ctx.textAlign='right';
  ctx.fillText('SEM='+emfStr,pR-3,pT+2);
  if(!eq){
    ctx.fillStyle=tv('--muted');
    ctx.font='7.5px IBM Plex Mono,monospace';
    ctx.fillText('nom='+nomStr,pR-3,pT+12);
  }

  // Labels below
  ctx.fillStyle=tv('--muted'); ctx.font='7.5px IBM Plex Sans,monospace'; ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('[każdy słupek = α·ΔT dla jednego segmentu; ujemne = segment &quot;schodzi&quot; z piku]',pL+cw/2,pT+ch+10);

  // Y axis
  ctx.save(); ctx.translate(9,pT+halfH/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle=m.A.c; ctx.font='11px IBM Plex Sans'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('dVA [µV]',0,0); ctx.restore();
  ctx.save(); ctx.translate(9,pT+halfH+8+halfH/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle=m.B.c; ctx.font='11px IBM Plex Sans'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('dVB [µV]',0,0); ctx.restore();

  ctx.strokeStyle=tv('--border'); ctx.lineWidth=.8;
  ctx.strokeRect(pL,pT,cw,halfH);
  ctx.strokeRect(pL,pT+halfH+8,cw,halfH);
}

/* ── DRAW VOLTAGE LANDSCAPE ── */
const cVolt=g('cVolt');
function drawVolt(){
  const [ctx,W,H]=rszC(cVolt);
  ctx.clearRect(0,0,W,H); ctx.fillStyle=tv('--bg'); ctx.fillRect(0,0,W,H);
  const {segs,emf,emfNom}=computeSegs();
  const m=MAT[S.type];
  const pL=58,pR=W-14,pT=14,pB=24;
  const cw=pR-pL,ch=H-pT-pB;
  ctx.fillStyle=tv('--surf'); ctx.fillRect(pL,pT,cw,ch);

  const vLo=Math.min(0,emf)-Math.abs(emf)*.12;
  const vHi=Math.max(0,emf)+Math.abs(emf)*.12;
  const vRange=vHi-vLo||100;
  const xp=x=>pL+x*cw;
  const vp=v=>pT+ch-(v-vLo)/vRange*ch;

  // Grid
  [0,emf].forEach(v=>{
    ctx.strokeStyle=v===0?'#2d2d3d':'rgba(245,158,11,.2)'; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(pL,vp(v)); ctx.lineTo(pR,vp(v)); ctx.stroke();
    ctx.setLineDash([]);
  });

  // Source position
  if(S.srcKind!=='none'){
    ctx.strokeStyle='rgba(239,68,68,.3)'; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(xp(S.srcPos),pT); ctx.lineTo(xp(S.srcPos),pT+ch); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Wire A and B voltage profiles (from segments)
  const vA=[],vB=[]; let cA=0,cB=0; vA.push([0,emf]); vB.push([0,0]);
  segs.forEach(s=>{cA+=s.dVA; cB+=s.dVB; vA.push([s.x2,emf-cA]); vB.push([s.x2,-cB]);});
  // Wait: vA should start at EMF (=cA total) and decrease per segment
  // Actually: at x=0, V_A=emf; at x=1, V_A=0 (since sum of segments = emf, V decreases)
  // Let's recompute: cumulative from right (starting at V_A(0)=emf, adding segments)
  const vA2=[],vB2=[]; let rA=emf,rB=0; vA2.push([0,rA]); vB2.push([0,rB]);
  segs.forEach(s=>{rA-=s.dVA; rB-=s.dVB; vA2.push([s.x2,rA]); vB2.push([s.x2,rB]);});

  // Fill between curves — clip first
  ctx.save(); ctx.beginPath(); ctx.rect(pL,pT,cw,ch); ctx.clip();

  ctx.beginPath(); ctx.moveTo(xp(0),vp(emf));
  vA2.forEach(([x,v])=>ctx.lineTo(xp(x),vp(v)));
  vB2.slice().reverse().forEach(([x,v])=>ctx.lineTo(xp(x),vp(v)));
  ctx.closePath(); ctx.fillStyle='rgba(245,158,11,.06)'; ctx.fill();

  // Draw A
  ctx.strokeStyle=m.A.c; ctx.lineWidth=2.2; ctx.beginPath();
  vA2.forEach(([x,v],i)=>i===0?ctx.moveTo(xp(x),vp(v)):ctx.lineTo(xp(x),vp(v)));
  ctx.stroke();

  // Draw B
  ctx.strokeStyle=m.B.c; ctx.lineWidth=2.2; ctx.beginPath();
  vB2.forEach(([x,v],i)=>i===0?ctx.moveTo(xp(x),vp(v)):ctx.lineTo(xp(x),vp(v)));
  ctx.stroke();

  // Endpoint dots
  [[0,emf,m.A.c],[0,0,m.B.c],[1,0,'#ef4444']].forEach(([xi,vi,col])=>{
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(xp(xi),vp(vi),5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=tv('--bg'); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(xp(xi),vp(vi),5,0,Math.PI*2); ctx.stroke();
  });

  ctx.restore(); // end plot clip

  // EMF bracket
  const bx=pL-13;
  ctx.strokeStyle='#f59e0b'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(bx,vp(0)); ctx.lineTo(bx,vp(emf)); ctx.stroke();
  [[bx,vp(emf),1],[bx,vp(0),-1]].forEach(([x,y,d])=>{
    ctx.beginPath(); ctx.moveTo(x-3,y+d*4); ctx.lineTo(x,y); ctx.lineTo(x+3,y+d*4); ctx.stroke();
  });
  ctx.fillStyle='#f59e0b'; ctx.font='bold 8px IBM Plex Mono,monospace';
  ctx.textAlign='right'; ctx.textBaseline='middle';
  ctx.fillText('SEM',(bx-4),(vp(0)+vp(emf))/2-6);
  ctx.fillText((emf/1000).toFixed(3)+'mV',(bx-4),(vp(0)+vp(emf))/2+6);

  // Axis labels
  ctx.fillStyle=tv('--muted'); ctx.font='8.5px IBM Plex Mono,monospace'; ctx.textAlign='right'; ctx.textBaseline='middle';
  ctx.fillText('0',pL-2,vp(0)); ctx.fillText((emf/1000).toFixed(2)+'mV',pL-2,vp(emf));
  ctx.fillStyle='#3b82f6'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.font='9px';
  ctx.fillText('T₀',xp(0),pT+ch+3); ctx.fillStyle='#ef4444'; ctx.fillText('Tₓ',xp(1),pT+ch+3);

  // Line labels
  ctx.fillStyle=m.A.c; ctx.font='11px IBM Plex Sans,monospace'; ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(m.A.name,xp(.55),vp(emf-((emf)*0.45))-3);
  ctx.fillStyle=m.B.c; ctx.textBaseline='top';
  ctx.fillText(m.B.name,xp(.55),vp(-((Math.abs(emf))*0.4))+3);

  ctx.save(); ctx.translate(9,pT+ch/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle=tv('--muted'); ctx.font='12px IBM Plex Sans'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('V [µV]',0,0); ctx.restore();

  ctx.strokeStyle=tv('--border'); ctx.lineWidth=1; ctx.strokeRect(pL,pT,cw,ch);
}

/* ── EXPLANATION ── */
function updateExpl(){
  const m=MAT[S.type];
  const aA=m.A.alpha, aB=m.B.alpha;
  const dT=S.Tx-S.T0;
  g('explDiv').innerHTML=`
  <h3>Prawo temperatur pośrednich (Kelvin, 1854)</h3>
  <p>SEM termopary zależy <span class=&quot;hi&quot;>wyłącznie</span> od temperatur przy obu końcach przewodów —
     nie od rozkładu temperatury pośredniej. Wynika to z teleskopowania sumy odcinków:</p>
  <div class=&quot;formula&quot;>SEM = Σ αA·ΔTᵢ − Σ αB·ΔTᵢ = αA·<b>(Tₓ−T₀)</b> − αB·<b>(Tₓ−T₀)</b></div>
  <p>Suma ΔTᵢ teleskopuje się: T(x₁)−T(x₀) + T(x₂)−T(x₁) + … = <b>Tₓ−T₀</b>. Pik temperatury daje pary słupków +/−, które się znoszą.</p>

  <h3>Świeczka pod elektrodą A — co widać na wykresach?</h3>
  <p>Segmenty przed pikiem: ΔT duże i <span class=&quot;hi&quot;>dodatnie</span> → słupki dVA wysokie.<br>
     Segmenty za pikiem: ΔT <span class=&quot;hi&quot;>ujemne</span> (temperatura opada) → słupki dVA ujemne.<br>
     Suma: całkowita SEM <span class=&quot;hi&quot;>niezmieniona</span> — woltomierz pokazuje to samo!</p>
  <div class=&quot;formula&quot;>ΔT niemonot. → Σ dVᵢ = αA·(Tₓ−T₀) = ${(aA*dT).toFixed(0)} µV [typ. A]</div>
  <p>Dlatego termopary działają niezawodnie nawet przy nierównym rozkładzie temperatury wzdłuż kabla.</p>

  <h3>Uwaga: dotyczy Seebecka objętościowego</h3>
  <p>Prawo to obowiązuje, gdy źródło pośrednie ogrzewa <b>oba przewody jednakowo</b> (np. oba leżą blisko świeczki) — wówczas ich dodatkowe wkłady się znoszą dokładnie.</p>
  <p>Natomiast gdy ciepło działa <b>tylko na jeden przewód</b>: αA i αB są różne → dodatkowe wkłady nie znoszą się → mimo teleskopowania sumy segmentów,
     <span class=&quot;hi&quot;>SEM pozostaje niezmieniona</span> (bo suma telesk. dotyczy każdego przewodu osobno).</p>

  <h3>Co zmienia pośrednie źródło ciepła?</h3>
  <p>Chociaż <b>SEM jest stała</b>, ogrzewanie pośrednie wpływa na:</p>
  <ul>
    <li>Lokalny <b>efekt Peltiera</b>: przepływ prądu przez gorący punkt powoduje dodatkowe chłodzenie/grzanie</li>
    <li><b>Rezystancja przewodów</b> rośnie z T → zmiana R<sub>tc</sub></li>
    <li><b>Czas odpowiedzi</b>: akumulacja ciepła spowalnia reakcję na zmiany T<sub>x</sub></li>
    <li>W warunkach <b>dużego prądu</b>: efekt Thomsona wzdłuż gorącego odcinka</li>
  </ul>

  <h3>Gęstość elektronów a efekt Seebecka</h3>
  <p>W obwodzie rozwartym nie płynie prąd — elektrony ulegają <b>dyfuzji termicznej</b>. W metalach z α&amp;gt;0 (np. Chromel) elektrony mają wyższą energię przy gorącym końcu i dyfundują ku zimnemu, tworząc nadmiar ładunku ujemnego przy T₀. Dla α&amp;lt;0 (np. Alumel) — odwrotnie. Różnica tych redystrybucji daje mierzalne napięcie SEM.</p>`;
}

/* ── RESULTS BAR ── */
function updateRbar(){
  const {emf,emfNom}=computeSegs();
  const eq=Math.abs(emf-emfNom)<0.5;
  const srcTxt=S.srcKind==='none'?'Brak':(S.srcKind.endsWith('+')?'🔥':'❄️')+' na '+S.srcKind.replace(/[+-]/,'')+(S.srcKind.startsWith('AB')?' obu':'');
  g('rbar').innerHTML=`
    <div class=&quot;rc&quot;>Typ: <span class=&quot;rv rv-src&quot;>${S.type}</span></div>
    <div class=&quot;rc&quot;>Źródło: <span class=&quot;rv rv-src&quot;>${srcTxt}${S.srcKind!=='none'?' x='+Math.round(S.srcPos*100)+'% ΔT='+S.srcDT+'°C':''}</span></div>
    <div class=&quot;rc&quot;>SEM (bez źródła): <span class=&quot;rv rv-src&quot;>${(emfNom/1000).toFixed(3)} mV</span></div>
    <div class=&quot;rc&quot;>SEM (ze źródłem): <span class=&quot;rv rv-src&quot;>${(emf/1000).toFixed(3)} mV</span></div>
    ${eq?`<div class=&quot;aha&quot;>✓ SEM niezmieniona! Prawo temp. pośrednich potwierdzone</div>`:
          `<div class=&quot;rc&quot; style=&quot;color:#f59e0b&quot;>Δ = ${((emf-emfNom)/1000).toFixed(4)} mV (błąd numeryczny segmentów)</div>`}`;
}

/* ── COLOR BLEND HELPER ── */
function hexToRgba(hex,a){
  const p=c=>{const h=c.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
  if(hex.startsWith('#')){const[r,g,b]=p(hex);return`rgba(${r},${g},${b},${a})`;}
  const m=hex.match(/rgb\((\d+),(\d+),(\d+)\)/);
  if(m)return`rgba(${m[1]},${m[2]},${m[3]},${a})`;
  return`rgba(128,128,128,${a})`;
}
function parseColor(s){
  if(s.startsWith('#')){
    const c=s.replace('#','');
    return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  }
  const m=s.match(/rgb\((\d+),(\d+),(\d+)\)/);
  if(m)return[+m[1],+m[2],+m[3]];
  return[128,128,128];
}
function blendColor(h1,h2,t){
  const [r1,g1,b1]=parseColor(h1),[r2,g2,b2]=parseColor(h2);
  return`rgb(${Math.round(r1*(1-t)+r2*t)},${Math.round(g1*(1-t)+g2*t)},${Math.round(b1*(1-t)+b2*t)})`;
}

/* ── CLICK/DRAG ON CIRCUIT ── */
cCirc.addEventListener('mousedown',e=>{
  if(S.srcKind==='none')return;
  moveSrc(e.offsetX,e.offsetWidth||cCirc.offsetWidth);
});
cCirc.addEventListener('mousemove',e=>{
  if(e.buttons!==1||S.srcKind==='none')return;
  moveSrc(e.offsetX,e.offsetWidth||cCirc.offsetWidth);
});
cCirc.addEventListener('touchmove',e=>{
  if(S.srcKind==='none')return;
  e.preventDefault();
  const r=cCirc.getBoundingClientRect();
  moveSrc(e.touches[0].clientX-r.left,cCirc.offsetWidth);
},{passive:false});

function moveSrc(px,W){
  const vX=W*.13, sX=W*.87; // woltomierz lewa, spoina prawa
  const x=Math.max(0.05,Math.min(0.95,(px-vX)/(sX-vX)));
  S.srcPos=x;
  g('slPos').value=Math.round(x*100);
  slPct(g('slPos'));
  g('vPos').textContent=Math.round(x*100)+'%';
  needDraw=true;
}

/* ── ANIMATION LOOP ── */
let needDraw=true, animT_=0;
function frame(){
  animT_+=0.016;
  if(needDraw){
    drawCircuit(animT_);
    drawTemp();
    drawSegs();
    drawVolt();
    updateRbar();
    updateExpl();
    needDraw=false;
  } else {
    drawCircuit(animT_); // always animate circuit (particles)
  }
  requestAnimationFrame(frame);
}

/* ── INIT ── */
[g('slTx'),g('slT0'),g('slN'),g('slPos'),g('slDT')].forEach(el=>slPct(el));
window.addEventListener('resize',()=>{needDraw=true;});
window.addEventListener('message',e=>{
  if(e.data?.type==='setTheme'){
    document.body.classList.toggle('light',!e.data.dark);
    needDraw=true;
  }
});

// ResizeObserver — pewny start gdy canvas ma prawidłowe wymiary (działa w srcdoc iframe)
let loopStarted=false;
function startLoop(){
  if(loopStarted)return;
  loopStarted=true;
  needDraw=true;
  requestAnimationFrame(frame);
}

if(typeof ResizeObserver!=='undefined'){
  const ro=new ResizeObserver(()=>{needDraw=true; startLoop();});
  ro.observe(cCirc);
} else {
  // Fallback: multiple rAF attempts
  let attempts=0;
  function tryStart(){
    attempts++;
    needDraw=true;
    startLoop();
    if(attempts<5) requestAnimationFrame(tryStart);
  }
  requestAnimationFrame(()=>requestAnimationFrame(tryStart));
}
// Bezpiecznik — zawsze startuj po 300ms
setTimeout(startLoop, 300);
</script>
