<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termopary — AGH Metrologia</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#07070a;color:#e8e4de;font-family:'IBM Plex Sans',sans-serif;overflow:hidden;}

/* ── NAV ── */
nav{
  display:flex;align-items:stretch;
  background:#0f0f15;border-bottom:1px solid #22222e;
  height:44px;flex-shrink:0;
}
.nav-brand{
  display:flex;align-items:center;gap:.5rem;
  padding:0 1rem;border-right:1px solid #22222e;flex-shrink:0;
}
.nav-brand span{font-family:'Playfair Display',serif;font-size:.95rem;color:#f59e0b;}
.nav-brand sub{font-size:.6rem;color:#6b6b80;font-family:'IBM Plex Mono',monospace;}

.tabs{display:flex;align-items:stretch;flex:1;overflow-x:auto;}
.tab{
  display:flex;align-items:center;gap:.45rem;
  padding:0 1.1rem;cursor:pointer;border:none;background:none;
  color:#6b6b80;font-size:.78rem;font-family:'IBM Plex Sans',sans-serif;
  border-right:1px solid #22222e;white-space:nowrap;
  position:relative;transition:color .15s,background .15s;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{background:rgba(245,158,11,.05);color:#e8e4de;}
.tab.active{
  color:#f59e0b;background:rgba(245,158,11,.07);
  border-bottom-color:#f59e0b;
}
.tab .ico{font-size:1rem;}
.tab .lbl{font-weight:500;}
.tab .sub{font-size:.65rem;color:#6b6b80;font-family:'IBM Plex Mono',monospace;}
.tab.active .sub{color:#92621a;}

/* loading badge */
.tab .badge{
  font-size:.6rem;font-family:'IBM Plex Mono',monospace;
  background:#1a1a24;border:1px solid #2d2d3d;color:#6b6b80;
  padding:.05rem .3rem;border-radius:3px;margin-left:.1rem;
}
.tab.active .badge{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.3);color:#f59e0b;}

.nav-right{
  margin-left:auto;display:flex;align-items:center;
  padding:0 .8rem;gap:.5rem;flex-shrink:0;border-left:1px solid #22222e;
}
.nav-right a{
  font-size:.67rem;color:#6b6b80;text-decoration:none;
  font-family:'IBM Plex Mono',monospace;
  padding:.18rem .4rem;border:1px solid #22222e;border-radius:3px;
  transition:color .15s,border-color .15s;
}
.nav-right a:hover{color:#f59e0b;border-color:#f59e0b;}

/* ── FRAME CONTAINER ── */
.frames{position:relative;flex:1;height:calc(100vh - 44px);}
iframe{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;display:none;
}
iframe.visible{display:block;}

/* ── SPLASH (loading) ── */
.splash{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.7rem;
  background:#07070a;color:#6b6b80;font-size:.8rem;
  pointer-events:none;transition:opacity .3s;
}
.splash.hidden{opacity:0;}
.spinner{
  width:28px;height:28px;border:2px solid #22222e;
  border-top-color:#f59e0b;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body style="display:flex;flex-direction:column;">

<nav>
  <div class="nav-brand">
    <span>⚡ Termopary</span>
    <sub>AGH · WEAIiIB</sub>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab0" onclick="switchTab(0)">
      <span class="ico">🌡️</span>
      <span class="lbl">Symulator pomiaru</span>
      <span class="sub">E(T), budżet błędów</span>
      <span class="badge">v1.1.0</span>
    </button>
    <button class="tab" id="tab1" onclick="switchTab(1)">
      <span class="ico">⚛️</span>
      <span class="lbl">Efekt Seebecka</span>
      <span class="sub">rozkład T(x), gęstość e⁻</span>
      <span class="badge">v1.2</span>
    </button>
  </div>

  <div class="nav-right">
    <a href="https://github.com/Mirek-Socha/SymulatorTermopary" target="_blank" rel="noopener">⎇ GitHub</a>
    <a href="https://www.agh.edu.pl" target="_blank" rel="noopener">AGH</a>
  </div>
</nav>

<div class="frames" id="frames">
  <iframe id="f0" src="SymulatorTermopary.html" class="visible"
          onload="onFrameLoad(0)"></iframe>
  <iframe id="f1" src="SeebeckVizualizacja.html"
          onload="onFrameLoad(1)"></iframe>

  <div class="splash" id="splash0">
    <div class="spinner"></div>
    <span>Ładowanie symulatora…</span>
  </div>
  <div class="splash hidden" id="splash1">
    <div class="spinner"></div>
    <span>Ładowanie wizualizacji…</span>
  </div>
</div>

<script>
let active=0;
const loaded=[false,false];

function switchTab(idx){
  if(active===idx)return;
  active=idx;
  [0,1].forEach(i=>{
    document.getElementById('tab'+i).classList.toggle('active',i===idx);
    document.getElementById('f'+i).classList.toggle('visible',i===idx);
    const sp=document.getElementById('splash'+i);
    if(sp) sp.classList.toggle('hidden', i!==idx || loaded[i]);
  });
}

function onFrameLoad(idx){
  loaded[idx]=true;
  const sp=document.getElementById('splash'+idx);
  if(sp) sp.classList.add('hidden');
}
</script>
</body>
</html>
